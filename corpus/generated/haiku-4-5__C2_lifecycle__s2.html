<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #messages-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .message.user .message-content {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.assistant .message-content {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        .message-role {
            font-weight: 600;
            font-size: 0.875rem;
            color: #666;
            align-self: flex-end;
            margin-bottom: 4px;
        }

        .message.user .message-role {
            order: 2;
            color: #0056b3;
        }

        .message.assistant .message-role {
            order: 1;
            color: #495057;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message.user .message-wrapper {
            align-items: flex-end;
        }

        .message.assistant .message-wrapper {
            align-items: flex-start;
        }

        #input-area {
            border-top: 1px solid #ddd;
            padding: 16px;
            background: white;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        #prompt {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
        }

        #prompt:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        #send {
            background: #007bff;
            color: white;
        }

        #send:hover:not(:disabled) {
            background: #0056b3;
        }

        #send:active:not(:disabled) {
            transform: scale(0.98);
        }

        #send:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #stop, #regenerate {
            background: #6c757d;
            color: white;
            display: none;
        }

        #stop:hover:not(:disabled), #regenerate:hover:not(:disabled) {
            background: #5a6268;
        }

        #stop:disabled, #regenerate:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #stop.visible, #regenerate.visible {
            display: inline-block;
        }

        .status-message {
            font-size: 0.875rem;
            color: #666;
            padding: 8px 0;
            min-height: 1.25rem;
        }

        .status-message.error {
            color: #dc3545;
        }

        .status-message.success {
            color: #28a745;
        }

        .status-message.info {
            color: #17a2b8;
        }

        /* Screen reader only text */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* Live region for screen reader announcements */
        [role="status"] {
            position: relative;
        }

        @media (max-width: 600px) {
            .message-content {
                max-width: 85%;
            }

            button {
                padding: 10px 16px;
                font-size: 0.95rem;
            }

            #input-area {
                flex-direction: column;
            }

            #prompt {
                min-width: 100%;
            }

            .button-group {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages-box" role="log" aria-label="Chat conversation" aria-live="polite" aria-atomic="false"></div>
        <div id="input-area">
            <textarea
                id="prompt"
                placeholder="Type your message here..."
                aria-label="Message input"
                rows="1"
            ></textarea>
            <div class="button-group">
                <button id="send" aria-label="Send message">Send</button>
                <button id="stop" aria-label="Stop generating response" class="">Stop</button>
                <button id="regenerate" aria-label="Regenerate last response" class="">Regenerate</button>
            </div>
        </div>
        <div id="status" class="status-message" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <script>
        // State management
        const state = {
            messages: [],
            isGenerating: false,
            currentStreamHandle: null,
            lastUserMessageIndex: null,
            conversationStarted: false,
        };

        // DOM elements
        const promptInput = document.getElementById('prompt');
        const sendButton = document.getElementById('send');
        const stopButton = document.getElementById('stop');
        const regenerateButton = document.getElementById('regenerate');
        const messagesBox = document.getElementById('messages-box');
        const statusDiv = document.getElementById('status');

        // Utility: Auto-grow textarea
        function autoGrowTextarea(textarea) {
            textarea.style.height = 'auto';
            const scrollHeight = textarea.scrollHeight;
            textarea.style.height = Math.min(scrollHeight, 120) + 'px';
        }

        promptInput.addEventListener('input', function () {
            autoGrowTextarea(this);
        });

        promptInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Announce status to screen readers
        function announceStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = 'status-message';
            if (type) {
                statusDiv.classList.add(type);
            }
        }

        // Add message to conversation
        function addMessage(role, content) {
            state.messages.push({ role, content });
            renderMessage(role, content);
        }

        // Render a single message
        function renderMessage(role, content, isStreaming = false) {
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;

            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';

            const roleLabel = document.createElement('div');
            roleLabel.className = 'message-role';
            roleLabel.textContent = role === 'user' ? 'You' : 'Assistant';

            const contentEl = document.createElement('div');
            contentEl.className = 'message-content';
            contentEl.textContent = content;

            // Use aria-live for streaming updates without re-reading entire message
            if (isStreaming) {
                contentEl.setAttribute('aria-live', 'off');
                contentEl.setAttribute('id', 'streaming-content');
            }

            wrapper.appendChild(roleLabel);
            wrapper.appendChild(contentEl);
            messageEl.appendChild(wrapper);

            messagesBox.appendChild(messageEl);
            messagesBox.scrollTop = messagesBox.scrollHeight;

            return contentEl;
        }

        // Update the last assistant message with new streaming content
        function appendToLastAssistantMessage(chunk) {
            const lastMessage = state.messages[state.messages.length - 1];
            if (lastMessage && lastMessage.role === 'assistant') {
                lastMessage.content += chunk;

                // Find the content element and update it
                const streamingContent = document.getElementById('streaming-content');
                if (streamingContent) {
                    streamingContent.textContent = lastMessage.content;
                }
            }
        }

        // Send message
        function sendMessage() {
            const messageText = promptInput.value.trim();
            if (!messageText || state.isGenerating) return;

            // Add user message
            addMessage('user', messageText);
            promptInput.value = '';
            autoGrowTextarea(promptInput);

            state.conversationStarted = true;
            state.lastUserMessageIndex = state.messages.length - 1;

            // Start generating assistant response
            generateResponse();
        }

        // Generate response from assistant
        function generateResponse() {
            state.isGenerating = true;
            sendButton.disabled = true;
            stopButton.classList.add('visible');
            regenerateButton.classList.remove('visible');
            promptInput.disabled = true;

            announceStatus('Assistant is generating response...', 'info');

            // Add empty assistant message
            addMessage('assistant', '');

            const messagesCopy = JSON.parse(JSON.stringify(state.messages));

            // Call the streaming API
            state.currentStreamHandle = window.ChatSDK.streamChat(
                messagesCopy,
                {
                    onToken: (text) => {
                        if (state.isGenerating) {
                            appendToLastAssistantMessage(text);
                        }
                    },
                    onDone: () => {
                        finishGeneration();
                    },
                    onError: (error) => {
                        endGenerationWithError(error);
                    },
                }
            );
        }

        // Finish generation successfully
        function finishGeneration() {
            state.isGenerating = false;
            state.currentStreamHandle = null;
            sendButton.disabled = false;
            stopButton.classList.remove('visible');
            regenerateButton.classList.add('visible');
            promptInput.disabled = false;
            promptInput.focus();

            announceStatus('Response generated successfully', 'success');

            // Remove streaming ID
            const streamingContent = document.getElementById('streaming-content');
            if (streamingContent) {
                streamingContent.removeAttribute('id');
                streamingContent.removeAttribute('aria-live');
            }
        }

        // Stop generation
        function stopGeneration() {
            if (!state.isGenerating || !state.currentStreamHandle) return;

            state.isGenerating = false;
            state.currentStreamHandle.abort();
            state.currentStreamHandle = null;

            sendButton.disabled = false;
            stopButton.classList.remove('visible');
            regenerateButton.classList.add('visible');
            promptInput.disabled = false;
            promptInput.focus();

            announceStatus('Response generation stopped', 'info');

            // Remove streaming ID
            const streamingContent = document.getElementById('streaming-content');
            if (streamingContent) {
                streamingContent.removeAttribute('id');
                streamingContent.removeAttribute('aria-live');
            }
        }

        // End generation with error
        function endGenerationWithError(error) {
            state.isGenerating = false;
            state.currentStreamHandle = null;
            sendButton.disabled = false;
            stopButton.classList.remove('visible');
            regenerateButton.classList.add('visible');
            promptInput.disabled = false;
            promptInput.focus();

            const errorMessage = error?.message || 'An error occurred while generating the response';
            announceStatus(`Error: ${errorMessage}`, 'error');

            // Remove streaming ID
            const streamingContent = document.getElementById('streaming-content');
            if (streamingContent) {
                streamingContent.removeAttribute('id');
                streamingContent.removeAttribute('aria-live');
            }
        }

        // Regenerate last response
        function regenerateResponse() {
            if (state.isGenerating || state.lastUserMessageIndex === null) return;

            // Remove the last assistant message if it exists
            if (
                state.messages.length > state.lastUserMessageIndex + 1 &&
                state.messages[state.messages.length - 1].role === 'assistant'
            ) {
                state.messages.pop();

                // Remove the last message from the DOM
                const messages = messagesBox.querySelectorAll('.message');
                if (messages.length > 0) {
                    messages[messages.length - 1].remove();
                }
            }

            announceStatus('Regenerating response...', 'info');
            generateResponse();
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        stopButton.addEventListener('click', stopGeneration);
        regenerateButton.addEventListener('click', regenerateResponse);

        // Initialize
        promptInput.focus();
        announceStatus('Chat ready. Type a message and press Send or Shift+Enter.', 'success');
    </script>
</body>
</html>
