<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            padding: 16px 20px;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            font-size: 18px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .message.user .message-label {
            text-align: right;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .status-indicator {
            display: none;
            align-self: flex-start;
            padding: 8px 16px;
            font-size: 14px;
            color: #666;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .status-indicator.visible {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator.generating {
            color: #2563eb;
        }

        .status-indicator.stopped {
            color: #f59e0b;
        }

        .status-indicator.finished {
            color: #10b981;
        }

        .status-indicator.error {
            color: #ef4444;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: currentColor;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        .chat-input-area {
            padding: 16px 20px;
            background: #fff;
            border-top: 1px solid #e0e0e0;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        #prompt {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d0d0d0;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        #prompt:focus {
            border-color: #2563eb;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #send {
            background: #2563eb;
            color: #fff;
        }

        #send:hover:not(:disabled) {
            background: #1d4ed8;
        }

        #stop {
            background: #f59e0b;
            color: #fff;
        }

        #stop:hover:not(:disabled) {
            background: #d97706;
        }

        #regenerate {
            background: #10b981;
            color: #fff;
        }

        #regenerate:hover:not(:disabled) {
            background: #059669;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-end;
        }

        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Chat Assistant</div>
        <div class="chat-messages" id="messages">
            <div class="empty-state" id="empty-state">Start a conversation by typing a message below.</div>
        </div>
        <div class="status-indicator" id="status">
            <span id="status-text"></span>
            <div class="typing-dots" id="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="input-row">
                <input type="text" id="prompt" placeholder="Type your message..." autocomplete="off">
                <button class="btn" id="send">Send</button>
            </div>
            <div class="button-row">
                <button class="btn" id="stop" disabled>Stop</button>
                <button class="btn" id="regenerate" disabled>Regenerate</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const messagesContainer = document.getElementById('messages');
            const emptyState = document.getElementById('empty-state');
            const promptInput = document.getElementById('prompt');
            const sendBtn = document.getElementById('send');
            const stopBtn = document.getElementById('stop');
            const regenerateBtn = document.getElementById('regenerate');
            const statusIndicator = document.getElementById('status');
            const statusText = document.getElementById('status-text');
            const typingDots = document.getElementById('typing-dots');

            let conversationHistory = [];
            let currentHandle = null;
            let isGenerating = false;
            let currentAssistantMessageEl = null;

            function setStatus(type, message) {
                statusIndicator.className = 'status-indicator';
                typingDots.style.display = 'none';
                
                if (type) {
                    statusIndicator.classList.add('visible', type);
                    statusText.textContent = message;
                    if (type === 'generating') {
                        typingDots.style.display = 'flex';
                    }
                }
            }

            function clearStatus() {
                statusIndicator.className = 'status-indicator';
            }

            function updateButtonStates() {
                sendBtn.disabled = isGenerating || !promptInput.value.trim();
                stopBtn.disabled = !isGenerating;
                regenerateBtn.disabled = isGenerating || conversationHistory.length === 0 || 
                    conversationHistory[conversationHistory.length - 1].role !== 'assistant';
            }

            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function createMessageElement(role, content) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}`;
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'message-label';
                labelDiv.textContent = role === 'user' ? 'You' : 'Assistant';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;
                
                messageDiv.appendChild(labelDiv);
                messageDiv.appendChild(contentDiv);
                
                return messageDiv;
            }

            function addMessageToUI(role, content) {
                if (emptyState) {
                    emptyState.style.display = 'none';
                }
                const messageEl = createMessageElement(role, content);
                messagesContainer.appendChild(messageEl);
                scrollToBottom();
                return messageEl;
            }

            function startStream(messages) {
                isGenerating = true;
                updateButtonStates();
                setStatus('generating', 'Generating');
                
                currentAssistantMessageEl = addMessageToUI('assistant', '');
                const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                let accumulatedContent = '';

                currentHandle = window.ChatSDK.streamChat(messages, {
                    onToken: function(text) {
                        accumulatedContent += text;
                        contentEl.textContent = accumulatedContent;
                        scrollToBottom();
                    },
                    onDone: function() {
                        conversationHistory.push({ role: 'assistant', content: accumulatedContent });
                        isGenerating = false;
                        currentHandle = null;
                        currentAssistantMessageEl = null;
                        setStatus('finished', 'Finished');
                        setTimeout(clearStatus, 2000);
                        updateButtonStates();
                    },
                    onError: function(error) {
                        isGenerating = false;
                        currentHandle = null;
                        if (accumulatedContent) {
                            conversationHistory.push({ role: 'assistant', content: accumulatedContent });
                        } else if (currentAssistantMessageEl) {
                            currentAssistantMessageEl.remove();
                        }
                        currentAssistantMessageEl = null;
                        setStatus('error', 'Error: ' + (error.message || 'Something went wrong'));
                        updateButtonStates();
                    }
                });
            }

            function sendMessage() {
                const content = promptInput.value.trim();
                if (!content || isGenerating) return;

                conversationHistory.push({ role: 'user', content: content });
                addMessageToUI('user', content);
                promptInput.value = '';
                updateButtonStates();

                startStream([...conversationHistory]);
            }

            function stopGeneration() {
                if (currentHandle && isGenerating) {
                    currentHandle.abort();
                    
                    if (currentAssistantMessageEl) {
                        const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                        const partialContent = contentEl.textContent;
                        if (partialContent) {
                            conversationHistory.push({ role: 'assistant', content: partialContent });
                        } else {
                            currentAssistantMessageEl.remove();
                        }
                    }
                    
                    isGenerating = false;
                    currentHandle = null;
                    currentAssistantMessageEl = null;
                    setStatus('stopped', 'Stopped');
                    setTimeout(clearStatus, 2000);
                    updateButtonStates();
                }
            }

            function regenerate() {
                if (isGenerating || conversationHistory.length === 0) return;

                if (conversationHistory[conversationHistory.length - 1].role === 'assistant') {
                    conversationHistory.pop();
                    const lastMessageEl = messagesContainer.querySelector('.message.assistant:last-of-type');
                    if (lastMessageEl) {
                        lastMessageEl.remove();
                    }
                }

                startStream([...conversationHistory]);
            }

            sendBtn.addEventListener('click', sendMessage);
            
            promptInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            promptInput.addEventListener('input', updateButtonStates);

            stopBtn.addEventListener('click', stopGeneration);
            
            regenerateBtn.addEventListener('click', regenerate);

            updateButtonStates();
        })();
    </script>
</body>
</html>
