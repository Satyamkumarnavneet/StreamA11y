<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat assistant</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1b1b1b;
    --muted: #4a4a4a;
    --border: #6b6b6b;
    --user-bg: #eef2fb;
    --assistant-bg: #f7f7f7;
    --assistant-border: #c8c8c8;
    --primary: #1a4fb8;
    --primary-text: #ffffff;
    --focus: #0a3d91;
    --error: #9b0000;
    --disabled-bg: #e6e6e6;
    --disabled-border: #767676;
    --disabled-text: #595959;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .skip-link {
    position: absolute;
    left: 8px;
    top: 8px;
    transform: translateY(-250%);
    background: #ffffff;
    color: var(--text);
    padding: 8px 12px;
    border: 2px solid var(--focus);
    border-radius: 4px;
    z-index: 10;
    text-decoration: underline;
  }

  .skip-link:focus {
    transform: none;
  }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 820px;
    margin: 0 auto;
    padding: 16px;
  }

  header h1 {
    font-size: 1.5rem;
    margin: 8px 0 12px;
  }

  .status {
    margin: 0 0 8px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #ffffff;
    font-weight: 600;
  }

  .alert {
    margin: 0 0 8px;
    color: var(--error);
    font-weight: 600;
  }

  .alert:empty {
    display: none;
  }

  .conversation {
    flex: 1;
    min-height: 40vh;
    max-height: 60vh;
    overflow-y: auto;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #ffffff;
  }

  .empty {
    color: var(--muted);
    margin: 16px 8px;
  }

  .message {
    padding: 12px 16px;
    margin: 8px 0;
    border-radius: 8px;
  }

  .message.user {
    background: var(--user-bg);
  }

  .message.assistant {
    background: var(--assistant-bg);
    border: 1px solid var(--assistant-border);
  }

  .role {
    display: block;
    font-weight: 600;
    font-size: 0.875rem;
    color: var(--muted);
  }

  .content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 4px 0 0;
  }

  .meta {
    margin: 6px 0 0;
    font-size: 0.875rem;
    color: var(--muted);
  }

  .meta.error {
    color: var(--error);
    font-weight: 600;
  }

  .meta[hidden] {
    display: none;
  }

  .composer {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }

  .composer label {
    font-weight: 600;
  }

  textarea {
    width: 100%;
    min-height: 5rem;
    font: inherit;
    color: var(--text);
    background: #ffffff;
    padding: 10px;
    border: 2px solid var(--border);
    border-radius: 6px;
    resize: vertical;
  }

  .hint {
    margin: 0;
    font-size: 0.875rem;
    color: var(--muted);
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }

  button {
    min-height: 44px;
    min-width: 44px;
    padding: 8px 16px;
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: #ffffff;
    border: 2px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }

  button.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-text);
  }

  button[aria-disabled="true"] {
    background: var(--disabled-bg);
    border-color: var(--disabled-border);
    color: var(--disabled-text);
    cursor: not-allowed;
  }

  @media (max-width: 480px) {
    .buttons button {
      flex: 1 1 auto;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      scroll-behavior: auto !important;
      transition: none !important;
      animation: none !important;
    }
  }

  @media (forced-colors: active) {
    button, textarea, .conversation, .status {
      border: 2px solid ButtonText;
    }
  }
</style>
</head>
<body>
  <a class="skip-link" href="#prompt">Skip to message box</a>

  <div class="app">
    <header>
      <h1>Chat assistant</h1>
    </header>

    <p id="status" class="status" role="status">Ready.</p>
    <p id="alert" class="alert" role="alert"></p>

    <section id="conversation" class="conversation" aria-label="Conversation" tabindex="0">
      <p id="empty" class="empty">No messages yet. Type a message below to start.</p>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label for="prompt">Your message</label>
      <textarea id="prompt" name="prompt" rows="3" aria-describedby="prompt-hint"></textarea>
      <p id="prompt-hint" class="hint">Press Enter to send. Press Shift+Enter for a new line.</p>
      <div class="buttons">
        <button type="submit" id="send" class="primary" aria-disabled="false">Send</button>
        <button type="button" id="stop" aria-disabled="true">Stop</button>
        <button type="button" id="regenerate" aria-disabled="true">Regenerate</button>
      </div>
    </form>
  </div>

<script>
(function () {
  'use strict';

  var conv = document.getElementById('conversation');
  var emptyEl = document.getElementById('empty');
  var statusEl = document.getElementById('status');
  var alertEl = document.getElementById('alert');
  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var regenBtn = document.getElementById('regenerate');
  var form = document.getElementById('composer');

  // Conversation turns: { role, content, state, errorText, el, body, meta }
  var turns = [];
  // Currently streaming session, or null.
  var session = null;

  function sdkAvailable() {
    return !!(window.ChatSDK && typeof window.ChatSDK.streamChat === 'function');
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function setAlert(text) {
    alertEl.textContent = text;
  }

  function setAria(btn, disabled) {
    btn.setAttribute('aria-disabled', disabled ? 'true' : 'false');
  }

  function updateControls() {
    var busy = session !== null;
    var hasUser = false;
    for (var i = 0; i < turns.length; i++) {
      if (turns[i].role === 'user') { hasUser = true; break; }
    }
    setAria(sendBtn, busy || !sdkAvailable());
    setAria(stopBtn, !busy);
    setAria(regenBtn, busy || !hasUser || !sdkAvailable());
  }

  function errorText(err) {
    var msg = '';
    if (err && typeof err === 'object') {
      msg = err.message || err.name || '';
    } else if (err != null) {
      msg = String(err);
    }
    msg = msg.trim();
    if (!msg) { msg = 'Unknown error'; }
    return msg.length > 200 ? msg.slice(0, 200) + '…' : msg;
  }

  function scrollToBottomIfNear() {
    var near = conv.scrollHeight - conv.scrollTop - conv.clientHeight < 120;
    if (near) { conv.scrollTop = conv.scrollHeight; }
  }

  function renderMeta(turn) {
    if (turn.role !== 'assistant') { return; }
    var text = '';
    var cls = 'meta';
    switch (turn.state) {
      case 'generating':
        text = 'Generating answer…';
        break;
      case 'done':
        text = 'Finished';
        if (!turn.content) {
          turn.body.textContent = 'The assistant returned no text.';
        }
        break;
      case 'stopped':
        text = 'Stopped. The partial answer is kept.';
        break;
      case 'error':
        text = 'Error: ' + (turn.errorText || 'the answer could not be completed.');
        cls = 'meta error';
        break;
    }
    turn.meta.className = cls;
    turn.meta.textContent = text;
    turn.meta.hidden = !text;
  }

  function addTurn(role, content) {
    var el = document.createElement('article');
    el.className = 'message ' + role;
    el.setAttribute('aria-label', role === 'user' ? 'You' : 'Assistant');

    var label = document.createElement('span');
    label.className = 'role';
    label.textContent = role === 'user' ? 'You' : 'Assistant';

    var body = document.createElement('div');
    body.className = 'content';
    body.textContent = content;

    var meta = document.createElement('p');
    meta.className = 'meta';
    meta.hidden = true;

    el.appendChild(label);
    el.appendChild(body);
    el.appendChild(meta);
    conv.appendChild(el);

    var turn = {
      role: role,
      content: content,
      state: 'done',
      errorText: '',
      el: el,
      body: body,
      meta: meta
    };
    turns.push(turn);

    emptyEl.hidden = true;
    conv.scrollTop = conv.scrollHeight;
    renderMeta(turn);
    return turn;
  }

  function removeTurnsAfter(index) {
    while (turns.length > index + 1) {
      var t = turns.pop();
      t.el.parentNode.removeChild(t.el);
    }
  }

  function findLastUserIndex() {
    for (var i = turns.length - 1; i >= 0; i--) {
      if (turns[i].role === 'user') { return i; }
    }
    return -1;
  }

  function finish(s, outcome, err) {
    if (s.closed) { return; }
    s.closed = true;

    var turn = s.turn;
    turn.el.removeAttribute('aria-busy');

    if (outcome === 'done') {
      turn.state = 'done';
      setStatus('Answer finished.');
    } else if (outcome === 'stopped') {
      turn.state = 'stopped';
      setStatus('Answer stopped. The partial answer is kept.');
    } else {
      turn.state = 'error';
      turn.errorText = errorText(err);
      setStatus('Error: the answer could not be completed.');
      setAlert('Error: ' + turn.errorText + '. Press Regenerate to try again.');
    }

    if (session === s) { session = null; }
    renderMeta(turn);
    updateControls();
  }

  function startAnswer() {
    var turn = addTurn('assistant', '');
    turn.state = 'generating';
    turn.el.setAttribute('aria-busy', 'true');
    renderMeta(turn);

    // History sent to the API: everything before the new empty answer,
    // skipping empty assistant entries (e.g. from earlier failed answers).
    var history = [];
    for (var i = 0; i < turns.length - 1; i++) {
      var t = turns[i];
      if (t.role === 'user' || t.content.length > 0) {
        history.push({ role: t.role, content: t.content });
      }
    }

    var s = { turn: turn, closed: false, handle: null };
    session = s;
    setStatus('Generating answer…');
    updateControls();

    var handle;
    try {
      handle = window.ChatSDK.streamChat(history, {
        onToken: function (text) {
          if (s.closed) { return; }
          turn.content += (text == null ? '' : String(text));
          turn.body.textContent = turn.content;
          scrollToBottomIfNear();
        },
        onDone: function () {
          finish(s, 'done');
        },
        onError: function (err) {
          finish(s, 'error', err);
        }
      });
    } catch (err) {
      finish(s, 'error', err);
      return;
    }

    s.handle = handle || null;
  }

  function send() {
    if (session !== null) {
      setStatus('Wait for the current answer to finish, or press Stop.');
      return;
    }
    if (!sdkAvailable()) {
      setAlert('The chat service is not available. Reload the page or try again later.');
      return;
    }
    var text = promptEl.value.trim();
    if (!text) {
      setAlert('Type a message before sending.');
      promptEl.focus();
      return;
    }
    setAlert('');
    addTurn('user', text);
    promptEl.value = '';
    startAnswer();
  }

  function regenerate() {
    if (session !== null) {
      setStatus('Wait for the current answer to finish, or press Stop.');
      return;
    }
    if (!sdkAvailable()) {
      setAlert('The chat service is not available. Reload the page or try again later.');
      return;
    }
    var idx = findLastUserIndex();
    if (idx < 0) {
      setAlert('There is no message to regenerate an answer for yet.');
      return;
    }
    setAlert('');
    removeTurnsAfter(idx);
    startAnswer();
  }

  function stop() {
    var s = session;
    if (!s) {
      setStatus('There is no answer to stop.');
      return;
    }
    try {
      if (s.handle && typeof s.handle.abort === 'function') {
        s.handle.abort();
      }
    } catch (e) {
      // The UI still stops; the server-side stream may need a reload to end.
    }
    // onDone and onError are never called after abort(), so finish here.
    // Late onToken calls are ignored because s.closed is set.
    finish(s, 'stopped');
  }

  // Events
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    send();
  });

  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  stopBtn.addEventListener('click', stop);
  regenBtn.addEventListener('click', regenerate);

  // Initial state
  if (!sdkAvailable()) {
    setStatus('Unavailable.');
    setAlert('The chat service is not available. Reload the page or try again later.');
  }
  updateControls();
})();
</script>
</body>
</html>
