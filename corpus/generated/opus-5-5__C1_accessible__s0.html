<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Assistant</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #444b53;
    --border: #6b7280;
    --primary: #0b57d0;
    --primary-hover: #0842a0;
    --danger: #b3261e;
    --danger-hover: #8c1d18;
    --user-bg: #e8f0fe;
    --assistant-bg: #f3f4f6;
    --focus: #1a1a1a;
    --error-bg: #fdecea;
    --ok: #146c2e;
  }
  * { box-sizing: border-box; }
  html { font-size: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
    color: var(--fg);
    background: var(--bg);
  }
  .skip-link {
    position: absolute;
    left: 0.5rem;
    top: -10rem;
    background: var(--fg);
    color: #fff;
    padding: 0.5rem 1rem;
    border-radius: 0.25rem;
    z-index: 10;
  }
  .skip-link:focus { top: 0.5rem; }
  .visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }
  header, main {
    max-width: 52rem;
    margin: 0 auto;
    padding: 0 1rem;
  }
  header h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
  #conversation {
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.75rem;
    min-height: 12rem;
    max-height: 60vh;
    overflow-y: auto;
  }
  #conversation:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  #message-list { list-style: none; margin: 0; padding: 0; }
  .empty { color: var(--muted); margin: 0; }
  .msg {
    margin: 0 0 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    border: 1px solid transparent;
  }
  .msg:last-child { margin-bottom: 0; }
  .msg.user { background: var(--user-bg); border-color: #a8c1f0; }
  .msg.assistant { background: var(--assistant-bg); border-color: #c4c7cc; }
  .msg h2 {
    font-size: 0.95rem;
    margin: 0 0 0.25rem;
  }
  .msg .content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 0;
  }
  .msg .meta {
    margin: 0.5rem 0 0;
    font-size: 0.875rem;
    color: var(--muted);
    font-style: italic;
  }
  .msg .meta.error { color: var(--danger); font-style: normal; font-weight: 600; }
  .msg .meta.done { color: var(--ok); }
  #status-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.75rem 0;
    min-height: 1.5rem;
    font-weight: 600;
  }
  .indicator {
    display: inline-block;
    width: 0.75rem; height: 0.75rem;
    border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  #status-bar[data-state="generating"] .indicator { background: var(--primary); animation: pulse 1s ease-in-out infinite; }
  #status-bar[data-state="done"] .indicator { background: var(--ok); }
  #status-bar[data-state="stopped"] .indicator { background: var(--muted); }
  #status-bar[data-state="error"] .indicator { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) {
    #status-bar[data-state="generating"] .indicator { animation: none; }
  }
  #error {
    margin: 0 0 0.75rem;
  }
  #error:not(:empty) {
    padding: 0.5rem 0.75rem;
    border: 2px solid var(--danger);
    background: var(--error-bg);
    color: var(--danger);
    border-radius: 0.375rem;
    font-weight: 600;
  }
  form { margin: 0 0 2rem; }
  label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
  #prompt {
    display: block;
    width: 100%;
    min-height: 5rem;
    padding: 0.5rem 0.75rem;
    font: inherit;
    color: var(--fg);
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 0.375rem;
    resize: vertical;
  }
  #prompt:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  #prompt[aria-invalid="true"] { border-color: var(--danger); }
  .hint { font-size: 0.875rem; color: var(--muted); margin: 0.25rem 0 0; }
  #prompt-error { color: var(--danger); font-weight: 600; margin: 0.25rem 0 0; }
  #prompt-error:empty { display: none; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }
  button {
    font: inherit;
    font-weight: 600;
    min-height: 2.75rem;
    min-width: 2.75rem;
    padding: 0.5rem 1.25rem;
    border-radius: 0.375rem;
    border: 2px solid transparent;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #send { background: var(--primary); color: #fff; }
  #send:hover { background: var(--primary-hover); }
  #stop { background: var(--danger); color: #fff; }
  #stop:hover { background: var(--danger-hover); }
  #regenerate { background: #fff; color: var(--primary); border-color: var(--primary); }
  #regenerate:hover { background: var(--user-bg); }
  button[aria-disabled="true"],
  button[aria-disabled="true"]:hover {
    background: #e5e7eb;
    color: #4b5563;
    border-color: #9ca3af;
    cursor: not-allowed;
  }
  @media (forced-colors: active) {
    button[aria-disabled="true"] { color: GrayText; border-color: GrayText; }
    .indicator { forced-color-adjust: none; border: 1px solid CanvasText; }
    .msg { border-color: CanvasText; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#prompt">Skip to message box</a>
<header>
  <h1>Chat Assistant</h1>
</header>
<main>
  <section id="conversation" tabindex="0" aria-labelledby="conversation-heading">
    <h2 id="conversation-heading" class="visually-hidden">Conversation</h2>
    <p id="empty" class="empty">No messages yet. Type a message below to start.</p>
    <ol id="message-list"></ol>
  </section>

  <div id="status-bar" data-state="idle">
    <span class="indicator" aria-hidden="true"></span>
    <span id="status" role="status" aria-live="polite" aria-atomic="true">Ready.</span>
  </div>
  <div id="error" role="alert" aria-atomic="true"></div>

  <form id="chat-form" novalidate>
    <label for="prompt">Message</label>
    <textarea id="prompt" name="prompt" rows="3" aria-describedby="prompt-hint prompt-error" autocomplete="off"></textarea>
    <p id="prompt-hint" class="hint">Press Enter to send, Shift+Enter for a new line, Escape to stop a response that is being generated.</p>
    <p id="prompt-error" aria-live="off"></p>
    <div class="actions">
      <button type="submit" id="send">Send</button>
      <button type="button" id="stop" aria-disabled="true">Stop</button>
      <button type="button" id="regenerate" aria-disabled="true">Regenerate</button>
    </div>
  </form>
</main>

<script>
(function () {
  'use strict';

  var els = {
    conversation: document.getElementById('conversation'),
    list: document.getElementById('message-list'),
    empty: document.getElementById('empty'),
    statusBar: document.getElementById('status-bar'),
    status: document.getElementById('status'),
    error: document.getElementById('error'),
    form: document.getElementById('chat-form'),
    prompt: document.getElementById('prompt'),
    promptError: document.getElementById('prompt-error'),
    send: document.getElementById('send'),
    stop: document.getElementById('stop'),
    regenerate: document.getElementById('regenerate')
  };

  var state = {
    messages: [],   // {id, role, content, status}
    active: null,   // {reqId, handle, msg}
    nextId: 1,
    reqCounter: 0
  };
  var nodes = {};   // message id -> {li, content, meta}
  var announceTimer = null;

  function isStreaming() { return state.active !== null; }

  function isNearBottom() {
    var c = els.conversation;
    return c.scrollHeight - c.scrollTop - c.clientHeight < 40;
  }
  function scrollToBottom() {
    els.conversation.scrollTop = els.conversation.scrollHeight;
  }

  function setStatus(text, kind) {
    els.statusBar.setAttribute('data-state', kind || 'idle');
    // Clear then set so repeated identical messages are still announced.
    if (announceTimer) clearTimeout(announceTimer);
    els.status.textContent = '';
    announceTimer = setTimeout(function () { els.status.textContent = text; }, 50);
  }

  function setError(text) {
    els.error.textContent = '';
    if (text) {
      setTimeout(function () { els.error.textContent = text; }, 50);
    }
  }

  function setPromptError(text) {
    els.promptError.textContent = text || '';
    if (text) els.prompt.setAttribute('aria-invalid', 'true');
    else els.prompt.removeAttribute('aria-invalid');
  }

  function lastUserIndex() {
    for (var i = state.messages.length - 1; i >= 0; i--) {
      if (state.messages[i].role === 'user') return i;
    }
    return -1;
  }

  function updateButtons() {
    var streaming = isStreaming();
    els.send.setAttribute('aria-disabled', streaming ? 'true' : 'false');
    els.stop.setAttribute('aria-disabled', streaming ? 'false' : 'true');
    els.regenerate.setAttribute('aria-disabled', (!streaming && lastUserIndex() !== -1) ? 'false' : 'true');
  }

  function metaText(msg) {
    switch (msg.status) {
      case 'streaming': return 'Generating…';
      case 'done': return 'Finished.';
      case 'stopped': return msg.content ? 'Stopped. Partial answer shown.' : 'Stopped before any text was received.';
      case 'error': return 'Error: ' + (msg.errorText || 'The response failed.') + (msg.content ? ' Partial answer shown.' : '');
      default: return '';
    }
  }

  function renderMessage(msg) {
    var li = document.createElement('li');
    li.className = 'msg ' + msg.role;
    var h = document.createElement('h2');
    h.textContent = msg.role === 'user' ? 'You said:' : 'Assistant said:';
    var content = document.createElement('p');
    content.className = 'content';
    content.textContent = msg.content;
    li.appendChild(h);
    li.appendChild(content);
    var meta = null;
    if (msg.role === 'assistant') {
      meta = document.createElement('p');
      meta.className = 'meta';
      li.appendChild(meta);
    }
    nodes[msg.id] = { li: li, content: content, meta: meta };
    els.list.appendChild(li);
    els.empty.hidden = true;
    updateMessage(msg);
  }

  function updateMessage(msg) {
    var n = nodes[msg.id];
    if (!n) return;
    var stick = isNearBottom();
    if (n.content.textContent !== msg.content) n.content.textContent = msg.content;
    if (n.meta) {
      n.meta.textContent = metaText(msg);
      n.meta.className = 'meta' + (msg.status === 'error' ? ' error' : msg.status === 'done' ? ' done' : '');
    }
    if (msg.status === 'streaming') n.li.setAttribute('aria-busy', 'true');
    else n.li.removeAttribute('aria-busy');
    if (stick) scrollToBottom();
  }

  function removeMessage(msg) {
    var n = nodes[msg.id];
    if (n && n.li.parentNode) n.li.parentNode.removeChild(n.li);
    delete nodes[msg.id];
  }

  function buildHistory() {
    var out = [];
    for (var i = 0; i < state.messages.length; i++) {
      var m = state.messages[i];
      if (m.role === 'assistant' && (m.status === 'streaming' || !m.content)) continue;
      out.push({ role: m.role, content: m.content });
    }
    return out;
  }

  function errorToText(e) {
    if (!e) return 'Unknown error.';
    if (typeof e === 'string') return e;
    if (e.message) return String(e.message);
    try { return String(e); } catch (x) { return 'Unknown error.'; }
  }

  function finish(msg, status, err) {
    state.active = null;
    msg.status = status;
    if (status === 'error') {
      msg.errorText = errorToText(err);
      setStatus('Error. The assistant could not finish the response.', 'error');
      setError('Error: ' + msg.errorText + ' You can try Regenerate.');
    } else if (status === 'done') {
      setStatus('Assistant finished responding.', 'done');
    } else if (status === 'stopped') {
      setStatus('Response stopped. The partial answer was kept.', 'stopped');
    }
    updateMessage(msg);
    updateButtons();
  }

  function startStream() {
    var history = buildHistory();
    var reqId = ++state.reqCounter;
    var msg = { id: state.nextId++, role: 'assistant', content: '', status: 'streaming' };
    state.messages.push(msg);
    renderMessage(msg);
    scrollToBottom();

    state.active = { reqId: reqId, handle: null, msg: msg };
    setError('');
    setStatus('Assistant is generating a response…', 'generating');
    updateButtons();

    function isCurrent() { return state.active !== null && state.active.reqId === reqId; }

    var handle = null;
    try {
      if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
        throw new Error('The chat service is not available.');
      }
      handle = window.ChatSDK.streamChat(history, {
        onToken: function (text) {
          if (!isCurrent()) return; // ignore late tokens after abort or for old requests
          if (text == null) return;
          msg.content += String(text);
          updateMessage(msg);
        },
        onDone: function () {
          if (!isCurrent()) return;
          finish(msg, 'done');
        },
        onError: function (e) {
          if (!isCurrent()) return;
          finish(msg, 'error', e);
        }
      });
    } catch (e) {
      if (isCurrent()) finish(msg, 'error', e);
      return;
    }
    if (isCurrent()) state.active.handle = handle;
  }

  function stopStream() {
    if (!isStreaming()) return false;
    var active = state.active;
    state.active = null; // invalidate first so any late token is ignored
    try {
      if (active.handle && typeof active.handle.abort === 'function') active.handle.abort();
    } catch (e) { /* ignore abort failures; we have already stopped listening */ }
    state.active = active; // finish() expects to clear it
    finish(active.msg, 'stopped');
    return true;
  }

  function sendMessage() {
    if (isStreaming()) {
      setStatus('Please wait for the current response to finish, or press Stop.', 'generating');
      return;
    }
    var text = els.prompt.value;
    if (!text.trim()) {
      setPromptError('Please type a message before sending.');
      els.prompt.focus();
      return;
    }
    setPromptError('');
    var userMsg = { id: state.nextId++, role: 'user', content: text, status: 'done' };
    state.messages.push(userMsg);
    renderMessage(userMsg);
    els.prompt.value = '';
    els.prompt.focus();
    startStream();
  }

  function regenerate() {
    if (isStreaming()) {
      setStatus('Please wait for the current response to finish, or press Stop.', 'generating');
      return;
    }
    var idx = lastUserIndex();
    if (idx === -1) {
      setStatus('There is no message to regenerate yet.', 'idle');
      return;
    }
    // Remove assistant answers after the last user message.
    var removed = state.messages.splice(idx + 1);
    for (var i = 0; i < removed.length; i++) removeMessage(removed[i]);
    startStream();
  }

  els.form.addEventListener('submit', function (e) {
    e.preventDefault();
    sendMessage();
  });

  els.send.addEventListener('click', function (e) {
    if (els.send.getAttribute('aria-disabled') === 'true') {
      e.preventDefault();
      setStatus('Please wait for the current response to finish, or press Stop.', 'generating');
    }
  });

  els.stop.addEventListener('click', function () {
    if (!stopStream()) setStatus('Nothing is being generated right now.', els.statusBar.getAttribute('data-state'));
  });

  els.regenerate.addEventListener('click', regenerate);

  els.prompt.addEventListener('input', function () {
    if (els.prompt.value.trim()) setPromptError('');
  });

  els.prompt.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      sendMessage();
    } else if (e.key === 'Escape' && isStreaming()) {
      e.preventDefault();
      stopStream();
    }
  });

  updateButtons();
})();
</script>
</body>
</html>
