<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .status-message {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 4px;
        }

        .status-generating {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-stopped {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-error {
            background: #ffebee;
            color: #d32f2f;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            gap: 12px;
        }

        #prompt {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            transition: border-color 0.2s;
        }

        #prompt:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #prompt:disabled {
            background: #f5f5f5;
            color: #999;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        #send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-width: 80px;
        }

        #send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        #send:active:not(:disabled) {
            transform: translateY(0);
        }

        #send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #stop {
            background: #ff6b6b;
            color: white;
            display: none;
        }

        #stop:hover {
            background: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 107, 107, 0.3);
        }

        #stop:active {
            transform: translateY(0);
        }

        #regenerate {
            background: #4ecdc4;
            color: white;
            display: none;
        }

        #regenerate:hover:not(:disabled) {
            background: #3dbaad;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(78, 205, 196, 0.3);
        }

        #regenerate:active:not(:disabled) {
            transform: translateY(0);
        }

        #regenerate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        .loading-dots {
            display: inline-block;
            width: 20px;
            height: 4px;
        }

        .loading-dots span {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
            margin: 0 2px;
            animation: blink 1.4s infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .message-content {
                max-width: 100%;
            }

            .input-group {
                min-width: 100%;
            }

            button {
                padding: 10px 12px;
                font-size: 13px;
            }

            #send {
                min-width: 70px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Chat Assistant</h1>
        </div>

        <div class="messages-container" id="messagesContainer" role="log" aria-label="Conversation history" aria-live="polite" aria-atomic="false">
            <div class="empty-state">Start a conversation by typing a message below</div>
        </div>

        <div class="input-area">
            <div class="input-group">
                <textarea
                    id="prompt"
                    placeholder="Type your message here..."
                    aria-label="Message input"
                    rows="1"
                ></textarea>
                <div class="button-group">
                    <button id="send" aria-label="Send message">Send</button>
                    <button id="stop" aria-label="Stop generating response">Stop</button>
                    <button id="regenerate" aria-label="Regenerate last response">Regenerate</button>
                </div>
            </div>
        </div>
    </div>

    <div class="sr-only" id="statusLive" role="status" aria-live="polite" aria-atomic="true"></div>

    <script>
        const messagesContainer = document.getElementById('messagesContainer');
        const promptInput = document.getElementById('prompt');
        const sendButton = document.getElementById('send');
        const stopButton = document.getElementById('stop');
        const regenerateButton = document.getElementById('regenerate');
        const statusLive = document.getElementById('statusLive');

        let conversationHistory = [];
        let currentStreamHandle = null;
        let isStreaming = false;
        let lastUserMessageIndex = -1;
        let currentAssistantMessageElement = null;
        let currentAssistantTokenTarget = null;

        // Auto-resize textarea
        promptInput.addEventListener('input', () => {
            promptInput.style.height = 'auto';
            promptInput.style.height = Math.min(promptInput.scrollHeight, 100) + 'px';
        });

        // Handle Enter key to send
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!isStreaming && promptInput.value.trim()) {
                    sendMessage();
                }
            }
        });

        sendButton.addEventListener('click', sendMessage);
        stopButton.addEventListener('click', stopGenerating);
        regenerateButton.addEventListener('click', regenerateLastMessage);

        function clearEmpty() {
            const empty = messagesContainer.querySelector('.empty-state');
            if (empty) {
                empty.remove();
            }
        }

        function appendMessageToDOM(role, content) {
            clearEmpty();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'You' : 'AI';
            avatar.setAttribute('aria-hidden', 'true');

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            return contentDiv;
        }

        function addStatusMessage(contentElement, type, text) {
            const status = document.createElement('div');
            status.className = `status-message status-${type}`;
            status.textContent = text;
            status.setAttribute('aria-hidden', 'true');
            contentElement.parentElement.appendChild(status);
        }

        function updateStreamingStatus(type, text) {
            statusLive.textContent = text;
        }

        function sendMessage() {
            const userMessage = promptInput.value.trim();
            if (!userMessage || isStreaming) return;

            // Add user message to history and DOM
            conversationHistory.push({ role: 'user', content: userMessage });
            lastUserMessageIndex = conversationHistory.length - 1;

            appendMessageToDOM('user', userMessage);

            // Clear input and reset height
            promptInput.value = '';
            promptInput.style.height = 'auto';

            // Start streaming assistant response
            streamAssistantResponse();
        }

        function streamAssistantResponse() {
            isStreaming = true;
            updateUIForStreaming(true);

            // Create placeholder for assistant message
            const assistantContentDiv = appendMessageToDOM('assistant', '');
            currentAssistantMessageElement = assistantContentDiv.parentElement;
            currentAssistantTokenTarget = assistantContentDiv;

            updateStreamingStatus('generating', 'Assistant is generating a response...');
            addStatusMessage(assistantContentDiv, 'generating', 'Generating...');

            let fullResponse = '';

            const onToken = (text) => {
                if (currentStreamHandle !== null) { // Only process if not aborted
                    fullResponse += text;
                    currentAssistantTokenTarget.textContent = fullResponse;
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            };

            const onDone = () => {
                if (currentStreamHandle === null) return; // Already aborted
                
                currentStreamHandle = null;
                isStreaming = false;

                // Update conversation history with complete response
                conversationHistory.push({ role: 'assistant', content: fullResponse });

                // Remove status message and update UI
                const statusMessages = currentAssistantMessageElement.querySelectorAll('.status-message');
                statusMessages.forEach(msg => msg.remove());

                updateUIForStreaming(false);
                updateStreamingStatus('done', 'Response complete.');
            };

            const onError = (error) => {
                if (currentStreamHandle === null) return; // Already aborted
                
                currentStreamHandle = null;
                isStreaming = false;

                const statusMessages = currentAssistantMessageElement.querySelectorAll('.status-message');
                statusMessages.forEach(msg => msg.remove());

                addStatusMessage(currentAssistantTokenTarget, 'error', `Error: ${error.message || 'Unknown error'}`);

                updateUIForStreaming(false);
                updateStreamingStatus('error', `Error: ${error.message || 'Unknown error'}`);
            };

            try {
                currentStreamHandle = window.ChatSDK.streamChat(conversationHistory, {
                    onToken,
                    onDone,
                    onError
                });
            } catch (error) {
                onError(error);
            }
        }

        function stopGenerating() {
            if (!isStreaming || !currentStreamHandle) return;

            currentStreamHandle.abort();
            currentStreamHandle = null;
            isStreaming = false;

            // Add the current partial response to history
            if (currentAssistantTokenTarget && conversationHistory[conversationHistory.length - 1]?.role !== 'assistant') {
                const partialContent = currentAssistantTokenTarget.textContent;
                conversationHistory.push({ role: 'assistant', content: partialContent });
            }

            // Update status
            const statusMessages = currentAssistantMessageElement.querySelectorAll('.status-message');
            statusMessages.forEach(msg => msg.remove());
            addStatusMessage(currentAssistantTokenTarget, 'stopped', 'Response stopped by user.');

            updateUIForStreaming(false);
            updateStreamingStatus('stopped', 'Response stopped by user.');

            currentAssistantMessageElement = null;
            currentAssistantTokenTarget = null;
        }

        function regenerateLastMessage() {
            if (!conversationHistory.length || conversationHistory[lastUserMessageIndex]?.role !== 'user') {
                return;
            }

            // Remove the last assistant message if it exists
            if (conversationHistory[conversationHistory.length - 1]?.role === 'assistant') {
                conversationHistory.pop();
            }

            // Remove the last assistant message from DOM
            const messages = messagesContainer.querySelectorAll('.message.assistant');
            if (messages.length > 0) {
                messages[messages.length - 1].remove();
            }

            // Start streaming new response
            streamAssistantResponse();
        }

        function updateUIForStreaming(streaming) {
            sendButton.style.display = streaming ? 'none' : 'block';
            stopButton.style.display = streaming ? 'block' : 'none';
            promptInput.disabled = streaming;

            // Only show regenerate if there's history and not streaming
            const canRegenerate = conversationHistory.length > 0 && 
                                 conversationHistory[lastUserMessageIndex]?.role === 'user' &&
                                 (conversationHistory.length === lastUserMessageIndex + 1 ||
                                  conversationHistory[lastUserMessageIndex + 1]?.role === 'assistant');
            regenerateButton.style.display = (canRegenerate && !streaming) ? 'block' : 'none';
            regenerateButton.disabled = streaming;
        }

        // Initial state
        updateUIForStreaming(false);
    </script>
</body>
</html>
