<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #4a4a4a;
    --border: #6b6b6b;
    --user-bg: #e4edfd;
    --asst-bg: #f1f2f4;
    --primary-bg: #0b57d0;
    --primary-fg: #ffffff;
    --btn-bg: #ffffff;
    --btn-fg: #1a1a1a;
    --dis-bg: #e3e3e3;
    --dis-fg: #595959;
    --dis-border: #8a8a8a;
    --focus: #0b57d0;
    --err-bg: #fdecea;
    --err-fg: #8c1d18;
    --err-border: #b3261e;
    --status-bg: #f1f2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #ececec;
      --muted: #c4c4c4;
      --border: #8f8f8f;
      --user-bg: #1f3a5f;
      --asst-bg: #262626;
      --primary-bg: #8ab4f8;
      --primary-fg: #0a1a33;
      --btn-bg: #1e1e1e;
      --btn-fg: #ececec;
      --dis-bg: #2a2a2a;
      --dis-fg: #a8a8a8;
      --dis-border: #6a6a6a;
      --focus: #8ab4f8;
      --err-bg: #3b1210;
      --err-fg: #f6c6c3;
      --err-border: #f2b8b5;
      --status-bg: #262626;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
  }

  .app {
    display: flex;
    flex-direction: column;
    max-width: 52rem;
    margin: 0 auto;
    padding: 0.75rem 1rem;
    height: 100vh;
    height: 100dvh;
    gap: 0.75rem;
  }
  h1 { font-size: 1.375rem; margin: 0; line-height: 1.3; }

  .visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    margin: -1px; padding: 0; border: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .conversation {
    flex: 1 1 auto;
    min-height: 8rem;
    overflow-y: auto;
    border: 2px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.75rem;
  }
  .messages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
  .empty { margin: 0; color: var(--muted); }

  .msg {
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.5rem 0.75rem;
    max-width: 100%;
  }
  .msg.user { background: var(--user-bg); }
  .msg.assistant { background: var(--asst-bg); }
  .who { font-weight: 700; font-size: 0.9375rem; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .note { margin-top: 0.25rem; font-size: 0.9375rem; color: var(--muted); font-style: italic; }
  .msg.error .note { color: var(--err-fg); font-style: normal; font-weight: 600; }
  .msg.error { border-color: var(--err-border); border-width: 2px; }
  .msg.stopped { border-style: dashed; border-width: 2px; }

  .feedback { display: flex; flex-direction: column; gap: 0.5rem; }
  .status {
    display: flex; gap: 0.5rem; align-items: baseline;
    min-height: 2.5rem;
    padding: 0.4rem 0.75rem;
    border-radius: 0.5rem;
    background: var(--status-bg);
    border: 1px solid var(--border);
  }
  .status .icon { font-weight: 700; min-width: 1.25rem; text-align: center; }
  #error-text {
    padding: 0.5rem 0.75rem;
    border-radius: 0.5rem;
    background: var(--err-bg);
    color: var(--err-fg);
    border: 2px solid var(--err-border);
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  #error-text:empty { display: none; }

  label { display: block; font-weight: 700; margin-bottom: 0.25rem; }
  textarea {
    display: block;
    width: 100%;
    min-height: 4.5rem;
    resize: vertical;
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.5rem 0.75rem;
  }
  textarea[aria-invalid="true"] { border-color: var(--err-border); }
  .hint { margin: 0.25rem 0 0.5rem; font-size: 0.9375rem; color: var(--muted); }

  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  button {
    font: inherit;
    font-weight: 600;
    min-height: 2.75rem;
    min-width: 2.75rem;
    padding: 0.4rem 1.1rem;
    border-radius: 0.5rem;
    border: 2px solid var(--border);
    background: var(--btn-bg);
    color: var(--btn-fg);
    cursor: pointer;
  }
  button.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: var(--primary-bg); }
  button:disabled {
    background: var(--dis-bg);
    color: var(--dis-fg);
    border-color: var(--dis-border);
    cursor: not-allowed;
  }
  button:hover:not(:disabled) { text-decoration: underline; }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .conversation:focus-visible, textarea:focus-visible { outline-offset: 0; }

  @media (max-height: 34em) {
    .app { height: auto; }
    .conversation { overflow: visible; min-height: 6rem; }
  }
  @media (forced-colors: active) {
    .msg, .status, #error-text, textarea, button { border: 2px solid CanvasText; }
    button:disabled { border-color: GrayText; color: GrayText; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat assistant</h1>
  </header>

  <main class="app-main" style="display:contents">
    <section class="conversation" id="conversation" aria-labelledby="conv-heading" tabindex="0">
      <h2 id="conv-heading" class="visually-hidden">Conversation</h2>
      <p class="empty" id="empty">No messages yet. Type a message below and choose Send.</p>
      <ol class="messages" id="messages"></ol>
    </section>

    <div class="feedback">
      <div class="status" id="status" role="status">
        <span class="icon" id="status-icon" aria-hidden="true">•</span>
        <span id="status-text">Ready.</span>
      </div>
      <div id="error" role="alert"><span id="error-text"></span></div>
    </div>

    <form id="composer" aria-label="Send a message" novalidate>
      <label for="prompt">Your message</label>
      <textarea id="prompt" name="prompt" rows="3" aria-describedby="prompt-hint"></textarea>
      <p class="hint" id="prompt-hint">Press Enter to send. Press Shift+Enter for a new line.</p>
      <div class="actions">
        <button type="button" id="send" class="primary">Send</button>
        <button type="button" id="stop" disabled>Stop</button>
        <button type="button" id="regenerate" disabled>Regenerate</button>
      </div>
    </form>
  </main>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var promptEl = $('prompt'), sendBtn = $('send'), stopBtn = $('stop'), regenBtn = $('regenerate');
  var listEl = $('messages'), emptyEl = $('empty'), convEl = $('conversation');
  var statusText = $('status-text'), statusIcon = $('status-icon'), errorText = $('error-text');
  var composer = $('composer');

  var messages = [];   // {role, content, status, li, textNode, noteEl}
  var active = null;   // the one stream run allowed to update the UI

  var ICONS = { ready: '•', generating: '…', stopped: '■', finished: '✓' };

  function setStatus(kind, text) {
    statusIcon.textContent = ICONS[kind] || '•';
    statusText.textContent = text;
    errorText.textContent = '';
  }
  function setError(text) {
    // Clear the polite status so the same event is not announced twice.
    statusIcon.textContent = '!';
    statusText.textContent = 'Error.';
    errorText.textContent = text;
  }
  function clearError() {
    errorText.textContent = '';
    promptEl.removeAttribute('aria-invalid');
    if (promptEl.getAttribute('aria-describedby') !== 'prompt-hint') {
      promptEl.setAttribute('aria-describedby', 'prompt-hint');
    }
  }

  function nearBottom() {
    return convEl.scrollHeight - convEl.scrollTop - convEl.clientHeight < 48;
  }
  function scrollToBottom() { convEl.scrollTop = convEl.scrollHeight; }

  function updateNote(m) {
    var t = '';
    if (m.status === 'streaming') t = 'Generating…';
    else if (m.status === 'stopped') t = m.content ? 'Stopped. Partial answer kept.' : 'Stopped before any text arrived.';
    else if (m.status === 'error') t = m.content ? 'Error: the answer is incomplete.' : 'Error: no answer was received.';
    m.noteEl.textContent = t;
    m.noteEl.hidden = !t;
    m.li.className = 'msg ' + m.role + (m.status === 'stopped' || m.status === 'error' ? ' ' + m.status : '');
    if (m.status === 'streaming') m.li.setAttribute('aria-busy', 'true');
    else m.li.removeAttribute('aria-busy');
  }

  function addMessage(role, content, status) {
    var li = document.createElement('li');
    var who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'user' ? 'You' : 'Assistant';
    var text = document.createElement('div');
    text.className = 'text';
    var textNode = document.createTextNode(content);
    text.appendChild(textNode);
    var note = document.createElement('div');
    note.className = 'note';
    li.appendChild(who); li.appendChild(text); li.appendChild(note);
    var m = { role: role, content: content, status: status || 'done', li: li, textNode: textNode, noteEl: note };
    updateNote(m);
    listEl.appendChild(li);
    messages.push(m);
    emptyEl.hidden = true;
    scrollToBottom();
    return m;
  }

  function removeMessagesAfter(index) {
    while (messages.length > index + 1) {
      var m = messages.pop();
      if (m.li.parentNode) m.li.parentNode.removeChild(m.li);
    }
  }

  function lastUserIndex() {
    for (var i = messages.length - 1; i >= 0; i--) if (messages[i].role === 'user') return i;
    return -1;
  }

  function updateControls() {
    var focused = document.activeElement;
    sendBtn.disabled = !!active;
    stopBtn.disabled = !active;
    regenBtn.disabled = lastUserIndex() < 0;
    // Never leave keyboard focus on a control that just became disabled.
    if (focused && focused.disabled) promptEl.focus();
  }

  function errorMessage(err) {
    var msg = '';
    if (err) msg = typeof err === 'string' ? err : (err.message || '');
    return msg ? msg : 'The connection failed.';
  }

  function startStream() {
    var history = [];
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      if (m.role === 'assistant' && !m.content) continue;
      history.push({ role: m.role, content: m.content });
    }
    var msg = addMessage('assistant', '', 'streaming');
    var run = { msg: msg, handle: null };
    active = run;
    clearError();
    setStatus('generating', 'Assistant is generating an answer…');
    updateControls();

    function fail(err) {
      active = null;
      msg.status = 'error';
      updateNote(msg);
      setError('The assistant could not finish its answer. ' + errorMessage(err) + ' Choose Regenerate to try again.');
      updateControls();
    }

    var callbacks = {
      onToken: function (t) {
        if (active !== run || t == null) return;
        var s = String(t);
        if (!s) return;
        var stick = nearBottom();
        msg.content += s;
        msg.textNode.appendData(s);
        if (stick) scrollToBottom();
      },
      onDone: function () {
        if (active !== run) return;
        active = null;
        msg.status = 'done';
        updateNote(msg);
        if (!msg.content) {
          msg.textNode.data = '(The assistant returned no text.)';
        }
        setStatus('finished', 'Answer finished.');
        updateControls();
      },
      onError: function (err) {
        if (active !== run) return;
        fail(err);
      }
    };

    try {
      run.handle = window.ChatSDK.streamChat(history, callbacks);
    } catch (e) {
      if (active === run) fail(e);
    }
  }

  function abortActive() {
    var run = active;
    if (!run) return null;
    active = null; // any late chunk or callback is now ignored
    try { if (run.handle && typeof run.handle.abort === 'function') run.handle.abort(); } catch (e) { /* ignore */ }
    return run;
  }

  function sendMessage() {
    if (active) return;
    var text = promptEl.value.trim();
    if (!text) {
      promptEl.setAttribute('aria-invalid', 'true');
      promptEl.setAttribute('aria-describedby', 'prompt-hint error-text');
      statusIcon.textContent = '!';
      statusText.textContent = 'Message not sent.';
      errorText.textContent = 'Please type a message before sending.';
      promptEl.focus();
      return;
    }
    clearError();
    addMessage('user', text, 'done');
    promptEl.value = '';
    promptEl.focus();
    startStream();
  }

  function stopStream() {
    var run = abortActive();
    if (!run) return;
    run.msg.status = 'stopped';
    updateNote(run.msg);
    setStatus('stopped', run.msg.content
      ? 'Generation stopped. The partial answer was kept.'
      : 'Generation stopped. No text had arrived yet.');
    updateControls();
    promptEl.focus();
  }

  function regenerate() {
    var idx = lastUserIndex();
    if (idx < 0) return;
    abortActive();
    removeMessagesAfter(idx);
    startStream();
  }

  sendBtn.addEventListener('click', sendMessage);
  stopBtn.addEventListener('click', stopStream);
  regenBtn.addEventListener('click', regenerate);
  composer.addEventListener('submit', function (e) { e.preventDefault(); });
  promptEl.addEventListener('input', function () {
    if (promptEl.getAttribute('aria-invalid')) clearError();
  });
  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  updateControls();
})();
</script>
</body>
</html>
