<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Assistant</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #d9dce1;
    --text: #1d2129;
    --muted: #6b7280;
    --user: #2563eb;
    --user-text: #ffffff;
    --assistant: #eef0f3;
    --danger: #b91c1c;
    --ok: #15803d;
    --warn: #b45309;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  #status {
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted);
    display: inline-block;
  }
  #status[data-state="generating"] { color: var(--user); }
  #status[data-state="generating"] .dot { background: var(--user); animation: pulse 1s infinite ease-in-out; }
  #status[data-state="finished"] { color: var(--ok); }
  #status[data-state="finished"] .dot { background: var(--ok); }
  #status[data-state="stopped"] { color: var(--warn); }
  #status[data-state="stopped"] .dot { background: var(--warn); }
  #status[data-state="error"] { color: var(--danger); }
  #status[data-state="error"] .dot { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty {
    margin: auto;
    color: var(--muted);
    text-align: center;
    font-size: 0.95rem;
  }
  .msg {
    max-width: 85%;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .role {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .bubble {
    padding: 10px 13px;
    border-radius: 12px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    line-height: 1.45;
  }
  .msg.user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant); border-bottom-left-radius: 4px; }
  .msg.assistant.streaming .bubble::after {
    content: "▍";
    animation: blink 1s steps(1) infinite;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .bubble.placeholder { color: var(--muted); font-style: italic; }
  .note { font-size: 0.78rem; }
  .note.stopped { color: var(--warn); }
  .note.error { color: var(--danger); }
  .note.finished { color: var(--muted); }

  form {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #prompt {
    width: 100%;
    min-height: 60px;
    max-height: 200px;
    resize: vertical;
    padding: 10px;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #prompt:focus { outline: 2px solid var(--user); outline-offset: -1px; }
  .controls { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .hint { margin-right: auto; font-size: 0.78rem; color: var(--muted); align-self: center; }
  button {
    font: inherit;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #send { background: var(--user); color: #fff; border-color: var(--user); }
  #stop { color: var(--danger); border-color: #f1c4c4; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat Assistant</h1>
    <div id="status" data-state="idle" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="status-text">Ready</span>
    </div>
  </header>

  <main id="conversation" aria-live="polite" aria-label="Conversation"></main>

  <form id="composer" autocomplete="off">
    <label for="prompt" style="position:absolute;left:-9999px;">Message</label>
    <textarea id="prompt" placeholder="Type a message…"></textarea>
    <div class="controls">
      <span class="hint">Enter to send · Shift+Enter for new line</span>
      <button type="button" id="regenerate">Regenerate</button>
      <button type="button" id="stop">Stop</button>
      <button type="submit" id="send">Send</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';

  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var regenBtn = document.getElementById('regenerate');
  var form = document.getElementById('composer');
  var convEl = document.getElementById('conversation');
  var statusEl = document.getElementById('status');
  var statusTextEl = document.getElementById('status-text');

  // Each message: { role: 'user'|'assistant', content: string, state?: 'streaming'|'finished'|'stopped'|'error', error?: string }
  var messages = [];

  // The active stream, or null. Callbacks from any stream whose id does not
  // match the active one are ignored (handles late tokens after abort()).
  var current = null;
  var runCounter = 0;

  function setStatus(state, text) {
    statusEl.setAttribute('data-state', state);
    statusTextEl.textContent = text;
  }

  function isNearBottom() {
    return convEl.scrollHeight - convEl.scrollTop - convEl.clientHeight < 80;
  }

  function scrollToBottom() {
    convEl.scrollTop = convEl.scrollHeight;
  }

  function hasUserMessage() {
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') return true;
    }
    return false;
  }

  function updateControls() {
    var streaming = current !== null;
    sendBtn.disabled = streaming || promptEl.value.trim() === '';
    stopBtn.disabled = !streaming;
    regenBtn.disabled = !hasUserMessage();
  }

  function errorMessageOf(err) {
    if (!err) return 'Unknown error';
    if (typeof err === 'string') return err;
    if (err.message) return String(err.message);
    try { return String(err); } catch (e) { return 'Unknown error'; }
  }

  function fillBubble(bubble, msg) {
    if (msg.role === 'assistant' && msg.content === '') {
      bubble.classList.add('placeholder');
      if (msg.state === 'streaming') bubble.textContent = 'Thinking…';
      else if (msg.state === 'stopped') bubble.textContent = '(stopped before any text was generated)';
      else if (msg.state === 'error') bubble.textContent = '(no answer)';
      else bubble.textContent = '(empty answer)';
    } else {
      bubble.classList.remove('placeholder');
      bubble.textContent = msg.content;
    }
  }

  function buildMessageEl(msg, index) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + msg.role + (msg.state === 'streaming' ? ' streaming' : '');
    wrap.setAttribute('data-index', String(index));

    var role = document.createElement('div');
    role.className = 'role';
    role.textContent = msg.role === 'user' ? 'You' : 'Assistant';
    wrap.appendChild(role);

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    fillBubble(bubble, msg);
    wrap.appendChild(bubble);

    if (msg.role === 'assistant' && msg.state && msg.state !== 'streaming') {
      var note = document.createElement('div');
      note.className = 'note ' + msg.state;
      if (msg.state === 'stopped') note.textContent = 'Stopped — partial answer kept.';
      else if (msg.state === 'error') note.textContent = 'Error: ' + (msg.error || 'Unknown error');
      else if (msg.state === 'finished') note.textContent = 'Finished';
      wrap.appendChild(note);
    }
    return wrap;
  }

  function render() {
    var stick = isNearBottom();
    convEl.textContent = '';
    if (messages.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No messages yet. Ask something to get started.';
      convEl.appendChild(empty);
    } else {
      for (var i = 0; i < messages.length; i++) {
        convEl.appendChild(buildMessageEl(messages[i], i));
      }
    }
    if (stick) scrollToBottom();
    updateControls();
  }

  // Fast path for token updates: only refresh the one bubble.
  function updateMessageEl(index) {
    var el = convEl.querySelector('.msg[data-index="' + index + '"] .bubble');
    if (!el) { render(); return; }
    var stick = isNearBottom();
    fillBubble(el, messages[index]);
    if (stick) scrollToBottom();
  }

  function historyFor(uptoExclusive) {
    var out = [];
    for (var i = 0; i < uptoExclusive; i++) {
      var m = messages[i];
      // Skip assistant turns that produced no text (e.g. failed/stopped instantly).
      if (m.role === 'assistant' && m.content === '') continue;
      out.push({ role: m.role, content: m.content });
    }
    return out;
  }

  function finishRun(id, state, err) {
    if (!current || current.id !== id) return;
    var idx = current.msgIndex;
    current = null;
    var msg = messages[idx];
    if (msg) {
      msg.state = state;
      if (err !== undefined) msg.error = errorMessageOf(err);
    }
    if (state === 'finished') setStatus('finished', 'Finished');
    else if (state === 'error') setStatus('error', 'Error: ' + errorMessageOf(err));
    render();
  }

  function startStream() {
    var history = historyFor(messages.length);
    messages.push({ role: 'assistant', content: '', state: 'streaming' });
    var msgIndex = messages.length - 1;
    var id = ++runCounter;
    current = { id: id, msgIndex: msgIndex, handle: null };
    setStatus('generating', 'Generating…');
    render();
    scrollToBottom();

    var handlers = {
      onToken: function (text) {
        if (!current || current.id !== id) return; // stale or aborted stream
        if (text == null) return;
        messages[msgIndex].content += String(text);
        updateMessageEl(msgIndex);
      },
      onDone: function () {
        finishRun(id, 'finished');
      },
      onError: function (error) {
        finishRun(id, 'error', error);
      }
    };

    var handle;
    try {
      if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
        throw new Error('Chat service is unavailable.');
      }
      handle = window.ChatSDK.streamChat(history, handlers);
    } catch (e) {
      finishRun(id, 'error', e);
      return;
    }
    if (current && current.id === id) {
      current.handle = handle;
    }
  }

  function stop() {
    if (!current) return;
    var c = current;
    current = null; // from now on, all callbacks from this run are ignored
    try {
      if (c.handle && typeof c.handle.abort === 'function') c.handle.abort();
    } catch (e) { /* ignore abort failures; the run is already detached */ }
    var msg = messages[c.msgIndex];
    if (msg) msg.state = 'stopped';
    setStatus('stopped', 'Stopped');
    render();
  }

  function send() {
    if (current) return;
    var text = promptEl.value;
    if (text.trim() === '') return;
    messages.push({ role: 'user', content: text });
    promptEl.value = '';
    startStream();
    promptEl.focus();
  }

  function regenerate() {
    if (current) stop();
    var lastUser = -1;
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') { lastUser = i; break; }
    }
    if (lastUser === -1) return;
    messages.splice(lastUser + 1); // drop previous answer(s) to the last user message
    startStream();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    send();
  });
  sendBtn.addEventListener('click', function (e) {
    e.preventDefault();
    send();
  });
  stopBtn.addEventListener('click', stop);
  regenBtn.addEventListener('click', regenerate);
  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  promptEl.addEventListener('input', updateControls);

  render();
  promptEl.focus();
})();
</script>
</body>
</html>
