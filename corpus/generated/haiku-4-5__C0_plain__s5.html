<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .message.user .message-content {
            background: #007AFF;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: #e5e5ea;
            color: #000;
            border-bottom-left-radius: 4px;
        }

        .status {
            padding: 8px 16px;
            font-size: 12px;
            color: #666;
            font-style: italic;
            margin-bottom: 8px;
        }

        .status.generating {
            color: #007AFF;
        }

        .status.stopped {
            color: #ff9500;
        }

        .status.error {
            color: #ff3b30;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e5e5ea;
            background: #fafafa;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        #prompt {
            flex: 1;
            padding: 12px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        #prompt:focus {
            outline: none;
            border-color: #007AFF;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        #send {
            background: #007AFF;
            color: white;
        }

        #send:hover:not(:disabled) {
            background: #0051d5;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #stop {
            background: #ff9500;
            color: white;
            display: none;
        }

        #stop:hover {
            background: #e68900;
        }

        #regenerate {
            background: #5ac8fa;
            color: white;
            display: none;
        }

        #regenerate:hover {
            background: #34aaeb;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
            }
            30% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="messages" id="messages">
            <div class="empty-state">Start a conversation</div>
        </div>

        <div class="input-area">
            <div id="status"></div>
            <div class="input-group">
                <textarea
                    id="prompt"
                    placeholder="Type your message..."
                    rows="1"
                ></textarea>
                <div class="button-group">
                    <button id="send">Send</button>
                    <button id="stop">Stop</button>
                    <button id="regenerate">Regenerate</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('send');
        const stopBtn = document.getElementById('stop');
        const regenerateBtn = document.getElementById('regenerate');
        const statusDiv = document.getElementById('status');

        let messages = [];
        let currentStream = null;
        let isStreaming = false;
        let lastUserMessage = null;

        function clearEmptyState() {
            const emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
        }

        function addMessageToDOM(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            return contentDiv;
        }

        function setStatus(text, type = '') {
            if (text) {
                statusDiv.textContent = text;
                statusDiv.className = `status ${type}`;
            } else {
                statusDiv.textContent = '';
                statusDiv.className = 'status';
            }
        }

        function updateUIState() {
            sendBtn.disabled = isStreaming;
            stopBtn.style.display = isStreaming ? 'block' : 'none';
            regenerateBtn.style.display = !isStreaming && messages.length > 0 && messages[messages.length - 1].role === 'assistant' ? 'block' : 'none';
        }

        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text || isStreaming) return;

            clearEmptyState();
            
            messages.push({ role: 'user', content: text });
            lastUserMessage = text;
            addMessageToDOM('user', text);
            promptInput.value = '';
            promptInput.style.height = 'auto';

            await streamAssistantResponse();
        }

        async function streamAssistantResponse() {
            isStreaming = true;
            updateUIState();
            setStatus('Generating response...', 'generating');

            const assistantContentDiv = addMessageToDOM('assistant', '');
            let fullResponse = '';

            currentStream = window.ChatSDK.streamChat(messages, {
                onToken(text) {
                    if (isStreaming) {
                        fullResponse += text;
                        assistantContentDiv.textContent = fullResponse;
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                },
                onDone() {
                    if (isStreaming) {
                        isStreaming = false;
                        messages.push({ role: 'assistant', content: fullResponse });
                        setStatus('');
                        updateUIState();
                        currentStream = null;
                    }
                },
                onError(error) {
                    if (isStreaming) {
                        isStreaming = false;
                        setStatus(`Error: ${error.message}`, 'error');
                        updateUIState();
                        currentStream = null;
                    }
                }
            });
        }

        function stopStream() {
            if (currentStream && isStreaming) {
                currentStream.abort();
                isStreaming = false;
                setStatus('Response stopped', 'stopped');
                
                // Move the partial response to messages
                const lastMessage = messages[messages.length - 1];
                if (lastMessage && lastMessage.role === 'assistant') {
                    lastMessage.content = document.querySelector('.message.assistant:last-child .message-content').textContent;
                }
                
                updateUIState();
                currentStream = null;
            }
        }

        async function regenerateResponse() {
            if (messages.length === 0) return;

            // Remove the last assistant message
            const lastIdx = messages.length - 1;
            if (messages[lastIdx].role === 'assistant') {
                messages.pop();
            }

            // Remove the last assistant message from DOM
            const lastAssistantMsg = messagesContainer.querySelector('.message.assistant:last-child');
            if (lastAssistantMsg) {
                lastAssistantMsg.remove();
            }

            await streamAssistantResponse();
        }

        function autoResizeTextarea() {
            promptInput.style.height = 'auto';
            promptInput.style.height = Math.min(promptInput.scrollHeight, 120) + 'px';
        }

        sendBtn.addEventListener('click', sendMessage);
        stopBtn.addEventListener('click', stopStream);
        regenerateBtn.addEventListener('click', regenerateResponse);

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !isStreaming) {
                e.preventDefault();
                sendMessage();
            }
        });

        promptInput.addEventListener('input', autoResizeTextarea);

        updateUIState();
    </script>
</body>
</html>
