<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #fff;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
        }

        #conversation {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .message.user .message-content {
            background-color: #007bff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background-color: #e9ecef;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-role {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 4px;
        }

        .message.user .message-role {
            text-align: right;
            color: #0056b3;
        }

        .message.assistant .message-role {
            text-align: left;
            color: #495057;
        }

        .status-indicator {
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 0 0 0 auto;
            text-align: center;
            font-weight: 500;
        }

        .status-generating {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-stopped {
            background-color: #f8d7da;
            color: #721c24;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .status-done {
            display: none;
        }

        #controls {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background-color: #fff;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        #prompt {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 44px;
            max-height: 120px;
        }

        #prompt:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 44px;
            min-width: 44px;
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        button:active {
            transform: scale(0.98);
        }

        #send {
            background-color: #007bff;
            color: white;
        }

        #send:hover:not(:disabled) {
            background-color: #0056b3;
        }

        #send:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #stop, #regenerate {
            background-color: #6c757d;
            color: white;
        }

        #stop:hover:not(:disabled), #regenerate:hover:not(:disabled) {
            background-color: #5a6268;
        }

        #stop:disabled, #regenerate:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        #empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 18px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        @media (max-width: 600px) {
            #container {
                max-width: 100%;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }

            .input-group {
                flex-wrap: wrap;
            }

            #prompt {
                width: 100%;
            }

            .button-group {
                width: 100%;
            }

            #send, #stop, #regenerate {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <header id="header">
            <h1>Chat Assistant</h1>
        </header>

        <main id="conversation" role="log" aria-live="polite" aria-label="Conversation history">
            <div id="empty-state">Start a conversation</div>
        </main>

        <section id="controls">
            <div class="input-group">
                <textarea
                    id="prompt"
                    placeholder="Type your message..."
                    aria-label="Message input"
                    aria-describedby="status-live"
                ></textarea>
                <button id="send" aria-label="Send message">Send</button>
            </div>
            <div class="button-group">
                <button id="stop" disabled aria-label="Stop generating response">Stop</button>
                <button id="regenerate" disabled aria-label="Regenerate last response">Regenerate</button>
            </div>
        </section>
    </div>

    <div id="status-live" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <script>
        const conversationEl = document.getElementById('conversation');
        const promptEl = document.getElementById('prompt');
        const sendBtn = document.getElementById('send');
        const stopBtn = document.getElementById('stop');
        const regenerateBtn = document.getElementById('regenerate');
        const statusLiveEl = document.getElementById('status-live');
        const emptyStateEl = document.getElementById('empty-state');

        let messages = [];
        let isStreaming = false;
        let currentStreamHandle = null;
        let lastUserMessage = null;

        function updateStatusAnnouncement(message) {
            statusLiveEl.textContent = message;
        }

        function clearEmptyState() {
            if (emptyStateEl.parentNode === conversationEl) {
                emptyStateEl.remove();
            }
        }

        function addMessageToDOM(role, content, isPartial = false) {
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;

            const roleLabel = document.createElement('div');
            roleLabel.className = 'message-role';
            roleLabel.textContent = role === 'user' ? 'You' : 'Assistant';

            const contentEl = document.createElement('div');
            contentEl.className = 'message-content';
            contentEl.textContent = content;
            contentEl.id = `message-${Date.now()}-${Math.random()}`;

            messageEl.appendChild(roleLabel);
            messageEl.appendChild(contentEl);

            if (isPartial) {
                messageEl.id = 'partial-message';
            }

            conversationEl.appendChild(messageEl);
            conversationEl.scrollTop = conversationEl.scrollHeight;

            return contentEl;
        }

        function addStatusIndicator(status) {
            const statusEl = document.createElement('div');
            statusEl.className = `status-indicator status-${status}`;
            statusEl.id = 'status-indicator';

            if (status === 'generating') {
                statusEl.textContent = 'Generating...';
            } else if (status === 'stopped') {
                statusEl.textContent = 'Stopped';
            } else if (status === 'error') {
                statusEl.textContent = 'Error';
            }

            conversationEl.appendChild(statusEl);
            conversationEl.scrollTop = conversationEl.scrollHeight;
        }

        function removeStatusIndicator() {
            const indicator = document.getElementById('status-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function sendMessage() {
            const content = promptEl.value.trim();
            if (!content || isStreaming) return;

            clearEmptyState();

            messages.push({ role: 'user', content });
            lastUserMessage = content;
            addMessageToDOM('user', content);

            promptEl.value = '';
            promptEl.style.height = 'auto';
            updateUIState();

            streamResponse();
        }

        function streamResponse() {
            isStreaming = true;
            updateUIState();
            removeStatusIndicator();
            addStatusIndicator('generating');
            updateStatusAnnouncement('Assistant is generating a response');

            let fullResponse = '';
            let contentEl = addMessageToDOM('assistant', '', true);

            currentStreamHandle = window.ChatSDK.streamChat(messages, {
                onToken(text) {
                    fullResponse += text;
                    contentEl.textContent = fullResponse;
                    conversationEl.scrollTop = conversationEl.scrollHeight;
                },
                onDone() {
                    isStreaming = false;
                    messages.push({ role: 'assistant', content: fullResponse });
                    const partialEl = document.getElementById('partial-message');
                    if (partialEl) {
                        partialEl.id = '';
                    }
                    removeStatusIndicator();
                    updateStatusAnnouncement('Response completed');
                    updateUIState();
                    currentStreamHandle = null;
                },
                onError(error) {
                    isStreaming = false;
                    removeStatusIndicator();
                    addStatusIndicator('error');
                    updateStatusAnnouncement(`Error: ${error.message || 'Unknown error'}`);
                    updateUIState();
                    currentStreamHandle = null;
                }
            });
        }

        function stopStreaming() {
            if (isStreaming && currentStreamHandle) {
                currentStreamHandle.abort();
                isStreaming = false;
                removeStatusIndicator();
                addStatusIndicator('stopped');
                updateStatusAnnouncement('Response stopped by user');
                const partialEl = document.getElementById('partial-message');
                if (partialEl) {
                    const contentEl = partialEl.querySelector('.message-content');
                    if (contentEl.textContent) {
                        messages.push({ role: 'assistant', content: contentEl.textContent });
                    }
                    partialEl.id = '';
                }
                updateUIState();
                currentStreamHandle = null;
            }
        }

        function regenerate() {
            if (!lastUserMessage || messages.length < 2) return;

            removeStatusIndicator();
            messages = messages.filter(m => m.content !== lastUserMessage || m.role !== 'assistant');

            streamResponse();
        }

        function updateUIState() {
            sendBtn.disabled = isStreaming;
            stopBtn.disabled = !isStreaming;
            regenerateBtn.disabled = isStreaming || messages.length < 2;
            promptEl.disabled = isStreaming;
        }

        promptEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        promptEl.addEventListener('input', () => {
            promptEl.style.height = 'auto';
            promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + 'px';
        });

        sendBtn.addEventListener('click', sendMessage);
        stopBtn.addEventListener('click', stopStreaming);
        regenerateBtn.addEventListener('click', regenerate);

        updateUIState();
    </script>
</body>
</html>
