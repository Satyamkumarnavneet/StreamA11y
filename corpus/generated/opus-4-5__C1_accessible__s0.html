<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --color-bg: #f5f5f5;
            --color-surface: #ffffff;
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-primary-disabled: #93c5fd;
            --color-danger: #dc2626;
            --color-danger-hover: #b91c1c;
            --color-text: #1f2937;
            --color-text-muted: #6b7280;
            --color-border: #e5e7eb;
            --color-user-bg: #dbeafe;
            --color-assistant-bg: #f3f4f6;
            --color-error: #fef2f2;
            --color-error-border: #fecaca;
            --color-error-text: #991b1b;
            --focus-ring: 0 0 0 3px rgba(37, 99, 235, 0.5);
            --radius: 8px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--color-surface);
        }

        .chat-header {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--color-border);
            background-color: var(--color-surface);
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md);
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-md);
            border-radius: var(--radius);
            max-width: 85%;
        }

        .message-user {
            background-color: var(--color-user-bg);
            margin-left: auto;
        }

        .message-assistant {
            background-color: var(--color-assistant-bg);
            margin-right: auto;
        }

        .message-role {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-muted);
            margin-bottom: var(--spacing-xs);
        }

        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-content:empty::before {
            content: '\00a0';
        }

        .status-indicator {
            padding: var(--spacing-sm) var(--spacing-md);
            text-align: center;
            font-size: 0.875rem;
            color: var(--color-text-muted);
            min-height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .status-indicator[data-status="generating"] {
            color: var(--color-primary);
        }

        .status-indicator[data-status="stopped"] {
            color: var(--color-danger);
        }

        .status-indicator[data-status="error"] {
            color: var(--color-error-text);
            background-color: var(--color-error);
            border-top: 1px solid var(--color-error-border);
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--color-primary);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .chat-input-area {
            padding: var(--spacing-md);
            border-top: 1px solid var(--color-border);
            background-color: var(--color-surface);
        }

        .input-row {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #prompt {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 2px solid var(--color-border);
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: inherit;
            line-height: 1.5;
            resize: vertical;
            min-height: 44px;
            max-height: 200px;
            transition: border-color 0.2s;
        }

        #prompt:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: var(--focus-ring);
        }

        #prompt:disabled {
            background-color: var(--color-bg);
            cursor: not-allowed;
        }

        .btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
        }

        .btn:focus {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--color-primary-hover);
        }

        .btn-primary:disabled {
            background-color: var(--color-primary-disabled);
            cursor: not-allowed;
        }

        .btn-danger {
            background-color: var(--color-danger);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: var(--color-danger-hover);
        }

        .btn-danger:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: var(--color-bg);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: var(--color-border);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-row {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 600px) {
            .message {
                max-width: 95%;
            }

            .btn {
                padding: var(--spacing-sm);
            }

            .btn-text {
                display: none;
            }

            .btn[aria-label] {
                min-width: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container" role="main">
        <header class="chat-header">
            <h1>Chat Assistant</h1>
        </header>

        <div 
            class="chat-messages" 
            id="messages" 
            role="log" 
            aria-live="polite" 
            aria-label="Conversation history"
            tabindex="0"
        >
            <!-- Messages will be inserted here -->
        </div>

        <div 
            class="status-indicator" 
            id="status" 
            role="status" 
            aria-live="polite" 
            aria-atomic="true"
        >
            <!-- Status messages will appear here -->
        </div>

        <div class="chat-input-area">
            <div class="input-row">
                <div class="input-wrapper">
                    <label for="prompt" class="visually-hidden">Your message</label>
                    <textarea 
                        id="prompt" 
                        placeholder="Type your message..." 
                        rows="1"
                        aria-describedby="input-instructions"
                    ></textarea>
                    <span id="input-instructions" class="visually-hidden">
                        Press Enter to send, Shift+Enter for new line
                    </span>
                </div>
                <button 
                    type="button" 
                    id="send" 
                    class="btn btn-primary"
                    aria-label="Send message"
                >
                    <span aria-hidden="true">➤</span>
                    <span class="btn-text">Send</span>
                </button>
            </div>
            <div class="action-row">
                <button 
                    type="button" 
                    id="stop" 
                    class="btn btn-danger"
                    aria-label="Stop generating"
                    disabled
                >
                    <span aria-hidden="true">■</span>
                    <span class="btn-text">Stop</span>
                </button>
                <button 
                    type="button" 
                    id="regenerate" 
                    class="btn btn-secondary"
                    aria-label="Regenerate last response"
                    disabled
                >
                    <span aria-hidden="true">↻</span>
                    <span class="btn-text">Regenerate</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // State
            let conversationHistory = [];
            let currentHandle = null;
            let isGenerating = false;
            let currentAssistantMessageEl = null;

            // DOM Elements
            const messagesContainer = document.getElementById('messages');
            const promptInput = document.getElementById('prompt');
            const sendBtn = document.getElementById('send');
            const stopBtn = document.getElementById('stop');
            const regenerateBtn = document.getElementById('regenerate');
            const statusIndicator = document.getElementById('status');

            // Initialize
            function init() {
                sendBtn.addEventListener('click', handleSend);
                stopBtn.addEventListener('click', handleStop);
                regenerateBtn.addEventListener('click', handleRegenerate);
                promptInput.addEventListener('keydown', handleKeyDown);
                promptInput.addEventListener('input', autoResize);

                updateUIState();
            }

            // Auto-resize textarea
            function autoResize() {
                promptInput.style.height = 'auto';
                promptInput.style.height = Math.min(promptInput.scrollHeight, 200) + 'px';
            }

            // Handle keyboard input
            function handleKeyDown(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!sendBtn.disabled) {
                        handleSend();
                    }
                }
            }

            // Update UI based on current state
            function updateUIState() {
                const hasUserMessage = conversationHistory.some(m => m.role === 'user');
                const inputHasContent = promptInput.value.trim().length > 0;

                sendBtn.disabled = isGenerating || !inputHasContent;
                stopBtn.disabled = !isGenerating;
                regenerateBtn.disabled = isGenerating || !hasUserMessage;
                promptInput.disabled = isGenerating;

                if (isGenerating) {
                    promptInput.setAttribute('aria-busy', 'true');
                } else {
                    promptInput.removeAttribute('aria-busy');
                }
            }

            // Set status message
            function setStatus(message, type = 'idle') {
                statusIndicator.textContent = '';
                statusIndicator.setAttribute('data-status', type);

                if (type === 'generating') {
                    const typingIndicator = document.createElement('span');
                    typingIndicator.className = 'typing-indicator';
                    typingIndicator.setAttribute('aria-hidden', 'true');
                    typingIndicator.innerHTML = '<span></span><span></span><span></span>';
                    statusIndicator.appendChild(typingIndicator);
                    
                    const text = document.createTextNode(' ' + message);
                    statusIndicator.appendChild(text);
                } else {
                    statusIndicator.textContent = message;
                }
            }

            // Clear status
            function clearStatus() {
                statusIndicator.textContent = '';
                statusIndicator.removeAttribute('data-status');
            }

            // Create message element
            function createMessageElement(role, content = '') {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message message-${role}`;
                messageDiv.setAttribute('role', 'article');
                
                const roleLabel = document.createElement('div');
                roleLabel.className = 'message-role';
                roleLabel.textContent = role === 'user' ? 'You' : 'Assistant';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;
                
                messageDiv.appendChild(roleLabel);
                messageDiv.appendChild(contentDiv);
                
                return messageDiv;
            }

            // Add message to UI
            function addMessageToUI(role, content = '') {
                const messageEl = createMessageElement(role, content);
                messagesContainer.appendChild(messageEl);
                scrollToBottom();
                return messageEl;
            }

            // Scroll to bottom of messages
            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            // Handle send
            function handleSend() {
                const content = promptInput.value.trim();
                if (!content || isGenerating) return;

                // Add user message
                conversationHistory.push({ role: 'user', content });
                addMessageToUI('user', content);

                // Clear input
                promptInput.value = '';
                autoResize();

                // Start streaming
                startStreaming();
            }

            // Handle stop
            function handleStop() {
                if (currentHandle) {
                    currentHandle.abort();
                    currentHandle = null;
                }
                
                // Save partial response if any
                if (currentAssistantMessageEl) {
                    const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                    const partialContent = contentEl.textContent;
                    
                    if (partialContent) {
                        // Update or add the assistant message in history
                        const lastMessage = conversationHistory[conversationHistory.length - 1];
                        if (lastMessage && lastMessage.role === 'assistant') {
                            lastMessage.content = partialContent;
                        } else {
                            conversationHistory.push({ role: 'assistant', content: partialContent });
                        }
                    }
                }

                isGenerating = false;
                currentAssistantMessageEl = null;
                setStatus('Generation stopped', 'stopped');
                updateUIState();
                promptInput.focus();
            }

            // Handle regenerate
            function handleRegenerate() {
                if (isGenerating) return;

                // Find the last user message index
                let lastUserIndex = -1;
                for (let i = conversationHistory.length - 1; i >= 0; i--) {
                    if (conversationHistory[i].role === 'user') {
                        lastUserIndex = i;
                        break;
                    }
                }

                if (lastUserIndex === -1) return;

                // Remove messages from last user message onwards
                conversationHistory = conversationHistory.slice(0, lastUserIndex + 1);

                // Update UI - remove corresponding message elements
                const messageEls = messagesContainer.querySelectorAll('.message');
                const totalMessages = messageEls.length;
                const messagesToKeep = lastUserIndex + 1;
                
                for (let i = totalMessages - 1; i >= messagesToKeep; i--) {
                    messageEls[i].remove();
                }

                // Start streaming new response
                startStreaming();
            }

            // Start streaming response
            function startStreaming() {
                isGenerating = true;
                updateUIState();
                setStatus('Generating response...', 'generating');

                // Create assistant message element
                currentAssistantMessageEl = addMessageToUI('assistant', '');
                const contentEl = currentAssistantMessageEl.querySelector('.message-content');

                // Prepare messages for API
                const messages = conversationHistory.map(m => ({
                    role: m.role,
                    content: m.content
                }));

                // Stream callbacks
                const callbacks = {
                    onToken: function(text) {
                        if (currentAssistantMessageEl) {
                            contentEl.textContent += text;
                            scrollToBottom();
                        }
                    },
                    onDone: function() {
                        // Save complete response
                        const finalContent = contentEl.textContent;
                        conversationHistory.push({ role: 'assistant', content: finalContent });
                        
                        isGenerating = false;
                        currentHandle = null;
                        currentAssistantMessageEl = null;
                        setStatus('Response complete', 'complete');
                        updateUIState();
                        promptInput.focus();

                        // Clear status after a moment
                        setTimeout(clearStatus, 2000);
                    },
                    onError: function(error) {
                        isGenerating = false;
                        currentHandle = null;
                        
                        // Keep partial content if any
                        const partialContent = contentEl.textContent;
                        if (partialContent) {
                            conversationHistory.push({ role: 'assistant', content: partialContent });
                        } else {
                            // Remove empty assistant message
                            currentAssistantMessageEl.remove();
                        }
                        
                        currentAssistantMessageEl = null;
                        
                        const errorMessage = error && error.message ? error.message : 'An error occurred';
                        setStatus('Error: ' + errorMessage, 'error');
                        updateUIState();
                        promptInput.focus();
                    }
                };

                // Start the stream
                currentHandle = window.ChatSDK.streamChat(messages, callbacks);
            }

            // Initialize when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
