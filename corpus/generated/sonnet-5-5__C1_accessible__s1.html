<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1b1b1f;
    --muted: #4a4f57;
    --border: #6b7280;
    --user-bg: #e3edff;
    --asst-bg: #f1f2f4;
    --primary: #0b57d0;
    --primary-fg: #ffffff;
    --focus: #0b57d0;
    --danger-bg: #fde8e8;
    --danger-fg: #7a1212;
    --disabled-bg: #e5e7eb;
    --disabled-fg: #5b616b;
    --k-busy: #0b57d0;
    --k-done: #1b6e3a;
    --k-stopped: #8a5300;
    --k-error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316;
      --fg: #ececf0;
      --muted: #b6bac2;
      --border: #8b919c;
      --user-bg: #1d3557;
      --asst-bg: #1e2026;
      --primary: #8ab4f8;
      --primary-fg: #0b1b33;
      --focus: #8ab4f8;
      --danger-bg: #4a1818;
      --danger-fg: #ffd7d7;
      --disabled-bg: #2a2d34;
      --disabled-fg: #a0a5ae;
      --k-busy: #8ab4f8;
      --k-done: #7bd69a;
      --k-stopped: #f0b45a;
      --k-error: #ff9c94;
    }
  }

  * { box-sizing: border-box; }
  html { scroll-padding-bottom: 14rem; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }
  .app {
    max-width: 48rem;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header, main { padding: 0 1rem; }
  h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; line-height: 1.25; }
  main { flex: 1; padding-bottom: 1rem; }

  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    margin: -1px; padding: 0; border: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .empty { color: var(--muted); margin: 1rem 0; }
  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.875rem; }

  .msg {
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 0.625rem 0.875rem;
    max-width: 92%;
    overflow-wrap: anywhere;
  }
  .msg.user { background: var(--user-bg); align-self: flex-end; }
  .msg.assistant { background: var(--asst-bg); align-self: flex-start; }
  .meta {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 0.25rem 0.625rem;
    margin-bottom: 0.25rem;
  }
  .who { font-weight: 700; }
  .badge {
    display: inline-flex; align-items: center; gap: 0.375rem;
    font-size: 0.875rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 0.625rem;
    background: var(--bg);
    color: var(--fg);
  }
  .text { white-space: pre-wrap; }
  .text:empty { display: none; }
  .note { margin: 0.25rem 0 0; font-size: 0.9375rem; color: var(--muted); font-style: italic; }

  .composer {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 2px solid var(--border);
    padding: 0.75rem 1rem 1rem;
  }
  @media (max-height: 520px) {
    .composer { position: static; }
  }
  .status {
    margin: 0 0 0.5rem;
    padding: 0.375rem 0.75rem;
    border-radius: 0.5rem;
    background: var(--asst-bg);
    border-left: 6px solid var(--border);
    display: flex; align-items: center; gap: 0.5rem;
  }
  .status:empty { padding: 0; margin: 0; border: 0; }
  .status[data-kind="busy"] { border-left-color: var(--k-busy); }
  .status[data-kind="done"] { border-left-color: var(--k-done); }
  .status[data-kind="stopped"] { border-left-color: var(--k-stopped); }
  .status[data-kind="error"] {
    border-left-color: var(--k-error);
    background: var(--danger-bg);
    color: var(--danger-fg);
    font-weight: 600;
  }
  .icon { flex: none; display: inline-block; min-width: 1em; text-align: center; font-weight: 700; }
  .spinner {
    width: 1em; height: 1em;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-style: dotted; }
  }

  label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
  textarea {
    display: block;
    width: 100%;
    min-height: 5rem;
    padding: 0.625rem;
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 0.5rem;
    resize: vertical;
  }
  .hint { margin: 0.25rem 0 0.625rem; font-size: 0.9375rem; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 0.625rem; }
  button {
    font: inherit;
    font-weight: 600;
    min-height: 2.75rem;
    min-width: 2.75rem;
    padding: 0.375rem 1.125rem;
    border-radius: 0.5rem;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  button:disabled {
    background: var(--disabled-bg);
    color: var(--disabled-fg);
    border-color: var(--disabled-bg);
    cursor: not-allowed;
  }
  button:hover:not(:disabled) { text-decoration: underline; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  textarea:focus-visible { outline-offset: 0; }

  @media (forced-colors: active) {
    .msg, .badge, textarea, button, .status { border: 1px solid CanvasText; }
    button:disabled { color: GrayText; border-color: GrayText; }
    :focus-visible { outline: 3px solid Highlight; }
    .spinner { border-color: CanvasText; border-right-color: transparent; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat assistant</h1>
  </header>

  <main id="main">
    <section aria-labelledby="conv-h">
      <h2 id="conv-h" class="sr-only">Conversation</h2>
      <p id="empty" class="empty">No messages yet. Type a question below and choose Send.</p>
      <ol id="log" class="log" role="list"></ol>
    </section>
  </main>

  <footer class="composer">
    <p id="status" class="status" role="status"></p>
    <p id="alert" class="status" role="alert"></p>

    <form id="form" aria-label="Send a message" novalidate>
      <label for="prompt">Your message</label>
      <textarea id="prompt" name="prompt" rows="3" autocomplete="off" aria-describedby="hint"></textarea>
      <p id="hint" class="hint">Press Enter to send, or Shift+Enter for a new line.</p>
      <div class="actions">
        <button type="submit" id="send" class="primary">Send</button>
        <button type="button" id="stop" disabled>Stop</button>
        <button type="button" id="regenerate" disabled>Regenerate</button>
      </div>
    </form>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var logEl = $('log'), emptyEl = $('empty'), statusEl = $('status'), alertEl = $('alert');
  var form = $('form'), promptEl = $('prompt');
  var sendBtn = $('send'), stopBtn = $('stop'), regenBtn = $('regenerate');

  var state = {
    messages: [],   // {role, content, status, el, textNode, badgeEl, noteEl}
    run: null       // the currently active stream, or null
  };
  var validationShown = false;

  /* ---------- small UI helpers ---------- */

  function makeIcon(kind) {
    var s = document.createElement('span');
    s.className = 'icon';
    s.setAttribute('aria-hidden', 'true');
    if (kind === 'busy') {
      var sp = document.createElement('span');
      sp.className = 'spinner';
      s.appendChild(sp);
    } else {
      s.textContent = ({ done: '\u2713', stopped: '\u25A0', error: '!', idle: 'i' })[kind] || 'i';
    }
    return s;
  }

  function fill(el, kind, text) {
    el.textContent = '';
    el.dataset.kind = kind;
    el.appendChild(makeIcon(kind));
    var t = document.createElement('span');
    t.textContent = text;
    el.appendChild(t);
  }

  function clearEl(el) {
    el.textContent = '';
    delete el.dataset.kind;
  }

  // Polite status (generating / stopped / finished / info)
  function setStatus(kind, text) {
    clearEl(alertEl);
    validationShown = false;
    fill(statusEl, kind, text);
  }

  // Assertive alert (errors and validation problems)
  function setAlert(text) {
    clearEl(statusEl);
    fill(alertEl, 'error', text);
  }

  function nearBottom() {
    var d = document.documentElement;
    return d.scrollHeight - (window.scrollY + window.innerHeight) < 120;
  }
  function scrollToBottom() {
    window.scrollTo(0, document.documentElement.scrollHeight);
  }

  function hasUserMessage() {
    return state.messages.some(function (m) { return m.role === 'user'; });
  }

  function updateControls() {
    var streaming = state.run !== null;
    sendBtn.disabled = streaming;
    stopBtn.disabled = !streaming;
    regenBtn.disabled = streaming || !hasUserMessage();
  }

  // If a button that had focus became disabled, keep focus somewhere useful.
  function rescueFocus(preferred) {
    var a = document.activeElement;
    if (!a || a === document.body || a.disabled) {
      (preferred && !preferred.disabled ? preferred : promptEl).focus();
    }
  }

  /* ---------- messages ---------- */

  var BADGE = {
    streaming: ['busy', 'Generating\u2026'],
    done: ['done', 'Finished'],
    stopped: ['stopped', 'Stopped'],
    error: ['error', 'Error']
  };

  function noteFor(m) {
    var has = m.content.length > 0;
    switch (m.status) {
      case 'streaming': return has ? '' : 'Waiting for the first words\u2026';
      case 'done': return has ? '' : 'The assistant returned no text.';
      case 'stopped': return has ? 'Stopped by you. The partial answer above was kept.'
                                 : 'Stopped before any text arrived.';
      case 'error': return has ? 'The answer was interrupted by an error. The partial text above was kept.'
                               : 'No answer was received.';
    }
    return '';
  }

  function refreshMessage(m) {
    if (m.role !== 'assistant') return;
    var b = BADGE[m.status];
    m.badgeEl.textContent = '';
    m.badgeEl.appendChild(makeIcon(b[0]));
    var t = document.createElement('span');
    t.textContent = b[1];
    m.badgeEl.appendChild(t);
    var note = noteFor(m);
    m.noteEl.textContent = note;
    m.noteEl.hidden = !note;
    if (m.status === 'streaming') m.el.setAttribute('aria-busy', 'true');
    else m.el.removeAttribute('aria-busy');
  }

  function addMessage(role, content) {
    var m = {
      role: role,
      content: content || '',
      status: role === 'user' ? 'sent' : 'streaming'
    };
    var li = document.createElement('li');
    li.className = 'msg ' + role;

    var meta = document.createElement('div');
    meta.className = 'meta';
    var who = document.createElement('strong');
    who.className = 'who';
    who.textContent = role === 'user' ? 'You' : 'Assistant';
    meta.appendChild(who);

    var text = document.createElement('div');
    text.className = 'text';
    m.textNode = document.createTextNode(m.content);
    text.appendChild(m.textNode);

    if (role === 'assistant') {
      m.badgeEl = document.createElement('span');
      m.badgeEl.className = 'badge';
      meta.appendChild(m.badgeEl);
    }
    li.appendChild(meta);
    li.appendChild(text);
    if (role === 'assistant') {
      m.noteEl = document.createElement('p');
      m.noteEl.className = 'note';
      li.appendChild(m.noteEl);
    }
    m.el = li;
    logEl.appendChild(li);
    state.messages.push(m);
    emptyEl.hidden = true;
    refreshMessage(m);
    return m;
  }

  function appendText(m, chunk) {
    chunk = chunk == null ? '' : String(chunk);
    if (!chunk) return;
    var follow = nearBottom();
    var first = m.content.length === 0;
    m.content += chunk;
    m.textNode.appendData(chunk);
    if (first) refreshMessage(m);
    if (follow) scrollToBottom();
  }

  /* ---------- streaming ---------- */

  function errorDetail(err) {
    var d = '';
    if (err && typeof err === 'object' && err.message) d = String(err.message);
    else if (typeof err === 'string') d = err;
    return d;
  }

  function finish(run, status, err) {
    if (run.closed) return;
    run.closed = true;
    if (state.run === run) state.run = null;
    run.msg.status = status;
    refreshMessage(run.msg);
    updateControls();

    if (status === 'done') {
      setStatus('done', 'Answer finished.');
    } else if (status === 'stopped') {
      setStatus('stopped', 'Generation stopped. The partial answer was kept.');
    } else {
      var d = errorDetail(err);
      setAlert('Error: the answer could not be completed.' + (d ? ' ' + d : '') +
               ' Choose Regenerate to try again.');
    }
    rescueFocus(promptEl);
  }

  function startRun(assistantMsg, label) {
    var payload = state.messages
      .filter(function (m) { return m !== assistantMsg && m.content.trim() !== ''; })
      .map(function (m) { return { role: m.role, content: m.content }; });

    var run = { closed: false, handle: null, msg: assistantMsg };
    state.run = run;
    setStatus('busy', label);
    updateControls();
    scrollToBottom();

    try {
      if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
        throw new Error('The chat service is not available.');
      }
      run.handle = window.ChatSDK.streamChat(payload, {
        onToken: function (text) {
          if (run.closed) return;          // ignores late chunks after Stop
          appendText(run.msg, text);
        },
        onDone: function () {
          if (run.closed) return;
          finish(run, 'done');
        },
        onError: function (err) {
          if (run.closed) return;
          finish(run, 'error', err);
        }
      });
    } catch (e) {
      finish(run, 'error', e);
    }
  }

  function send() {
    if (state.run) {
      setStatus('busy', 'Still generating. Wait for the answer to finish, or press Stop first.');
      return;
    }
    var text = promptEl.value.trim();
    if (!text) {
      validationShown = true;
      promptEl.setAttribute('aria-invalid', 'true');
      setAlert('Error: please type a message before sending.');
      validationShown = true;
      promptEl.focus();
      return;
    }
    promptEl.removeAttribute('aria-invalid');
    promptEl.value = '';
    addMessage('user', text);
    var a = addMessage('assistant');
    startRun(a, 'Assistant is generating an answer\u2026');
    rescueFocus(promptEl);
  }

  function stop() {
    var run = state.run;
    if (!run || run.closed) return;
    try { if (run.handle && typeof run.handle.abort === 'function') run.handle.abort(); }
    catch (e) { /* the local stop still applies */ }
    finish(run, 'stopped');
  }

  function regenerate() {
    if (state.run) return;
    var idx = -1;
    for (var i = state.messages.length - 1; i >= 0; i--) {
      if (state.messages[i].role === 'user') { idx = i; break; }
    }
    if (idx < 0) return;
    while (state.messages.length > idx + 1) {
      var old = state.messages.pop();
      old.el.remove();
    }
    var a = addMessage('assistant');
    startRun(a, 'Assistant is generating a new answer\u2026');
    // Regenerate is now disabled; put focus on Stop so the user can interrupt.
    if (document.activeElement === regenBtn || document.activeElement === document.body ||
        document.activeElement.disabled) {
      stopBtn.focus();
    }
  }

  /* ---------- events ---------- */

  form.addEventListener('submit', function (e) { e.preventDefault(); send(); });
  stopBtn.addEventListener('click', stop);
  regenBtn.addEventListener('click', regenerate);

  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      send();
    }
  });
  promptEl.addEventListener('input', function () {
    if (promptEl.getAttribute('aria-invalid')) promptEl.removeAttribute('aria-invalid');
    if (validationShown) {
      clearEl(alertEl);
      validationShown = false;
    }
  });

  /* ---------- init ---------- */
  updateControls();
  fill(statusEl, 'idle', 'Ready. Type a message to begin.');
})();
</script>
</body>
</html>
