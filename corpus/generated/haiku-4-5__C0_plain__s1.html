<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #f5f5f5;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #007bff;
            color: white;
        }

        .message.assistant .message-content {
            background: #e9ecef;
            color: #333;
        }

        .status-indicator {
            font-size: 12px;
            color: #666;
            padding: 0 16px;
            height: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.generating {
            background: #ffc107;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-dot.done {
            background: #28a745;
        }

        .status-dot.error {
            background: #dc3545;
        }

        .status-dot.stopped {
            background: #6c757d;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        #input-area {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        #input-area.with-controls {
            flex-wrap: wrap;
        }

        #prompt {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            max-height: 100px;
            min-height: 40px;
        }

        #prompt:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #send {
            background: #007bff;
            color: white;
            min-width: 80px;
        }

        #send:hover:not(:disabled) {
            background: #0056b3;
        }

        #send:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #stop, #regenerate {
            background: #6c757d;
            color: white;
        }

        #stop:hover:not(:disabled) {
            background: #5a6268;
        }

        #regenerate:hover:not(:disabled) {
            background: #5a6268;
        }

        #stop:disabled, #regenerate:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .control-group {
            display: flex;
            gap: 8px;
            flex-basis: 100%;
            justify-content: flex-end;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div class="empty-state">Start a conversation</div>
    </div>

    <div id="input-area">
        <textarea id="prompt" placeholder="Type your message..."></textarea>
        <button id="send">Send</button>
        <div class="control-group">
            <button id="stop" disabled>Stop</button>
            <button id="regenerate" disabled>Regenerate</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('send');
        const stopBtn = document.getElementById('stop');
        const regenerateBtn = document.getElementById('regenerate');
        const inputArea = document.getElementById('input-area');

        let messages = [];
        let currentStream = null;
        let isStreaming = false;
        let lastUserMessage = null;
        let currentAssistantMessageEl = null;
        let statusEl = null;

        function clearEmptyState() {
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
        }

        function createStatusElement() {
            const status = document.createElement('div');
            status.className = 'status-indicator';
            return status;
        }

        function updateStatus(text, dotClass) {
            if (!statusEl) {
                statusEl = createStatusElement();
                chatContainer.appendChild(statusEl);
            }
            statusEl.innerHTML = `<span class="status-dot ${dotClass}"></span>${text}`;
        }

        function clearStatus() {
            if (statusEl) {
                statusEl.remove();
                statusEl = null;
            }
        }

        function addMessage(role, content) {
            clearEmptyState();

            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;

            const contentEl = document.createElement('div');
            contentEl.className = 'message-content';
            contentEl.textContent = content;

            messageEl.appendChild(contentEl);
            chatContainer.appendChild(messageEl);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return messageEl;
        }

        function updateLastAssistantMessage(content) {
            if (currentAssistantMessageEl) {
                const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                contentEl.textContent = content;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function createNewAssistantMessage() {
            clearEmptyState();
            const messageEl = document.createElement('div');
            messageEl.className = 'message assistant';

            const contentEl = document.createElement('div');
            contentEl.className = 'message-content';
            contentEl.textContent = '';

            messageEl.appendChild(contentEl);
            chatContainer.appendChild(messageEl);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return messageEl;
        }

        function updateUIState() {
            const canSend = !isStreaming && promptInput.value.trim().length > 0;
            sendBtn.disabled = !canSend;

            stopBtn.disabled = !isStreaming;
            regenerateBtn.disabled = isStreaming || messages.length === 0 || messages[messages.length - 1].role !== 'assistant';

            if (isStreaming) {
                inputArea.classList.add('with-controls');
            }
        }

        function handleSendMessage() {
            const content = promptInput.value.trim();
            if (!content || isStreaming) return;

            lastUserMessage = content;
            messages.push({ role: 'user', content });
            addMessage('user', content);

            promptInput.value = '';
            promptInput.style.height = 'auto';
            promptInput.minHeight = '40px';

            isStreaming = true;
            updateUIState();
            updateStatus('Generating...', 'generating');

            currentAssistantMessageEl = createNewAssistantMessage();
            let assistantContent = '';

            currentStream = window.ChatSDK.streamChat(messages, {
                onToken(text) {
                    assistantContent += text;
                    updateLastAssistantMessage(assistantContent);
                },
                onDone() {
                    messages.push({ role: 'assistant', content: assistantContent });
                    isStreaming = false;
                    currentStream = null;
                    clearStatus();
                    updateStatus('Done', 'done');
                    setTimeout(clearStatus, 2000);
                    updateUIState();
                },
                onError(error) {
                    isStreaming = false;
                    currentStream = null;
                    clearStatus();
                    updateStatus(`Error: ${error.message}`, 'error');
                    updateUIState();
                }
            });
        }

        function handleStop() {
            if (currentStream && isStreaming) {
                currentStream.abort();
                isStreaming = false;
                currentStream = null;

                const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                const assistantContent = contentEl.textContent;
                messages.push({ role: 'assistant', content: assistantContent });

                clearStatus();
                updateStatus('Stopped', 'stopped');
                setTimeout(clearStatus, 2000);
                updateUIState();
            }
        }

        function handleRegenerate() {
            if (isStreaming || messages.length === 0 || messages[messages.length - 1].role !== 'assistant') {
                return;
            }

            const lastUserIdx = messages.length - 2;
            if (lastUserIdx >= 0 && messages[lastUserIdx].role === 'user') {
                messages = messages.slice(0, lastUserIdx + 1);

                chatContainer.querySelectorAll('.message').forEach(el => el.remove());
                chatContainer.querySelectorAll('.status-indicator').forEach(el => el.remove());
                statusEl = null;

                messages.forEach(msg => {
                    addMessage(msg.role, msg.content);
                });

                isStreaming = true;
                updateUIState();
                updateStatus('Generating...', 'generating');

                currentAssistantMessageEl = createNewAssistantMessage();
                let assistantContent = '';

                currentStream = window.ChatSDK.streamChat(messages, {
                    onToken(text) {
                        assistantContent += text;
                        updateLastAssistantMessage(assistantContent);
                    },
                    onDone() {
                        messages.push({ role: 'assistant', content: assistantContent });
                        isStreaming = false;
                        currentStream = null;
                        clearStatus();
                        updateStatus('Done', 'done');
                        setTimeout(clearStatus, 2000);
                        updateUIState();
                    },
                    onError(error) {
                        isStreaming = false;
                        currentStream = null;
                        clearStatus();
                        updateStatus(`Error: ${error.message}`, 'error');
                        updateUIState();
                    }
                });
            }
        }

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        });

        promptInput.addEventListener('input', () => {
            promptInput.style.height = 'auto';
            promptInput.style.height = Math.min(promptInput.scrollHeight, 100) + 'px';
            updateUIState();
        });

        sendBtn.addEventListener('click', handleSendMessage);
        stopBtn.addEventListener('click', handleStop);
        regenerateBtn.addEventListener('click', handleRegenerate);

        updateUIState();
    </script>
</body>
</html>
