<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Assistant</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #d9dde3;
    --text: #1d2330;
    --muted: #6b7380;
    --user: #2f6fed;
    --user-text: #ffffff;
    --assistant: #eef0f4;
    --ok: #1f8a4c;
    --warn: #b7791f;
    --err: #c53030;
    --busy: #2f6fed;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  .status {
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  .status[data-state="generating"] { color: var(--busy); }
  .status[data-state="generating"] .dot { background: var(--busy); animation: pulse 1s infinite ease-in-out; }
  .status[data-state="finished"] { color: var(--ok); }
  .status[data-state="finished"] .dot { background: var(--ok); }
  .status[data-state="stopped"] { color: var(--warn); }
  .status[data-state="stopped"] .dot { background: var(--warn); }
  .status[data-state="error"] { color: var(--err); }
  .status[data-state="error"] .dot { background: var(--err); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  #history {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty {
    margin: auto;
    color: var(--muted);
    text-align: center;
    font-size: 0.95rem;
  }
  .msg {
    max-width: 85%;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .role { font-size: 0.75rem; color: var(--muted); }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    line-height: 1.45;
  }
  .msg.user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant); border-bottom-left-radius: 4px; }
  .msg.assistant.streaming .bubble::after {
    content: "▍";
    animation: blink 1s steps(1) infinite;
    color: var(--busy);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .msg.assistant.streaming .bubble:empty::before { content: "Thinking…"; color: var(--muted); font-style: italic; }
  .note { font-size: 0.75rem; }
  .note.stopped { color: var(--warn); }
  .note.error { color: var(--err); }
  .note.done { color: var(--ok); }

  form {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  textarea {
    width: 100%;
    min-height: 56px;
    max-height: 200px;
    resize: vertical;
    padding: 10px 12px;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  textarea:focus { border-color: var(--user); box-shadow: 0 0 0 3px rgba(47,111,237,0.15); }
  .controls { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .controls .hint { margin-right: auto; font-size: 0.75rem; color: var(--muted); align-self: center; }
  button {
    font: inherit;
    font-size: 0.9rem;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f0f2f5; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #send { background: var(--user); border-color: var(--user); color: #fff; }
  #send:hover:not(:disabled) { background: #245bd0; }
  #stop { border-color: var(--err); color: var(--err); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); border: 0;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat Assistant</h1>
    <div id="status" class="status" data-state="idle" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="status-text">Ready</span>
    </div>
  </header>

  <main id="history" aria-label="Conversation" aria-live="polite">
    <div class="empty" id="empty">Start the conversation by typing a message below.</div>
  </main>

  <form id="composer" autocomplete="off">
    <label for="prompt" class="sr-only">Message</label>
    <textarea id="prompt" placeholder="Type your message…" rows="2"></textarea>
    <div class="controls">
      <span class="hint">Enter to send · Shift+Enter for a new line</span>
      <button type="button" id="regenerate" disabled>Regenerate</button>
      <button type="button" id="stop" disabled>Stop</button>
      <button type="submit" id="send" disabled>Send</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';

  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var regenBtn = document.getElementById('regenerate');
  var historyEl = document.getElementById('history');
  var emptyEl = document.getElementById('empty');
  var formEl = document.getElementById('composer');
  var statusEl = document.getElementById('status');
  var statusTextEl = document.getElementById('status-text');

  // Conversation model. Each entry: { role, content, status, el, bubble, note }
  // status for assistant: 'streaming' | 'done' | 'stopped' | 'error'
  var conversation = [];

  // The generation currently allowed to modify the UI (or null).
  // Every callback checks identity against this, so late tokens after abort,
  // or callbacks from superseded generations, are ignored.
  var current = null;

  function setStatus(state, text) {
    statusEl.setAttribute('data-state', state);
    statusTextEl.textContent = text;
  }

  function isNearBottom() {
    return historyEl.scrollHeight - historyEl.scrollTop - historyEl.clientHeight < 60;
  }

  function scrollToBottom() {
    historyEl.scrollTop = historyEl.scrollHeight;
  }

  function hasUserMessage() {
    for (var i = conversation.length - 1; i >= 0; i--) {
      if (conversation[i].role === 'user') return true;
    }
    return false;
  }

  function updateControls() {
    var busy = current !== null;
    sendBtn.disabled = busy || promptEl.value.trim() === '';
    stopBtn.disabled = !busy;
    regenBtn.disabled = busy || !hasUserMessage();
    emptyEl.style.display = conversation.length ? 'none' : '';
  }

  function renderMessage(msg) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + msg.role;

    var role = document.createElement('div');
    role.className = 'role';
    role.textContent = msg.role === 'user' ? 'You' : 'Assistant';

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.content;

    var note = document.createElement('div');
    note.className = 'note';

    wrap.appendChild(role);
    wrap.appendChild(bubble);
    wrap.appendChild(note);

    msg.el = wrap;
    msg.bubble = bubble;
    msg.note = note;
    historyEl.appendChild(wrap);
  }

  function addMessage(role, content, status) {
    var msg = { role: role, content: content, status: status || 'done' };
    conversation.push(msg);
    renderMessage(msg);
    applyMessageStatus(msg);
    return msg;
  }

  function applyMessageStatus(msg, errorText) {
    if (msg.role !== 'assistant') return;
    msg.el.classList.toggle('streaming', msg.status === 'streaming');
    msg.note.className = 'note';
    msg.note.textContent = '';
    if (msg.status === 'stopped') {
      msg.note.classList.add('stopped');
      msg.note.textContent = msg.content ? 'Stopped — partial answer' : 'Stopped before any text was received';
    } else if (msg.status === 'error') {
      msg.note.classList.add('error');
      msg.note.textContent = 'Error: ' + (errorText || 'the answer could not be completed');
    } else if (msg.status === 'done' && msg.content === '') {
      msg.note.classList.add('done');
      msg.note.textContent = '(empty answer)';
    }
  }

  function removeMessagesAfter(index) {
    while (conversation.length > index + 1) {
      var m = conversation.pop();
      if (m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el);
    }
  }

  // Messages sent to the API: plain {role, content} copies.
  // Failed or empty assistant answers are not sent back as context.
  function buildApiMessages() {
    var out = [];
    for (var i = 0; i < conversation.length; i++) {
      var m = conversation[i];
      if (m.role === 'assistant' && (m.status === 'error' || m.status === 'streaming' || m.content === '')) continue;
      out.push({ role: m.role, content: m.content });
    }
    return out;
  }

  function describeError(err) {
    if (!err) return 'Unknown error';
    if (typeof err === 'string') return err;
    if (err.message) return String(err.message);
    try { return String(err); } catch (e) { return 'Unknown error'; }
  }

  function finishGeneration(gen, status, errorText) {
    if (current !== gen || gen.ended) return;
    gen.ended = true;
    current = null;
    gen.msg.status = status;
    applyMessageStatus(gen.msg, errorText);
    if (status === 'done') setStatus('finished', 'Finished');
    else if (status === 'stopped') setStatus('stopped', 'Stopped');
    else setStatus('error', 'Error: ' + errorText);
    updateControls();
  }

  function startGeneration() {
    var apiMessages = buildApiMessages();
    var msg = addMessage('assistant', '', 'streaming');
    var gen = { msg: msg, handle: null, ended: false };
    current = gen;
    setStatus('generating', 'Generating…');
    updateControls();
    scrollToBottom();

    var sdk = window.ChatSDK;
    if (!sdk || typeof sdk.streamChat !== 'function') {
      finishGeneration(gen, 'error', 'Chat service is not available');
      return;
    }

    try {
      var handle = sdk.streamChat(apiMessages, {
        onToken: function (text) {
          if (current !== gen || gen.ended) return; // ignore late/in-flight tokens after stop
          if (text === undefined || text === null) return;
          var stick = isNearBottom();
          msg.content += String(text);
          msg.bubble.textContent = msg.content;
          if (stick) scrollToBottom();
        },
        onDone: function () {
          finishGeneration(gen, 'done');
        },
        onError: function (error) {
          finishGeneration(gen, 'error', describeError(error));
        }
      });
      gen.handle = handle || null;
    } catch (e) {
      finishGeneration(gen, 'error', describeError(e));
    }
  }

  function send() {
    if (current) return;
    var text = promptEl.value;
    if (text.trim() === '') return;
    promptEl.value = '';
    addMessage('user', text, 'done');
    startGeneration();
    promptEl.focus();
  }

  function stop() {
    var gen = current;
    if (!gen) return;
    // Detach first so any in-flight token arriving after abort is ignored.
    finishGeneration(gen, 'stopped');
    try {
      if (gen.handle && typeof gen.handle.abort === 'function') gen.handle.abort();
    } catch (e) {
      // The stream is already detached from the UI; nothing else to do.
    }
  }

  function regenerate() {
    if (current) return;
    var lastUser = -1;
    for (var i = conversation.length - 1; i >= 0; i--) {
      if (conversation[i].role === 'user') { lastUser = i; break; }
    }
    if (lastUser === -1) return;
    removeMessagesAfter(lastUser); // drop the previous answer(s) to the last user message
    startGeneration();
  }

  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    send();
  });
  sendBtn.addEventListener('click', function (e) {
    e.preventDefault();
    send();
  });
  stopBtn.addEventListener('click', stop);
  regenBtn.addEventListener('click', regenerate);
  promptEl.addEventListener('input', updateControls);
  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  updateControls();
  promptEl.focus();
})();
</script>
</body>
</html>
