<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat assistant</title>
<style>
  :root {
    --text: #1a1a1a;
    --muted: #4a4a4a;
    --bg: #ffffff;
    --page: #f6f7f9;
    --border: #5c5c5c;
    --primary: #0b57d0;
    --danger: #b3261e;
    --user-bg: #e3edfc;
    --bot-bg: #eeeeee;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--text);
    background: var(--page);
  }
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 52rem;
    margin: 0 auto;
    padding: 1rem;
    gap: 0.75rem;
  }
  h1 { font-size: 1.5rem; margin: 0; }
  main { display: flex; flex-direction: column; gap: 0.75rem; flex: 1 1 auto; min-height: 0; }

  #conversation {
    flex: 1 1 auto;
    min-height: 14rem;
    max-height: 60vh;
    overflow-y: auto;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
  }
  #messages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
  #empty { margin: 0; color: var(--muted); }
  .msg { padding: 0.625rem 0.875rem; border-radius: 8px; border: 1px solid var(--border); max-width: 100%; }
  .msg.user { background: var(--user-bg); }
  .msg.assistant { background: var(--bot-bg); }
  .who { display: block; font-weight: 700; margin-bottom: 0.125rem; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .note { margin: 0.375rem 0 0; font-size: 0.875rem; font-weight: 600; color: var(--muted); }
  .msg.error .note { color: var(--danger); }

  #status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-height: 2.5rem;
    padding: 0.375rem 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left-width: 6px;
    border-radius: 6px;
    font-weight: 600;
  }
  #status[data-kind="generating"] { border-left-color: var(--primary); }
  #status[data-kind="finished"] { border-left-color: #1b5e20; }
  #status[data-kind="stopped"] { border-left-color: #6d4c00; }
  #status[data-kind="error"] { border-left-color: var(--danger); color: var(--danger); }
  #status[data-kind="idle"] { border-left-color: var(--border); }
  .spinner {
    display: none;
    width: 1rem; height: 1rem;
    border: 3px solid var(--primary);
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    flex: none;
  }
  #status[data-kind="generating"] .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-right-color: var(--primary); }
    * { scroll-behavior: auto !important; }
  }

  form { display: flex; flex-direction: column; gap: 0.5rem; }
  label { font-weight: 700; }
  textarea {
    width: 100%;
    min-height: 5rem;
    resize: vertical;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.625rem;
  }
  .hint { margin: 0; font-size: 0.875rem; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  button {
    font: inherit;
    font-weight: 600;
    min-height: 2.75rem;
    min-width: 2.75rem;
    padding: 0.5rem 1.125rem;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    color: #fff;
    background: var(--primary);
  }
  #stop { background: var(--danger); }
  #regenerate { background: #fff; color: var(--primary); border-color: var(--primary); }
  button:disabled {
    cursor: not-allowed;
    background: #e2e2e2;
    color: #595959;
    border-color: #8a8a8a;
  }
  :focus-visible {
    outline: 3px solid #1a1a1a;
    outline-offset: 2px;
    box-shadow: 0 0 0 5px #fff;
  }
  #conversation:focus-visible { outline-offset: -3px; box-shadow: none; }
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  @media (forced-colors: active) {
    button:disabled { border-color: GrayText; color: GrayText; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat assistant</h1>
  </header>

  <main>
    <div id="conversation" role="region" aria-label="Conversation history" tabindex="0">
      <p id="empty">No messages yet. Type a message below to start.</p>
      <ul id="messages" role="list"></ul>
    </div>

    <div id="status" role="status" aria-atomic="true" data-kind="idle">
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text">Ready.</span>
    </div>

    <form id="chat-form" autocomplete="off">
      <label for="prompt">Your message</label>
      <textarea id="prompt" name="prompt" rows="3" aria-describedby="prompt-hint"></textarea>
      <p class="hint" id="prompt-hint">Press Enter to send. Press Shift+Enter for a new line.</p>
      <div class="actions">
        <button type="submit" id="send">Send</button>
        <button type="button" id="stop" disabled>Stop</button>
        <button type="button" id="regenerate" disabled>Regenerate</button>
      </div>
    </form>
  </main>
</div>

<script>
(function () {
  'use strict';

  var form = document.getElementById('chat-form');
  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var regenBtn = document.getElementById('regenerate');
  var listEl = document.getElementById('messages');
  var emptyEl = document.getElementById('empty');
  var convoEl = document.getElementById('conversation');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('status-text');

  // Conversation model: {role, content, state, error, el, bodyEl, noteEl}
  var messages = [];
  var current = null;   // active stream: {handle, msg}
  var reqId = 0;        // incremented to invalidate callbacks from old/aborted streams
  var statusTimer = null;

  function setStatus(text, kind) {
    statusEl.setAttribute('data-kind', kind);
    // Clear then set so repeated identical messages are announced again.
    statusText.textContent = '';
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { statusText.textContent = text; }, 40);
  }

  function setUI() {
    var active = document.activeElement;
    var streaming = !!current;
    sendBtn.disabled = streaming;
    stopBtn.disabled = !streaming;
    regenBtn.disabled = streaming || !messages.some(function (m) { return m.role === 'user'; });
    emptyEl.hidden = messages.length > 0;
    // Never leave keyboard focus on a control that just became disabled.
    if (active && active.disabled) { promptEl.focus(); }
  }

  function nearBottom() {
    return convoEl.scrollHeight - convoEl.scrollTop - convoEl.clientHeight < 60;
  }
  function scrollToBottom() { convoEl.scrollTop = convoEl.scrollHeight; }

  function addMessageEl(msg) {
    var li = document.createElement('li');
    li.className = 'msg ' + msg.role;
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = msg.role === 'user' ? 'You' : 'Assistant';
    var body = document.createElement('p');
    body.className = 'body';
    body.textContent = msg.content;
    var note = document.createElement('p');
    note.className = 'note';
    note.hidden = true;
    li.appendChild(who);
    li.appendChild(body);
    li.appendChild(note);
    msg.el = li; msg.bodyEl = body; msg.noteEl = note;
    var stick = nearBottom();
    listEl.appendChild(li);
    if (stick || msg.role === 'user') scrollToBottom();
    updateMessageEl(msg);
  }

  function updateMessageEl(msg) {
    var li = msg.el;
    if (!li) return;
    li.classList.toggle('error', msg.state === 'error');
    if (msg.state === 'streaming') li.setAttribute('aria-busy', 'true');
    else li.removeAttribute('aria-busy');
    var note = '';
    if (msg.state === 'streaming') note = msg.content ? 'Generating…' : 'Generating… waiting for the first words.';
    else if (msg.state === 'stopped') note = msg.content ? 'Stopped. Partial answer kept.' : 'Stopped before any text arrived.';
    else if (msg.state === 'error') note = 'Error: ' + (msg.error || 'the answer could not be completed.') + (msg.content ? ' The partial answer is kept.' : '');
    msg.noteEl.textContent = note;
    msg.noteEl.hidden = !note;
  }

  function removeMessagesAfter(index) {
    while (messages.length > index + 1) {
      var m = messages.pop();
      if (m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el);
    }
  }

  function errText(err) {
    if (err && typeof err === 'object' && err.message) return String(err.message);
    if (err) return String(err);
    return 'Unknown error';
  }

  function startStream() {
    // Build API history from messages so far (skip empty assistant entries).
    var apiMessages = messages
      .filter(function (m) { return m.role === 'user' || m.content.length > 0; })
      .map(function (m) { return { role: m.role, content: m.content }; });

    var msg = { role: 'assistant', content: '', state: 'streaming', error: '' };
    messages.push(msg);
    addMessageEl(msg);

    var id = ++reqId;
    var ctx = { handle: null, msg: msg };
    current = ctx;
    setUI();
    setStatus('Assistant is generating an answer…', 'generating');

    function live() { return id === reqId && current === ctx; }

    function finishWith(state, errMsg) {
      msg.state = state;
      if (errMsg) msg.error = errMsg;
      current = null;
      updateMessageEl(msg);
      setUI();
    }

    var callbacks = {
      onToken: function (text) {
        if (!live()) return;            // ignore late chunks after stop
        var stick = nearBottom();
        msg.content += text;
        msg.bodyEl.textContent = msg.content;
        updateMessageEl(msg);
        if (stick) scrollToBottom();
      },
      onDone: function () {
        if (!live()) return;
        finishWith('done');
        setStatus('Answer finished.', 'finished');
      },
      onError: function (err) {
        if (!live()) return;
        var t = errText(err);
        finishWith('error', t);
        setStatus('Error: ' + t + ' You can press Regenerate to try again.', 'error');
      }
    };

    try {
      ctx.handle = window.ChatSDK.streamChat(apiMessages, callbacks);
    } catch (e) {
      callbacks.onError(e);
    }
  }

  function sendMessage() {
    if (current) return;
    var text = promptEl.value.trim();
    if (!text) {
      setStatus('Please type a message before sending.', 'idle');
      promptEl.focus();
      return;
    }
    var userMsg = { role: 'user', content: text, state: 'done' };
    messages.push(userMsg);
    addMessageEl(userMsg);
    promptEl.value = '';
    startStream();
    promptEl.focus();
  }

  function stopStream() {
    if (!current) return;
    var ctx = current;
    reqId++;            // invalidate any callback that may still arrive
    current = null;
    try { if (ctx.handle && typeof ctx.handle.abort === 'function') ctx.handle.abort(); } catch (e) { /* ignore */ }
    ctx.msg.state = 'stopped';
    updateMessageEl(ctx.msg);
    setUI();
    setStatus(ctx.msg.content ? 'Stopped. The partial answer was kept.' : 'Stopped before any text arrived.', 'stopped');
  }

  function regenerate() {
    if (current) return;
    var lastUser = -1;
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') { lastUser = i; break; }
    }
    if (lastUser < 0) return;
    removeMessagesAfter(lastUser);   // drop the previous answer (finished, stopped, or failed)
    startStream();
    if (!stopBtn.disabled) stopBtn.focus();
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); sendMessage(); });
  stopBtn.addEventListener('click', stopStream);
  regenBtn.addEventListener('click', regenerate);
  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  setUI();
})();
</script>
</body>
</html>
