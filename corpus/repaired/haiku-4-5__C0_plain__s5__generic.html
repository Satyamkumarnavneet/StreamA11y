<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 16px;
            border-bottom: 1px solid #e5e5ea;
            background: #fafafa;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #000;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #007AFF;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: #e5e5ea;
            color: #000;
            border-bottom-left-radius: 4px;
        }

        .status {
            padding: 8px 16px;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            min-height: 1.4em;
        }

        .status.generating {
            color: #007AFF;
            font-weight: 500;
        }

        .status.stopped {
            color: #ff9500;
            font-weight: 500;
        }

        .status.error {
            color: #ff3b30;
            font-weight: 500;
        }

        .status:empty {
            display: none;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e5e5ea;
            background: #fafafa;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .textarea-wrapper {
            flex: 1;
            min-width: 200px;
        }

        #prompt {
            width: 100%;
            padding: 12px;
            border: 2px solid #d5d5d5;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        #prompt:focus {
            outline: none;
            border-color: #007AFF;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        button {
            padding: 10px 16px;
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            min-height: 44px;
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.4);
        }

        #send {
            background: #007AFF;
            color: white;
        }

        #send:hover:not(:disabled) {
            background: #0051d5;
        }

        #send:active:not(:disabled) {
            background: #003d99;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #stop {
            background: #ff9500;
            color: white;
        }

        #stop:hover {
            background: #e68900;
        }

        #stop:active {
            background: #cc7700;
        }

        #regenerate {
            background: #5ac8fa;
            color: white;
        }

        #regenerate:hover {
            background: #34aaeb;
        }

        #regenerate:active {
            background: #0a96da;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 600px) {
            .button-group {
                width: 100%;
            }

            button {
                flex: 1;
                min-width: 100px;
            }

            .message-content {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Chat Assistant</h1>
        </header>

        <main class="messages" id="messages" role="log" aria-live="polite" aria-label="Chat conversation history">
            <div class="empty-state">Start a conversation</div>
        </main>

        <section class="input-area" aria-label="Message input">
            <div id="status" role="status" aria-live="assertive" aria-atomic="true"></div>
            <form class="input-group" id="messageForm" onsubmit="event.preventDefault(); sendMessage();">
                <div class="textarea-wrapper">
                    <label for="prompt" class="sr-only">Message input</label>
                    <textarea
                        id="prompt"
                        placeholder="Type your message... (Shift+Enter for new line)"
                        rows="1"
                        aria-describedby="keyboardHint"
                    ></textarea>
                </div>
                <div id="keyboardHint" class="sr-only">Press Enter to send, or Shift+Enter to add a new line. Use Tab to navigate buttons.</div>
                <div class="button-group">
                    <button id="send" type="submit" aria-label="Send message">Send</button>
                    <button id="stop" type="button" aria-label="Stop generating response">Stop</button>
                    <button id="regenerate" type="button" aria-label="Ask for a new response to the last message">Regenerate</button>
                </div>
            </form>
        </section>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('send');
        const stopBtn = document.getElementById('stop');
        const regenerateBtn = document.getElementById('regenerate');
        const statusDiv = document.getElementById('status');
        const messageForm = document.getElementById('messageForm');

        let messages = [];
        let currentStream = null;
        let isStreaming = false;
        let lastUserMessage = null;
        let lastAssistantContentDiv = null;

        function clearEmptyState() {
            const emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
        }

        function addMessageToDOM(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            // Add ARIA label for screen readers
            if (role === 'user') {
                contentDiv.setAttribute('aria-label', `User message: ${content}`);
            } else {
                contentDiv.setAttribute('aria-label', 'Assistant response');
            }

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            return contentDiv;
        }

        function setStatus(text, type = '') {
            if (text) {
                statusDiv.textContent = text;
                statusDiv.className = `status ${type}`;
            } else {
                statusDiv.textContent = '';
                statusDiv.className = 'status';
            }
        }

        function updateUIState() {
            const hasMessages = messages.length > 0;
            const lastMessageIsAssistant = hasMessages && messages[messages.length - 1].role === 'assistant';
            
            sendBtn.disabled = isStreaming;
            stopBtn.hidden = !isStreaming;
            regenerateBtn.hidden = isStreaming || !lastMessageIsAssistant;
            
            // Announce button visibility changes to screen readers
            if (isStreaming) {
                statusDiv.setAttribute('aria-live', 'assertive');
            }
        }

        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text || isStreaming) return;

            clearEmptyState();
            
            messages.push({ role: 'user', content: text });
            lastUserMessage = text;
            addMessageToDOM('user', text);
            promptInput.value = '';
            promptInput.style.height = 'auto';

            await streamAssistantResponse();
        }

        async function streamAssistantResponse() {
            isStreaming = true;
            updateUIState();
            setStatus('Generating response...', 'generating');

            lastAssistantContentDiv = addMessageToDOM('assistant', '');
            let fullResponse = '';

            currentStream = window.ChatSDK.streamChat(messages, {
                onToken(text) {
                    if (isStreaming) {
                        fullResponse += text;
                        lastAssistantContentDiv.textContent = fullResponse;
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                },
                onDone() {
                    if (isStreaming) {
                        isStreaming = false;
                        messages.push({ role: 'assistant', content: fullResponse });
                        lastAssistantContentDiv.setAttribute('aria-label', `Assistant response: ${fullResponse}`);
                        setStatus('');
                        updateUIState();
                        currentStream = null;
                        promptInput.focus();
                    }
                },
                onError(error) {
                    if (isStreaming) {
                        isStreaming = false;
                        const errorMsg = error.message || 'An error occurred';
                        setStatus(`Error: ${errorMsg}`, 'error');
                        updateUIState();
                        currentStream = null;
                        promptInput.focus();
                    }
                }
            });
        }

        function stopStream() {
            if (currentStream && isStreaming) {
                currentStream.abort();
                isStreaming = false;
                setStatus('Response stopped', 'stopped');
                
                // Save the partial response to messages
                const partialContent = lastAssistantContentDiv.textContent;
                messages.push({ role: 'assistant', content: partialContent });
                lastAssistantContentDiv.setAttribute('aria-label', `Assistant response (stopped): ${partialContent}`);
                
                updateUIState();
                currentStream = null;
                promptInput.focus();
            }
        }

        async function regenerateResponse() {
            if (messages.length === 0) return;

            // Remove the last assistant message from state
            const lastIdx = messages.length - 1;
            if (messages[lastIdx].role === 'assistant') {
                messages.pop();
            }

            // Remove the last assistant message from DOM
            const lastAssistantMsg = messagesContainer.querySelector('.message.assistant:last-child');
            if (lastAssistantMsg) {
                lastAssistantMsg.remove();
            }

            await streamAssistantResponse();
        }

        function autoResizeTextarea() {
            promptInput.style.height = 'auto';
            promptInput.style.height = Math.min(promptInput.scrollHeight, 120) + 'px';
        }

        sendBtn.addEventListener('click', sendMessage);
        stopBtn.addEventListener('click', stopStream);
        regenerateBtn.addEventListener('click', regenerateResponse);

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !isStreaming) {
                e.preventDefault();
                sendMessage();
            }
        });

        promptInput.addEventListener('input', autoResizeTextarea);

        // Set initial focus to textarea
        promptInput.focus();
        
        updateUIState();
    </script>
</body>
</html>
