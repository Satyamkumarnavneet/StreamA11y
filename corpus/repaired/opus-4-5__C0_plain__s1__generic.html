<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            padding: 16px 20px;
            background-color: #2563eb;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .message.error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        .status-indicator {
            padding: 8px 16px;
            text-align: center;
            font-size: 13px;
            color: #4b5563;
            background-color: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }

        .status-indicator.generating {
            color: #1d4ed8;
        }

        .status-indicator.stopped {
            color: #b45309;
        }

        .status-indicator.finished {
            color: #15803d;
        }

        .status-indicator.error {
            color: #b91c1c;
        }

        .status-indicator:empty {
            display: none;
        }

        .chat-input-area {
            padding: 16px 20px;
            background-color: #fff;
            border-top: 1px solid #e5e7eb;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        #prompt {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            font-family: inherit;
        }

        #prompt:focus {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
            border-color: #2563eb;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:focus {
            outline: 2px solid #1e40af;
            outline-offset: 2px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #send {
            background-color: #2563eb;
            color: white;
        }

        #send:hover:not(:disabled) {
            background-color: #1d4ed8;
        }

        #stop {
            background-color: #d97706;
            color: white;
        }

        #stop:hover:not(:disabled) {
            background-color: #b45309;
        }

        #regenerate {
            background-color: #4b5563;
            color: white;
        }

        #regenerate:hover:not(:disabled) {
            background-color: #374151;
        }

        .typing-indicator {
            display: inline-block;
        }

        .typing-indicator::after {
            content: '▋';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #2563eb;
            color: white;
            padding: 8px 16px;
            z-index: 100;
            text-decoration: none;
            font-weight: 500;
        }

        .skip-link:focus {
            top: 0;
            outline: 2px solid #1e40af;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <a href="#prompt" class="skip-link">Skip to message input</a>
    
    <div class="chat-container" role="main">
        <header class="chat-header">
            <h1 style="font-size: inherit; font-weight: inherit; margin: 0;">Chat Assistant</h1>
        </header>
        
        <div 
            class="chat-messages" 
            id="messages" 
            role="log" 
            aria-live="polite" 
            aria-label="Conversation history"
            tabindex="0"
        ></div>
        
        <div 
            class="status-indicator" 
            id="status" 
            role="status" 
            aria-live="polite"
            aria-atomic="true"
        ></div>
        
        <div class="chat-input-area">
            <div class="input-row">
                <label for="prompt" class="visually-hidden">Type your message</label>
                <textarea 
                    id="prompt" 
                    placeholder="Type your message..." 
                    rows="1"
                    aria-describedby="input-instructions"
                ></textarea>
                <span id="input-instructions" class="visually-hidden">Press Enter to send, Shift+Enter for new line</span>
                <div class="button-group" role="group" aria-label="Chat controls">
                    <button id="send" type="button">Send</button>
                    <button id="stop" type="button" disabled aria-disabled="true">Stop</button>
                    <button id="regenerate" type="button" disabled aria-disabled="true">Regenerate</button>
                </div>
            </div>
        </div>
    </div>

    <div aria-live="assertive" id="announcer" class="visually-hidden"></div>

    <script>
        (function() {
            const messagesContainer = document.getElementById('messages');
            const promptInput = document.getElementById('prompt');
            const sendButton = document.getElementById('send');
            const stopButton = document.getElementById('stop');
            const regenerateButton = document.getElementById('regenerate');
            const statusIndicator = document.getElementById('status');
            const announcer = document.getElementById('announcer');

            let conversationHistory = [];
            let currentHandle = null;
            let isGenerating = false;
            let currentAssistantMessageEl = null;
            let currentAssistantContent = '';
            let aborted = false;

            function announce(message) {
                announcer.textContent = '';
                setTimeout(() => {
                    announcer.textContent = message;
                }, 100);
            }

            function setStatus(text, type) {
                statusIndicator.textContent = text;
                statusIndicator.className = 'status-indicator';
                if (type) {
                    statusIndicator.classList.add(type);
                }
            }

            function clearStatus() {
                statusIndicator.textContent = '';
                statusIndicator.className = 'status-indicator';
            }

            function updateButtonStates() {
                const hasUserMessage = conversationHistory.some(m => m.role === 'user');
                
                sendButton.disabled = isGenerating;
                sendButton.setAttribute('aria-disabled', isGenerating ? 'true' : 'false');
                
                stopButton.disabled = !isGenerating;
                stopButton.setAttribute('aria-disabled', !isGenerating ? 'true' : 'false');
                
                regenerateButton.disabled = isGenerating || !hasUserMessage;
                regenerateButton.setAttribute('aria-disabled', (isGenerating || !hasUserMessage) ? 'true' : 'false');
            }

            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function addMessageElement(role, content, isStreaming = false) {
                const messageEl = document.createElement('div');
                messageEl.className = `message ${role}`;
                messageEl.setAttribute('role', 'article');
                
                const roleLabel = role === 'user' ? 'You' : 'Assistant';
                messageEl.setAttribute('aria-label', roleLabel + ' said');
                
                const textSpan = document.createElement('span');
                textSpan.textContent = content;
                messageEl.appendChild(textSpan);
                
                if (isStreaming && role === 'assistant') {
                    const cursor = document.createElement('span');
                    cursor.className = 'typing-indicator';
                    cursor.setAttribute('aria-hidden', 'true');
                    messageEl.appendChild(cursor);
                }
                
                messagesContainer.appendChild(messageEl);
                scrollToBottom();
                return messageEl;
            }

            function updateAssistantMessage(content, isStreaming = false) {
                if (currentAssistantMessageEl) {
                    currentAssistantMessageEl.innerHTML = '';
                    
                    const textSpan = document.createElement('span');
                    textSpan.textContent = content;
                    currentAssistantMessageEl.appendChild(textSpan);
                    
                    if (isStreaming) {
                        const cursor = document.createElement('span');
                        cursor.className = 'typing-indicator';
                        cursor.setAttribute('aria-hidden', 'true');
                        currentAssistantMessageEl.appendChild(cursor);
                    }
                    scrollToBottom();
                }
            }

            function renderConversation() {
                messagesContainer.innerHTML = '';
                for (const msg of conversationHistory) {
                    addMessageElement(msg.role, msg.content);
                }
            }

            function startStreaming(messages) {
                isGenerating = true;
                aborted = false;
                currentAssistantContent = '';
                updateButtonStates();
                setStatus('Generating...', 'generating');
                announce('Assistant is generating a response');

                currentAssistantMessageEl = addMessageElement('assistant', '', true);

                currentHandle = window.ChatSDK.streamChat(messages, {
                    onToken: function(text) {
                        if (aborted) {
                            return;
                        }
                        currentAssistantContent += text;
                        updateAssistantMessage(currentAssistantContent, true);
                    },
                    onDone: function() {
                        if (aborted) {
                            return;
                        }
                        isGenerating = false;
                        currentHandle = null;
                        updateAssistantMessage(currentAssistantContent, false);
                        conversationHistory.push({
                            role: 'assistant',
                            content: currentAssistantContent
                        });
                        currentAssistantMessageEl = null;
                        updateButtonStates();
                        setStatus('Response complete', 'finished');
                        announce('Response complete');
                        setTimeout(clearStatus, 2000);
                    },
                    onError: function(error) {
                        if (aborted) {
                            return;
                        }
                        isGenerating = false;
                        currentHandle = null;
                        
                        if (currentAssistantContent) {
                            updateAssistantMessage(currentAssistantContent, false);
                            conversationHistory.push({
                                role: 'assistant',
                                content: currentAssistantContent
                            });
                        } else if (currentAssistantMessageEl) {
                            currentAssistantMessageEl.remove();
                        }
                        
                        const errorMsg = error && error.message ? error.message : 'An error occurred';
                        const errorEl = addMessageElement('assistant', 'Error: ' + errorMsg);
                        errorEl.classList.add('error');
                        errorEl.setAttribute('role', 'alert');
                        
                        currentAssistantMessageEl = null;
                        updateButtonStates();
                        setStatus('Error: ' + errorMsg, 'error');
                        announce('Error: ' + errorMsg);
                    }
                });
            }

            function sendMessage() {
                const content = promptInput.value.trim();
                if (!content || isGenerating) return;

                promptInput.value = '';
                promptInput.style.height = 'auto';

                conversationHistory.push({
                    role: 'user',
                    content: content
                });

                addMessageElement('user', content);
                announce('Message sent');

                const messagesToSend = conversationHistory.map(m => ({
                    role: m.role,
                    content: m.content
                }));

                startStreaming(messagesToSend);
            }

            function stopGeneration() {
                if (currentHandle && isGenerating) {
                    aborted = true;
                    currentHandle.abort();
                    currentHandle = null;
                    isGenerating = false;

                    updateAssistantMessage(currentAssistantContent, false);
                    
                    if (currentAssistantContent) {
                        conversationHistory.push({
                            role: 'assistant',
                            content: currentAssistantContent
                        });
                    } else if (currentAssistantMessageEl) {
                        currentAssistantMessageEl.remove();
                    }

                    currentAssistantMessageEl = null;
                    updateButtonStates();
                    setStatus('Generation stopped', 'stopped');
                    announce('Generation stopped');
                    setTimeout(clearStatus, 2000);
                }
            }

            function regenerate() {
                if (isGenerating) return;

                let lastUserIndex = -1;
                for (let i = conversationHistory.length - 1; i >= 0; i--) {
                    if (conversationHistory[i].role === 'user') {
                        lastUserIndex = i;
                        break;
                    }
                }

                if (lastUserIndex === -1) return;

                conversationHistory = conversationHistory.slice(0, lastUserIndex + 1);

                renderConversation();
                announce('Regenerating response');

                const messagesToSend = conversationHistory.map(m => ({
                    role: m.role,
                    content: m.content
                }));

                startStreaming(messagesToSend);
            }

            sendButton.addEventListener('click', sendMessage);

            promptInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            promptInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            stopButton.addEventListener('click', stopGeneration);

            regenerateButton.addEventListener('click', regenerate);

            updateButtonStates();
        })();
    </script>
</body>
</html>
