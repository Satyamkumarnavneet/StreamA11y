<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Assistant</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    color: #1d1f23;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 820px;
    margin: 0 auto;
    background: #ffffff;
    box-shadow: 0 0 0 1px #e1e4e8;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid #e1e4e8;
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0;
    font-weight: 600;
  }
  .status {
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: #eef0f3;
    color: #4a4f57;
    white-space: nowrap;
  }
  .status.generating { background: #e6f0ff; color: #1b4fa0; }
  .status.generating::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    margin-right: 6px;
    border-radius: 50%;
    background: #1b4fa0;
    animation: pulse 1s infinite ease-in-out;
  }
  .status.done { background: #e7f6ec; color: #1d6b38; }
  .status.stopped { background: #fff4e0; color: #8a5a00; }
  .status.error { background: #fde8e8; color: #9b1c1c; }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty {
    margin: auto;
    color: #6a7079;
    text-align: center;
    font-size: 0.95rem;
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .msg .role {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6a7079;
    margin-bottom: 4px;
  }
  .msg .content {
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    padding: 10px 13px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 0.95rem;
  }
  .msg.user .content { background: #1b6ef3; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .content { background: #eef0f3; color: #1d1f23; border-bottom-left-radius: 4px; }
  .msg.assistant.streaming .content::after {
    content: "▍";
    margin-left: 2px;
    color: #1b4fa0;
    animation: pulse 1s infinite ease-in-out;
  }

  form#composer {
    border-top: 1px solid #e1e4e8;
    padding: 12px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  textarea#prompt {
    resize: vertical;
    min-height: 48px;
    max-height: 220px;
    padding: 10px 12px;
    font: inherit;
    font-size: 0.95rem;
    border: 1px solid #c9ced6;
    border-radius: 10px;
    outline: none;
  }
  textarea#prompt:focus { border-color: #1b6ef3; box-shadow: 0 0 0 3px rgba(27,110,243,0.15); }
  textarea#prompt[readonly] { opacity: 0.45; cursor: not-allowed; }
  .buttons {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-size: 0.9rem;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #c9ced6;
    background: #ffffff;
    color: #1d1f23;
    cursor: pointer;
  }
  button:hover:not([aria-disabled="true"]) { background: #f0f3f8; }
  button:focus-visible { outline: 2px solid #1b6ef3; outline-offset: 2px; }
  /* Unavailable controls stay focusable (aria-disabled) so keyboard focus is never lost. */
  button[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
  #send { background: #1b6ef3; border-color: #1b6ef3; color: #fff; }
  #send:hover:not([aria-disabled="true"]) { background: #1659cc; }
  #stop { border-color: #c2410c; color: #c2410c; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Chat Assistant</h1>
    <div id="status" class="status" role="status" aria-live="polite">Ready</div>
  </header>

  <main id="conversation" aria-label="Conversation"></main>

  <form id="composer" onsubmit="return false;">
    <textarea id="prompt" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for a new line)" aria-label="Message"></textarea>
    <div class="buttons">
      <button type="button" id="send" aria-disabled="false">Send</button>
      <button type="button" id="stop" aria-disabled="true">Stop</button>
      <button type="button" id="regenerate" aria-disabled="true">Regenerate</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';

  var els = {
    conversation: document.getElementById('conversation'),
    status: document.getElementById('status'),
    prompt: document.getElementById('prompt'),
    send: document.getElementById('send'),
    stop: document.getElementById('stop'),
    regenerate: document.getElementById('regenerate')
  };

  // Conversation history: [{role: 'user' | 'assistant', content: string}]
  var history = [];

  // The stream currently in progress, or null.
  // { id, handle, bubble, wrap, index }
  var active = null;
  var nextRequestId = 1;
  var serviceAvailable = false;

  function setStatus(kind, text) {
    els.status.className = 'status' + (kind ? ' ' + kind : '');
    els.status.textContent = text;
  }

  function hasUserMessage() {
    for (var i = 0; i < history.length; i++) {
      if (history[i].role === 'user') return true;
    }
    return false;
  }

  // Controls are never removed or set to the `disabled` attribute, so a focused
  // control keeps focus. "Inert" controls ignore activation via guards below.
  function setInert(el, inert) {
    el.setAttribute('aria-disabled', inert ? 'true' : 'false');
  }

  function isInert(el) {
    return el.getAttribute('aria-disabled') === 'true';
  }

  function updateButtons() {
    var streaming = !!active;
    setInert(els.send, streaming || !serviceAvailable);
    setInert(els.stop, !streaming);
    setInert(els.regenerate, streaming || !hasUserMessage() || !serviceAvailable);
  }

  function scrollToBottom() {
    els.conversation.scrollTop = els.conversation.scrollHeight;
  }

  // Rebuilds the whole conversation from history. Uses textContent only,
  // so model output is never interpreted as HTML.
  function renderHistory() {
    els.conversation.innerHTML = '';

    if (history.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Send a message to start the conversation.';
      els.conversation.appendChild(empty);
      return null;
    }

    var lastBubble = null;
    for (var i = 0; i < history.length; i++) {
      var m = history[i];
      var wrap = document.createElement('div');
      wrap.className = 'msg ' + m.role;

      var label = document.createElement('div');
      label.className = 'role';
      label.textContent = m.role === 'user' ? 'You' : 'Assistant';

      var content = document.createElement('div');
      content.className = 'content';
      content.textContent = m.content;

      wrap.appendChild(label);
      wrap.appendChild(content);
      els.conversation.appendChild(wrap);
      lastBubble = { wrap: wrap, content: content };
    }
    scrollToBottom();
    return lastBubble;
  }

  // Removes a trailing empty assistant placeholder, if any.
  function dropEmptyAssistant() {
    var last = history[history.length - 1];
    if (last && last.role === 'assistant' && last.content === '') {
      history.pop();
    }
  }

  // Moves focus off a control that has just become inert, onto a live control.
  function moveFocusIfOn(el, target) {
    if (document.activeElement === el) target.focus();
  }

  function startStream() {
    var requestId = nextRequestId++;

    // Snapshot the messages to send (history as it stands, no placeholder).
    var messages = history.map(function (m) {
      return { role: m.role, content: m.content };
    });

    // Placeholder assistant entry that receives streamed tokens.
    history.push({ role: 'assistant', content: '' });
    var index = history.length - 1;

    var rendered = renderHistory();
    var req = {
      id: requestId,
      handle: null,
      bubble: rendered ? rendered.content : null,
      wrap: rendered ? rendered.wrap : null,
      index: index
    };
    if (req.wrap) req.wrap.classList.add('streaming');

    active = req;
    setStatus('generating', 'Generating…');
    updateButtons();
    // Send/Regenerate are now inert; keep keyboard focus on the live Stop control.
    moveFocusIfOn(els.send, els.stop);
    moveFocusIfOn(els.regenerate, els.stop);

    function isCurrent() {
      return active === req;
    }

    function completeNormally(kind, text) {
      active = null;
      if (req.wrap) req.wrap.classList.remove('streaming');
      dropEmptyAssistant();
      setStatus(kind, text);
      renderHistory();
      updateButtons();
      // Stop is now inert; hand focus to the message box.
      moveFocusIfOn(els.stop, els.prompt);
    }

    var callbacks = {
      onToken: function (text) {
        // Ignore anything that arrives after stop/abort or from an old request.
        if (!isCurrent()) return;
        var entry = history[req.index];
        if (!entry) return;
        entry.content += String(text);
        if (req.bubble) req.bubble.textContent = entry.content;
        scrollToBottom();
      },
      onDone: function () {
        if (!isCurrent()) return;
        completeNormally('done', 'Finished');
      },
      onError: function (error) {
        if (!isCurrent()) return;
        var msg = (error && error.message) ? error.message : String(error || 'Unknown error');
        completeNormally('error', 'Error: ' + msg);
      }
    };

    try {
      req.handle = window.ChatSDK.streamChat(messages, callbacks);
    } catch (err) {
      if (isCurrent()) {
        var msg = (err && err.message) ? err.message : String(err);
        completeNormally('error', 'Error: ' + msg);
      }
    }
  }

  function send() {
    if (active || isInert(els.send)) return;
    var text = els.prompt.value.trim();
    if (!text) return;

    history.push({ role: 'user', content: text });
    els.prompt.value = '';
    renderHistory();
    startStream();
  }

  function stop() {
    if (!active || isInert(els.stop)) return;
    var req = active;

    // Mark as inactive first so any late onToken is ignored.
    active = null;
    if (req.wrap) req.wrap.classList.remove('streaming');

    try {
      if (req.handle && typeof req.handle.abort === 'function') {
        req.handle.abort();
      }
    } catch (e) {
      // Ignore abort failures; the stream is already marked stopped locally.
    }

    // Keep the partial answer. Drop it only if nothing was shown at all.
    dropEmptyAssistant();
    setStatus('stopped', 'Stopped');
    renderHistory();
    updateButtons();
    moveFocusIfOn(els.stop, els.prompt);
  }

  function regenerate() {
    if (active || isInert(els.regenerate)) return;

    var lastUser = -1;
    for (var i = history.length - 1; i >= 0; i--) {
      if (history[i].role === 'user') { lastUser = i; break; }
    }
    if (lastUser === -1) return;

    // Discard everything after the last user message (old answer(s)).
    history.length = lastUser + 1;
    renderHistory();
    startStream();
  }

  // ---- Wiring ----

  els.send.addEventListener('click', send);
  els.stop.addEventListener('click', stop);
  els.regenerate.addEventListener('click', regenerate);

  els.prompt.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  // ---- Init ----

  if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
    serviceAvailable = false;
    setStatus('error', 'Error: chat service is not available');
    els.prompt.readOnly = true;
  } else {
    serviceAvailable = true;
    setStatus('', 'Ready');
  }

  renderHistory();
  updateButtons();
})();
</script>
</body>
</html>
