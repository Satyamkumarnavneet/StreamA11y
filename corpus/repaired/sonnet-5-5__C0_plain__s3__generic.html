<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Assistant</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #dcdfe4; --ctl-border: #6b7280;
    --text: #1d2129; --muted: #4b5563; --user: #2563eb; --user-text: #fff; --asst: #eef0f4;
    --ok: #166534; --warn: #92400e; --err: #b91c1c; --busy: #1d4ed8; --focus: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  .app {
    width: 100%; max-width: 820px; height: 100%; min-height: 0;
    display: flex; flex-direction: column; background: var(--panel);
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 1.125rem; margin: 0; }
  #status {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: .875rem; font-weight: 600; padding: 4px 10px;
    border: 1px solid transparent;
    border-radius: 999px; background: var(--asst); color: var(--muted);
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  #status[data-state="generating"] { color: var(--busy); background: #e3ecfd; }
  #status[data-state="generating"] .dot { animation: pulse 1s infinite ease-in-out; }
  #status[data-state="done"] { color: var(--ok); background: #e0f4e6; }
  #status[data-state="stopped"] { color: var(--warn); background: #fdf0dc; }
  #status[data-state="error"] { color: var(--err); background: #fde4e4; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .role { font-size: .8125rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 3px; }
  .bubble {
    padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word;
    overflow-wrap: anywhere; min-height: 1.5em; border: 1px solid transparent;
  }
  .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--asst); border-bottom-left-radius: 4px; }
  .assistant.generating .bubble::after {
    content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 2px;
    vertical-align: text-bottom; background: var(--busy); animation: pulse 1s infinite;
  }
  .note { font-size: .8125rem; margin-top: 4px; font-weight: 600; }
  .note.stopped { color: var(--warn); }
  .note.error { color: var(--err); }
  .note.done { color: var(--ok); }
  .note.generating { color: var(--busy); }
  .assistant.error .bubble { border: 1px solid #b91c1c; }
  .assistant.stopped .bubble { border: 1px dashed #92400e; }
  .placeholder { color: var(--muted); font-style: italic; }

  form { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; min-width: 0; resize: none; font: inherit; padding: 9px 12px; border: 1px solid var(--ctl-border);
    border-radius: 10px; min-height: 44px; max-height: 160px; background: #fff; color: inherit;
  }
  textarea::placeholder { color: var(--muted); opacity: 1; }
  textarea[aria-invalid="true"] { border-color: var(--err); border-width: 2px; }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 10px; cursor: pointer;
    min-height: 44px; min-width: 44px;
    border: 1px solid var(--ctl-border); background: #fff; color: var(--text);
  }
  button:hover:not(:disabled) { background: #e8ebf0; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  #send { background: var(--user); color: #fff; border-color: #1d4ed8; }
  #send:hover:not(:disabled) { background: #1d4fc4; }
  #stop { color: var(--err); border-color: var(--err); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #log:focus-visible { outline-offset: -3px; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { margin-left: auto; font-size: .8125rem; color: var(--muted); }
  #field-msg { font-size: .875rem; font-weight: 600; color: var(--err); margin: 0; }
  #field-msg:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    #status[data-state="generating"] .dot,
    .assistant.generating .bubble::after { animation: none; }
  }
  @media (forced-colors: active) {
    .bubble { border-color: CanvasText; }
    #status { border-color: CanvasText; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat Assistant</h1>
    <div id="status" data-state="idle">
      <span class="dot" aria-hidden="true"></span><span><span class="sr-only">Status: </span><span id="status-text">Ready</span></span>
    </div>
  </header>

  <main>
    <div id="log" role="log" aria-live="off" aria-label="Conversation" tabindex="0"></div>

    <form id="composer" aria-label="Send a message" novalidate>
      <div class="row">
        <label for="prompt" class="sr-only">Message</label>
        <textarea id="prompt" rows="1" placeholder="Type a message…" aria-describedby="hint field-msg" autocomplete="off"></textarea>
        <button id="send" type="submit">Send</button>
      </div>
      <p id="field-msg"></p>
      <div class="actions">
        <button id="stop" type="button" disabled>Stop</button>
        <button id="regenerate" type="button" disabled>Regenerate</button>
        <span id="hint" class="hint">Enter to send · Shift+Enter for new line</span>
      </div>
    </form>
  </main>

  <!-- Screen-reader announcements -->
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="alerter" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var formEl = document.getElementById('composer');
  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var regenBtn = document.getElementById('regenerate');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var fieldMsg = document.getElementById('field-msg');
  var announcerEl = document.getElementById('announcer');
  var alerterEl = document.getElementById('alerter');

  var history = [];
  var activeId = 0;
  var nextId = 1;
  var uid = 1;
  var activeHandle = null;
  var activeEntry = null;

  var STATUS_LABELS = {
    idle: 'Ready',
    generating: 'Generating…',
    done: 'Finished',
    stopped: 'Stopped',
    error: 'Error'
  };

  function announce(msg, urgent) {
    var el = urgent ? alerterEl : announcerEl;
    el.textContent = '';
    setTimeout(function () { el.textContent = msg; }, 60);
  }

  function setStatus(state, detail) {
    statusEl.setAttribute('data-state', state);
    statusText.textContent = detail || STATUS_LABELS[state];
  }

  function isStreaming() { return activeId !== 0; }

  function updateControls() {
    var streaming = isStreaming();
    var hasUser = history.some(function (m) { return m.role === 'user'; });
    var ae = document.activeElement;
    var losingFocus = (ae === sendBtn && streaming) ||
                      (ae === stopBtn && !streaming) ||
                      (ae === regenBtn && !hasUser);
    sendBtn.disabled = streaming;
    stopBtn.disabled = !streaming;
    regenBtn.disabled = !hasUser;
    if (losingFocus) promptEl.focus(); // never leave focus on a disabled control
  }

  function nearBottom() {
    return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
  }
  function scrollDown() { logEl.scrollTop = logEl.scrollHeight; }

  function noteText(entry) {
    switch (entry.state) {
      case 'generating': return 'Generating…';
      case 'done': return 'Finished';
      case 'stopped': return 'Stopped — partial answer kept';
      case 'error': return 'Error: ' + (entry.errorText || 'the response failed') +
        (entry.content ? ' (partial answer kept)' : '');
      default: return '';
    }
  }

  function paintAssistant(entry) {
    entry.el.className = 'msg assistant ' + entry.state;
    entry.el.setAttribute('aria-busy', entry.state === 'generating' ? 'true' : 'false');
    if (entry.content) {
      entry.bubble.classList.remove('placeholder');
      entry.bubble.textContent = entry.content;
    } else {
      var txt = entry.state === 'generating' ? '' :
                entry.state === 'stopped' ? '(stopped before any text arrived)' :
                entry.state === 'error' ? '(no answer received)' : '(empty answer)';
      entry.bubble.textContent = txt;
      entry.bubble.classList.toggle('placeholder', !!txt);
    }
    entry.note.className = 'note ' + entry.state;
    entry.note.textContent = noteText(entry);
  }

  function buildEntryDom(entry) {
    var wrap = document.createElement('article');
    wrap.className = 'msg ' + entry.role;
    var roleId = 'role-' + (uid++);
    var role = document.createElement('div');
    role.className = 'role';
    role.id = roleId;
    role.textContent = entry.role === 'user' ? 'You' : 'Assistant';
    wrap.setAttribute('aria-labelledby', roleId);
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    wrap.appendChild(role);
    wrap.appendChild(bubble);
    entry.el = wrap;
    entry.bubble = bubble;
    if (entry.role === 'assistant') {
      var note = document.createElement('div');
      note.className = 'note';
      wrap.appendChild(note);
      entry.note = note;
      paintAssistant(entry);
    } else {
      bubble.textContent = entry.content;
    }
    return wrap;
  }

  function renderAll() {
    logEl.textContent = '';
    if (!history.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No messages yet. Say hello to get started.';
      logEl.appendChild(e);
    } else {
      history.forEach(function (m) { logEl.appendChild(buildEntryDom(m)); });
    }
    scrollDown();
  }

  function appendEntry(entry) {
    if (!history.length || logEl.querySelector('.empty')) logEl.textContent = '';
    history.push(entry);
    logEl.appendChild(buildEntryDom(entry));
    scrollDown();
  }

  function apiMessages(upToExclusive) {
    return history.slice(0, upToExclusive)
      .filter(function (m) { return m.content && m.content.length; })
      .map(function (m) { return { role: m.role, content: m.content }; });
  }

  function detachActive() {
    var h = activeHandle;
    activeId = 0;
    activeHandle = null;
    activeEntry = null;
    if (h && typeof h.abort === 'function') {
      try { h.abort(); } catch (e) { /* ignore */ }
    }
  }

  function startStream() {
    var messages = apiMessages(history.length);
    var entry = { role: 'assistant', content: '', state: 'generating', errorText: '' };
    appendEntry(entry);

    var id = nextId++;
    activeId = id;
    activeEntry = entry;
    activeHandle = null;
    setStatus('generating');
    announce('Assistant is generating a response.');
    updateControls();

    function finish(state, errText) {
      if (activeId !== id) return;
      activeId = 0; activeHandle = null; activeEntry = null;
      entry.state = state;
      entry.errorText = errText || '';
      var stick = nearBottom();
      paintAssistant(entry);
      if (stick) scrollDown();
      if (state === 'error') {
        setStatus('error', 'Error: ' + (errText || 'the response failed'));
        announce('Error: ' + (errText || 'the response failed') +
          (entry.content ? ' Partial answer kept.' : ''), true);
      } else {
        setStatus(state);
        announce('Response finished. Assistant said: ' + (entry.content || 'empty answer'));
      }
      updateControls();
    }

    var handle;
    try {
      if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
        throw new Error('Chat service is not available');
      }
      handle = window.ChatSDK.streamChat(messages, {
        onToken: function (text) {
          if (activeId !== id) return;
          if (typeof text !== 'string' || !text) return;
          entry.content += text;
          var stick = nearBottom();
          entry.bubble.classList.remove('placeholder');
          entry.bubble.textContent = entry.content;
          if (stick) scrollDown();
        },
        onDone: function () { finish('done'); },
        onError: function (err) {
          var msg = (err && (err.message || String(err))) || 'the response failed';
          finish('error', msg);
        }
      });
    } catch (err) {
      finish('error', (err && err.message) || 'could not start the request');
      return;
    }
    if (activeId === id) activeHandle = handle;
  }

  function clearFieldMsg() {
    fieldMsg.textContent = '';
    promptEl.removeAttribute('aria-invalid');
  }

  function send() {
    if (isStreaming()) return;
    var text = promptEl.value.trim();
    if (!text) {
      fieldMsg.textContent = 'Please enter a message before sending.';
      promptEl.setAttribute('aria-invalid', 'true');
      announce('Please enter a message before sending.', true);
      promptEl.focus();
      return;
    }
    clearFieldMsg();
    promptEl.value = '';
    autoSize();
    appendEntry({ role: 'user', content: text });
    promptEl.focus();
    startStream();
  }

  function stop() {
    if (!isStreaming()) return;
    var entry = activeEntry;
    detachActive();
    if (entry) {
      entry.state = 'stopped';
      paintAssistant(entry);
    }
    setStatus('stopped');
    announce('Response stopped. Partial answer kept.');
    updateControls();
    promptEl.focus();
  }

  function regenerate() {
    var lastUser = -1;
    for (var i = history.length - 1; i >= 0; i--) {
      if (history[i].role === 'user') { lastUser = i; break; }
    }
    if (lastUser < 0) return;
    if (isStreaming()) detachActive();
    history.length = lastUser + 1;
    renderAll();
    startStream();
  }

  function autoSize() {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight + 2, 160) + 'px';
  }

  formEl.addEventListener('submit', function (e) { e.preventDefault(); send(); });
  stopBtn.addEventListener('click', stop);
  regenBtn.addEventListener('click', regenerate);
  promptEl.addEventListener('input', function () {
    autoSize();
    if (fieldMsg.textContent) clearFieldMsg();
  });
  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  renderAll();
  setStatus('idle');
  updateControls();
  promptEl.focus();
})();
</script>
</body>
</html>
