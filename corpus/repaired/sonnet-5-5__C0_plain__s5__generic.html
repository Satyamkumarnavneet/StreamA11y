<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Assistant</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #dcdfe5;        /* decorative separators only */
    --control-border: #6b7280;/* >= 3:1 against white for UI component boundaries */
    --text: #1d2129;
    --muted: #4b5563;         /* >= 4.5:1 on white and on --assistant */
    --user: #1d4ed8;
    --user-text: #ffffff;
    --assistant: #eef0f4;
    --ok: #166534;
    --warn: #92400e;
    --err: #991b1b;
    --busy: #1e40af;
    --focus: #1d4ed8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    margin: -1px; padding: 0; border: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }
  #app {
    width: 100%;
    max-width: 51.25rem;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  header h1 { font-size: 1.125rem; margin: 0; }
  #status {
    font-size: 0.875rem;
    display: inline-flex;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 0.25rem 0.75rem;
    border-radius: 1rem;
    background: var(--assistant);
    color: var(--muted);
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  #status::before {
    content: "";
    width: 0.5rem; height: 0.5rem; border-radius: 50%;
    background: currentColor;
    flex: none;
    margin-top: 0.4em;
  }
  #status[data-state="generating"] { color: var(--busy); background: #e5eeff; }
  #status[data-state="finished"] { color: var(--ok); background: #e3f6e9; }
  #status[data-state="stopped"] { color: var(--warn); background: #fdf0dc; }
  #status[data-state="error"] { color: var(--err); background: #fde6e6; }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.875rem;
  }
  #log:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .empty { margin: auto; color: var(--muted); font-size: 0.875rem; text-align: center; }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .role { font-size: 0.8125rem; font-weight: 600; color: var(--muted); margin-bottom: 0.1875rem; }
  .bubble {
    padding: 0.5625rem 0.8125rem;
    border: 1px solid transparent;
    border-radius: 0.875rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.5;
    font-size: 1rem;
    min-height: 1.5em;
  }
  .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 0.25rem; }
  .assistant .bubble { background: var(--assistant); border-bottom-left-radius: 0.25rem; }
  .assistant.streaming .bubble::after {
    content: "";
    display: inline-block;
    width: 0.4375rem; height: 1em;
    margin-left: 0.125rem;
    vertical-align: text-bottom;
    background: var(--muted);
  }
  .assistant.error .bubble { border: 1px solid var(--err); }
  .assistant.stopped .bubble { border: 1px dashed var(--warn); }
  .meta { font-size: 0.875rem; margin-top: 0.25rem; }
  .meta.stopped { color: var(--warn); }
  .meta.error { color: var(--err); }
  .meta.thinking { color: var(--busy); }

  #composer-area { border-top: 1px solid var(--border); padding: 0.75rem 1rem; background: var(--panel); }
  label[for="prompt"] { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.25rem; }
  #composer { display: flex; gap: 0.5rem; align-items: flex-end; }
  #prompt {
    flex: 1;
    min-width: 0;
    resize: none;
    font: inherit;
    font-size: 1rem;
    padding: 0.5625rem 0.75rem;
    border: 1px solid var(--control-border);
    border-radius: 0.625rem;
    max-height: 10rem;
    min-height: 2.75rem;
    line-height: 1.4;
    background: #fff;
    color: var(--text);
  }
  #prompt::placeholder { color: var(--muted); opacity: 1; }
  #prompt:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit;
    font-size: 0.9375rem;
    min-height: 2.75rem;
    min-width: 2.75rem;
    padding: 0.5rem 1rem;
    border-radius: 0.625rem;
    border: 1px solid var(--control-border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #e8ebf1; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #send { background: var(--user); color: #fff; border-color: var(--user); }
  #send:hover:not(:disabled) { background: #1e3a8a; }
  #stop { color: var(--err); border-color: var(--err); }
  .hint { font-size: 0.8125rem; color: var(--muted); margin: 0 0 0 auto; }

  @media (max-width: 32.5rem) { .hint { margin-left: 0; } .msg { max-width: 94%; } }
  @media (forced-colors: active) {
    .bubble { border-color: CanvasText; }
    #status { border: 1px solid CanvasText; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Chat Assistant</h1>
    <div id="status" data-state="idle">Ready</div>
  </header>

  <main id="main" aria-label="Chat">
    <div id="log" role="log" aria-live="off" tabindex="0" aria-label="Conversation history"></div>

    <section id="composer-area" aria-label="Message composer">
      <label for="prompt">Message</label>
      <div id="composer">
        <textarea id="prompt" rows="1" placeholder="Type a message…" aria-describedby="hint" autocomplete="off"></textarea>
        <button id="send" type="button">Send</button>
      </div>
      <div class="actions">
        <button id="stop" type="button" disabled>Stop</button>
        <button id="regenerate" type="button" disabled>Regenerate</button>
        <p class="hint" id="hint">Press Enter to send, Shift+Enter for a new line.</p>
      </div>
    </section>
  </main>

  <!-- Screen reader announcements (visually hidden) -->
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="alerter" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var regenBtn = document.getElementById('regenerate');
  var statusEl = document.getElementById('status');
  var announcerEl = document.getElementById('announcer');
  var alerterEl = document.getElementById('alerter');

  var messages = [];
  var current = null;
  var els = new WeakMap();
  var uid = 0;
  var timers = new WeakMap();

  function announce(text, assertive) {
    var region = assertive ? alerterEl : announcerEl;
    var t = timers.get(region);
    if (t) clearTimeout(t);
    region.textContent = '';
    timers.set(region, setTimeout(function () { region.textContent = text; }, 60));
  }

  function setStatus(state, text) {
    statusEl.setAttribute('data-state', state);
    statusEl.textContent = text;
  }

  function lastUserIndex() {
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') return i;
    }
    return -1;
  }

  function updateControls() {
    var busy = !!current;
    sendBtn.disabled = busy;
    stopBtn.disabled = !busy;
    regenBtn.disabled = lastUserIndex() === -1;
    // Never leave keyboard focus on a control that just became disabled.
    var a = document.activeElement;
    if (a && a.tagName === 'BUTTON' && a.disabled) promptEl.focus();
  }

  function nearBottom() {
    return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
  }
  function scrollToBottom() { logEl.scrollTop = logEl.scrollHeight; }

  function metaFor(m) {
    if (m.role !== 'assistant') return { cls: '', text: '' };
    if (m.state === 'streaming') {
      return m.content ? { cls: '', text: '' } : { cls: 'thinking', text: 'Generating…' };
    }
    if (m.state === 'stopped') return { cls: 'stopped', text: m.content ? 'Stopped — partial answer kept' : 'Stopped before any text arrived' };
    if (m.state === 'error') return { cls: 'error', text: 'Error: ' + (m.errorText || 'the response failed') + (m.content ? ' (partial answer kept)' : '') };
    return { cls: '', text: '' };
  }

  function refreshMessage(m) {
    var e = els.get(m);
    if (!e) return;
    e.root.className = 'msg ' + m.role + (m.role === 'assistant' ? ' ' + m.state : '');
    if (e.body.textContent !== m.content) e.body.textContent = m.content;
    var meta = metaFor(m);
    e.meta.className = 'meta ' + meta.cls;
    e.meta.textContent = meta.text;
    e.meta.hidden = !meta.text;
  }

  function render() {
    logEl.textContent = '';
    if (!messages.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No messages yet. Say something to get started.';
      logEl.appendChild(empty);
      updateControls();
      return;
    }
    messages.forEach(function (m) {
      var root = document.createElement('article');
      var role = document.createElement('div');
      role.className = 'role';
      role.id = 'msg-role-' + (++uid);
      role.textContent = m.role === 'user' ? 'You' : 'Assistant';
      root.setAttribute('aria-labelledby', role.id);
      var body = document.createElement('div');
      body.className = 'bubble';
      var meta = document.createElement('div');
      root.appendChild(role);
      root.appendChild(body);
      root.appendChild(meta);
      logEl.appendChild(root);
      els.set(m, { root: root, body: body, meta: meta });
      refreshMessage(m);
    });
    scrollToBottom();
    updateControls();
  }

  function buildPayload(upTo) {
    var out = [];
    for (var i = 0; i < upTo; i++) {
      var m = messages[i];
      if (typeof m.content === 'string' && m.content.trim() !== '') {
        out.push({ role: m.role, content: m.content });
      }
    }
    return out;
  }

  function errorMessage(err) {
    if (!err) return 'unknown error';
    if (typeof err === 'string') return err;
    return err.message || String(err);
  }

  function startStream() {
    var assistant = { role: 'assistant', content: '', state: 'streaming' };
    var payload = buildPayload(messages.length);
    messages.push(assistant);

    var s = { aborted: false, ended: false, handle: null, assistant: assistant };
    current = s;
    render();
    setStatus('generating', 'Generating…');
    announce('Assistant is generating a response.');

    function live() { return current === s && !s.aborted && !s.ended; }

    function finish(state, errText) {
      s.ended = true;
      current = null;
      assistant.state = state;
      if (errText) assistant.errorText = errText;
      refreshMessage(assistant);
      updateControls();
    }

    function fail(err) {
      var msg = errorMessage(err);
      finish('error', msg);
      setStatus('error', 'Error: ' + msg);
      announce('Error: ' + msg, true);
    }

    var callbacks = {
      onToken: function (text) {
        if (!live()) return;
        var chunk = text == null ? '' : String(text);
        if (!chunk) return;
        var stick = nearBottom();
        var firstChunk = assistant.content === '';
        assistant.content += chunk;
        var e = els.get(assistant);
        if (e) {
          e.body.textContent = assistant.content;
          if (firstChunk) refreshMessage(assistant);
        }
        if (stick) scrollToBottom();
      },
      onDone: function () {
        if (!live()) return;
        finish('done');
        setStatus('finished', 'Finished');
        announce(assistant.content
          ? 'Response finished. Assistant said: ' + assistant.content
          : 'Response finished with no text.');
      },
      onError: function (err) {
        if (!live()) return;
        fail(err);
      }
    };

    try {
      s.handle = window.ChatSDK.streamChat(payload, callbacks);
    } catch (err) {
      if (live()) fail(err);
    }
    if (s.aborted && s.handle && typeof s.handle.abort === 'function') {
      try { s.handle.abort(); } catch (e) { /* ignore */ }
    }
  }

  function abortCurrent() {
    var s = current;
    if (!s) return null;
    s.aborted = true;
    current = null;
    try {
      if (s.handle && typeof s.handle.abort === 'function') s.handle.abort();
    } catch (e) { /* late callbacks are ignored anyway */ }
    return s.assistant;
  }

  function send() {
    if (current) return;
    var text = promptEl.value.trim();
    if (!text) return;
    messages.push({ role: 'user', content: text });
    promptEl.value = '';
    autosize();
    startStream();
    promptEl.focus();
  }

  function stop() {
    var a = abortCurrent();
    if (!a) return;
    a.state = 'stopped';
    refreshMessage(a);
    updateControls(); // moves focus to the message box since Stop becomes disabled
    setStatus('stopped', 'Stopped');
    announce(a.content ? 'Generation stopped. Partial answer kept.' : 'Generation stopped before any text arrived.');
  }

  function regenerate() {
    var idx = lastUserIndex();
    if (idx === -1) return;
    abortCurrent();
    messages.length = idx + 1;
    startStream();
  }

  function autosize() {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
  }

  sendBtn.addEventListener('click', send);
  stopBtn.addEventListener('click', stop);
  regenBtn.addEventListener('click', regenerate);
  promptEl.addEventListener('input', autosize);
  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
    setStatus('error', 'Error: chat service unavailable');
    announce('Error: chat service unavailable', true);
  } else {
    setStatus('idle', 'Ready');
  }
  render();
  promptEl.focus();
})();
</script>
</body>
</html>
