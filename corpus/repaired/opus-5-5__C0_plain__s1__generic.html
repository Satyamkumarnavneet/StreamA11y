<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Assistant</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #d9dce1;          /* decorative separators only */
    --control-border: #767f8a;  /* >= 3:1 against white for UI component boundaries */
    --text: #1f2328;
    --muted: #57606a;           /* >= 4.5:1 on white and on assistant bubble */
    --user-bg: #2f6feb;
    --user-text: #ffffff;
    --asst-bg: #eef1f5;
    --accent: #2f6feb;
    --accent-text: #1a4fbf;     /* accent used as text on tinted backgrounds */
    --danger: #b71c1c;
    --warn: #8a5300;
    --ok: #146c2e;
    --focus: #1a4fbf;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 12px;
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  #status {
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: #eceff3;
    color: var(--muted);
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  #status.generating { background: #e3ecff; color: var(--accent-text); }
  #status.stopped    { background: #fff3e0; color: var(--warn); }
  #status.done       { background: #e6f4ea; color: var(--ok); }
  #status.error      { background: #fdecea; color: var(--danger); }

  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #conversation:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: -3px;
  }
  .empty {
    margin: auto;
    color: var(--muted);
    text-align: center;
    font-size: 0.95rem;
  }
  .msg {
    max-width: 85%;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .role {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin: 0;
  }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.5;
  }
  .msg.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--asst-bg); border-bottom-left-radius: 4px; }
  .cursor, .thinking { display: none; }
  .msg.assistant.streaming .cursor {
    display: inline;
    animation: blink 1s steps(1) infinite;
    color: var(--accent-text);
    margin-left: 1px;
  }
  .msg.assistant.streaming.empty-content .thinking {
    display: inline;
    color: var(--muted);
    font-style: italic;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .msg.assistant.streaming .cursor { animation: none; }
  }
  .msg-state { font-size: 0.8rem; color: var(--muted); }
  .msg.streaming .msg-state { color: var(--accent-text); }
  .msg.stopped .msg-state { color: var(--warn); }
  .msg.error .msg-state { color: var(--danger); font-weight: 600; }
  .msg.error .bubble { border: 1px solid var(--danger); }

  footer {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .prompt-label { font-size: 0.85rem; font-weight: 600; }
  #prompt {
    width: 100%;
    min-height: 60px;
    max-height: 200px;
    resize: vertical;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--control-border);
    border-radius: 10px;
  }
  #prompt::placeholder { color: var(--muted); opacity: 1; }
  #prompt:focus-visible, #prompt:focus {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .controls { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
  .hint { margin-right: auto; font-size: 0.8rem; color: var(--muted); }
  button {
    font: inherit;
    min-height: 40px;
    min-width: 44px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--control-border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f0f2f5; }
  button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  #send { background: var(--accent); border-color: var(--accent); color: #fff; }
  #send:hover:not(:disabled) { background: #2559c4; }
  #stop { border-color: var(--danger); color: var(--danger); }
  #stop:hover:not(:disabled) { background: #fdecea; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  @media (forced-colors: active) {
    .msg .bubble { border: 1px solid CanvasText; }
    button:disabled { opacity: 1; color: GrayText; border-color: GrayText; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat Assistant</h1>
    <div id="status" role="status" aria-live="polite" aria-atomic="true">Ready</div>
  </header>

  <!-- Scrollable conversation history; focusable so keyboard users can scroll it. -->
  <main id="conversation" tabindex="0" aria-label="Conversation history">
    <p class="empty">Start the conversation by typing a message below.</p>
  </main>

  <footer>
    <label for="prompt" class="prompt-label">Message</label>
    <textarea id="prompt" placeholder="Type your message…" autocomplete="off"
              aria-describedby="prompt-hint"></textarea>
    <div class="controls">
      <span class="hint" id="prompt-hint">Enter to send · Shift+Enter for a new line · Escape to stop generating</span>
      <button id="regenerate" type="button" disabled>Regenerate</button>
      <button id="stop" type="button" disabled aria-keyshortcuts="Escape">Stop</button>
      <button id="send" type="button" disabled>Send</button>
    </div>
  </footer>

  <!-- Screen-reader-only announcements -->
  <div id="sr-answer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="sr-alert" class="sr-only" role="alert" aria-atomic="true"></div>
</div>

<script>
(function () {
  'use strict';

  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var regenBtn = document.getElementById('regenerate');
  var convoEl = document.getElementById('conversation');
  var statusEl = document.getElementById('status');
  var srAnswer = document.getElementById('sr-answer');
  var srAlert = document.getElementById('sr-alert');

  // Conversation state. Each item: { role, content, state, el }
  // state for assistant: 'streaming' | 'done' | 'stopped' | 'error'
  var messages = [];
  var msgCounter = 0;

  // The currently active request, or null. Callbacks check identity against this
  // so late/stray callbacks (e.g. an in-flight onToken after abort) are ignored.
  var current = null;

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  // Re-set text after a tick so repeated identical messages are still announced.
  var answerTimer = null;
  function announceAnswer(text) {
    srAnswer.textContent = '';
    if (answerTimer) clearTimeout(answerTimer);
    answerTimer = setTimeout(function () { srAnswer.textContent = text; }, 100);
  }
  var alertTimer = null;
  function announceAlert(text) {
    srAlert.textContent = '';
    if (alertTimer) clearTimeout(alertTimer);
    alertTimer = setTimeout(function () { srAlert.textContent = text; }, 100);
  }

  function isNearBottom() {
    return convoEl.scrollHeight - convoEl.scrollTop - convoEl.clientHeight < 80;
  }

  function scrollToBottom() {
    convoEl.scrollTop = convoEl.scrollHeight;
  }

  function stateLabel(msg) {
    if (msg.role !== 'assistant') return '';
    switch (msg.state) {
      case 'streaming': return 'Generating…';
      case 'stopped':   return 'Stopped' + (msg.content ? ' — partial answer' : ' — no content received');
      case 'error':     return 'Error: ' + (msg.errorText || 'Unknown error');
      default:          return '';
    }
  }

  function createMessageEl(msg) {
    var id = 'msg-' + (++msgCounter);
    var wrap = document.createElement('article');
    var role = document.createElement('h2');
    role.className = 'role';
    role.id = id + '-role';
    role.textContent = msg.role === 'user' ? 'You' : 'Assistant';
    wrap.setAttribute('aria-labelledby', role.id);

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var textSpan = document.createElement('span');
    textSpan.className = 'text';
    var thinking = document.createElement('span');
    thinking.className = 'thinking';
    thinking.textContent = 'Thinking…';
    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.setAttribute('aria-hidden', 'true');
    cursor.textContent = '▍';
    bubble.appendChild(textSpan);
    bubble.appendChild(thinking);
    bubble.appendChild(cursor);

    var st = document.createElement('p');
    st.className = 'msg-state';
    st.style.margin = '0';

    wrap.appendChild(role);
    wrap.appendChild(bubble);
    wrap.appendChild(st);
    msg.el = wrap;
    msg.textEl = textSpan;
    msg.stateEl = st;
    updateMessageEl(msg);
    return wrap;
  }

  function updateMessageEl(msg) {
    if (!msg.el) return;
    msg.el.className = 'msg ' + msg.role +
      (msg.state ? ' ' + msg.state : '') +
      (msg.content === '' ? ' empty-content' : '');
    if (msg.state === 'streaming') msg.el.setAttribute('aria-busy', 'true');
    else msg.el.removeAttribute('aria-busy');
    // textContent only — never interpret streamed content as HTML.
    msg.textEl.textContent = msg.content;
    var label = stateLabel(msg);
    msg.stateEl.textContent = label;
    msg.stateEl.style.display = label ? '' : 'none';
  }

  function renderAll() {
    convoEl.textContent = '';
    if (messages.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = 'Start the conversation by typing a message below.';
      convoEl.appendChild(empty);
      return;
    }
    for (var i = 0; i < messages.length; i++) {
      convoEl.appendChild(createMessageEl(messages[i]));
    }
    scrollToBottom();
  }

  function appendMessage(msg) {
    if (messages.length === 1) convoEl.textContent = ''; // remove empty placeholder
    convoEl.appendChild(createMessageEl(msg));
    scrollToBottom();
  }

  function lastUserIndex() {
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') return i;
    }
    return -1;
  }

  function updateControls() {
    var focused = document.activeElement;
    var busy = current !== null;
    sendBtn.disabled = busy || promptEl.value.trim() === '';
    stopBtn.disabled = !busy;
    regenBtn.disabled = busy || lastUserIndex() === -1;
    convoEl.setAttribute('aria-busy', busy ? 'true' : 'false');
    // If the focused button just became disabled, keep keyboard focus in a sensible place
    // instead of letting it fall back to <body>.
    if (focused && focused.tagName === 'BUTTON' && focused.disabled) {
      if (focused === sendBtn || focused === regenBtn) {
        if (busy) stopBtn.focus();
        else promptEl.focus();
      } else {
        promptEl.focus();
      }
    }
  }

  function buildHistory() {
    // Plain copies; skip failed or empty assistant answers.
    var out = [];
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      if (m.role === 'assistant' && (m.state === 'error' || m.state === 'streaming' || m.content === '')) continue;
      out.push({ role: m.role, content: m.content });
    }
    return out;
  }

  function errorToText(err) {
    if (err == null) return 'Unknown error';
    if (typeof err === 'string') return err;
    if (err && typeof err.message === 'string' && err.message) return err.message;
    try { return String(err); } catch (e) { return 'Unknown error'; }
  }

  function startGeneration() {
    var history = buildHistory();
    var msg = { role: 'assistant', content: '', state: 'streaming', el: null };
    messages.push(msg);
    appendMessage(msg);

    var req = { msg: msg, handle: null, finished: false };
    current = req;
    setStatus('Generating…', 'generating');
    updateControls();

    function isLive() { return current === req && !req.finished; }

    function finish(state, errText) {
      req.finished = true;
      if (current === req) current = null;
      msg.state = state;
      if (errText) msg.errorText = errText;
      updateMessageEl(msg);
      updateControls();
    }

    var callbacks = {
      onToken: function (text) {
        if (!isLive()) return; // ignore tokens arriving after stop/finish
        if (text == null) return;
        var stick = isNearBottom();
        msg.content += String(text);
        updateMessageEl(msg);
        if (stick) scrollToBottom();
      },
      onDone: function () {
        if (!isLive()) return;
        finish('done');
        setStatus('Finished', 'done');
        announceAnswer('Assistant answer: ' + (msg.content || '(empty answer)'));
      },
      onError: function (error) {
        if (!isLive()) return;
        var t = errorToText(error);
        finish('error', t);
        setStatus('Error: ' + t, 'error');
        announceAlert('Error: ' + t);
      }
    };

    try {
      if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
        throw new Error('Chat service is unavailable.');
      }
      var handle = window.ChatSDK.streamChat(history, callbacks);
      req.handle = handle;
      // If the user hit Stop synchronously during the call (unlikely) abort now.
      if (req.finished && req.stoppedByUser && handle && typeof handle.abort === 'function') {
        try { handle.abort(); } catch (e) { /* ignore */ }
      }
    } catch (e) {
      if (isLive()) {
        var t = errorToText(e);
        finish('error', t);
        setStatus('Error: ' + t, 'error');
        announceAlert('Error: ' + t);
      }
    }
  }

  function stopGeneration() {
    var req = current;
    if (!req) return;
    req.finished = true;
    req.stoppedByUser = true;
    current = null;
    req.msg.state = 'stopped';
    updateMessageEl(req.msg);
    if (req.handle && typeof req.handle.abort === 'function') {
      try { req.handle.abort(); } catch (e) { /* ignore */ }
    }
    setStatus('Stopped', 'stopped');
    announceAnswer(req.msg.content
      ? 'Partial assistant answer: ' + req.msg.content
      : 'No answer content was received.');
    updateControls();
    promptEl.focus();
  }

  function sendMessage() {
    if (current) {
      announceAnswer('The assistant is still generating. Press Escape or the Stop button to stop it first.');
      return;
    }
    var text = promptEl.value;
    if (text.trim() === '') return;
    var userMsg = { role: 'user', content: text, state: null, el: null };
    messages.push(userMsg);
    appendMessage(userMsg);
    promptEl.value = '';
    startGeneration();
    promptEl.focus();
  }

  function regenerate() {
    if (current) stopGeneration();
    var idx = lastUserIndex();
    if (idx === -1) return;
    // Drop everything after the last user message and ask again.
    messages.splice(idx + 1);
    renderAll();
    startGeneration();
  }

  sendBtn.addEventListener('click', sendMessage);
  stopBtn.addEventListener('click', stopGeneration);
  regenBtn.addEventListener('click', regenerate);
  promptEl.addEventListener('input', updateControls);
  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && current && !e.isComposing) {
      e.preventDefault();
      stopGeneration();
    }
  });

  if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
    setStatus('Error: chat service unavailable', 'error');
  } else {
    setStatus('Ready', '');
  }
  updateControls();
  promptEl.focus();
})();
</script>
</body>
</html>
