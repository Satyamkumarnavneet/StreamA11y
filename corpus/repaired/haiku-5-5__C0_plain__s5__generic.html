<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Assistant</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #5b6370;
    --border: #cfd5df;
    --user: #1d4ed8;
    --user-text: #ffffff;
    --assistant: #ffffff;
    --accent: #1d4ed8;
    --accent-hover: #1e40af;
    --ok: #15803d;
    --warn: #92400e;
    --err: #b91c1c;
    --focus: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 820px;
    margin: 0 auto;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }

  .status {
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--muted);
    color: var(--muted);
    white-space: nowrap;
  }
  .status.generating { color: var(--accent); border-color: var(--accent); }
  .status.stopped    { color: var(--warn);   border-color: var(--warn); }
  .status.finished   { color: var(--ok);     border-color: var(--ok); }
  .status.error      { color: var(--err);    border-color: var(--err); }

  /* Visually hidden but available to assistive technology */
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #conversation:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
  }
  .empty-hint { color: var(--muted); text-align: center; margin-top: 40px; }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--assistant);
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    color: var(--user-text);
    border-color: var(--user);
  }
  .msg.assistant { align-self: flex-start; }
  .label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .msg.user .label { color: #ffffff; }
  .msg.assistant .label { color: var(--muted); }
  .body {
    white-space: pre-wrap;
    overflow-wrap: break-word;
    line-height: 1.45;
  }
  /* Visual typing indicator while waiting for the first token.
     Screen reader users get the state from aria-busy and the status message. */
  .msg.pending .body:empty::after {
    content: "\2026";
    color: var(--muted);
  }
  .note {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .note.stopped  { color: var(--warn); }
  .note.error    { color: var(--err); }
  .note.finished { color: var(--ok); }
  .msg.user .note { color: #ffffff; }

  form#composer {
    border-top: 1px solid var(--border);
    padding: 12px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .field-label {
    font-size: 14px;
    font-weight: 600;
  }
  textarea#prompt {
    width: 100%;
    resize: vertical;
    min-height: 64px;
    max-height: 240px;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid #6b7280;
    border-radius: 8px;
  }
  textarea#prompt::placeholder { color: var(--muted); opacity: 1; }
  .hint {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  textarea#prompt:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .controls {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    min-height: 40px;
    min-width: 44px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #6b7280;
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not([aria-disabled="true"]) { background: #eef2f7; }
  button[aria-disabled="true"] {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button#send {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button#send:hover:not([aria-disabled="true"]) { background: var(--accent-hover); }
  button#stop { border-color: var(--warn); color: var(--warn); }
  button#stop:hover:not([aria-disabled="true"]) { background: #fdf3e7; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Chat Assistant</h1>
    <span id="status" class="status" role="status" aria-live="polite">Ready</span>
  </header>

  <!-- Assertive announcements for errors, kept separate from the polite status line -->
  <div id="alert" class="sr-only" role="alert"></div>

  <div id="conversation" role="log" aria-label="Conversation" aria-live="off" tabindex="0">
    <p class="empty-hint" id="empty-hint">Send a message to start the conversation.</p>
  </div>

  <form id="composer" autocomplete="off">
    <label for="prompt" class="field-label">Message</label>
    <textarea id="prompt" rows="3" aria-describedby="prompt-hint"
              placeholder="Type a message…"></textarea>
    <p id="prompt-hint" class="hint">Press Enter to send, Shift+Enter for a new line. Press Escape to stop a streaming answer.</p>
    <div class="controls">
      <button type="button" id="regenerate" aria-disabled="true">Regenerate</button>
      <button type="button" id="stop" aria-disabled="true">Stop</button>
      <button type="submit" id="send" aria-disabled="false">Send</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const conv = $('conversation');
  const emptyHint = $('empty-hint');
  const promptEl = $('prompt');
  const composer = $('composer');
  const sendBtn = $('send');
  const stopBtn = $('stop');
  const regenBtn = $('regenerate');
  const statusEl = $('status');
  const alertEl = $('alert');

  // Conversation model. Each entry: { role, content, note?, noteKind?, wrap?, body?, noteEl?, id? }
  const history = [];
  let entryCounter = 0;

  // The stream currently in progress, or null.
  let run = null;

  // ---------- Helpers ----------

  function setStatus(kind, text) {
    statusEl.className = 'status ' + kind;
    statusEl.textContent = text;
  }

  // Assertive announcement for errors. Clear first so repeated identical errors are re-announced.
  function announceError(text) {
    alertEl.textContent = '';
    setTimeout(() => { alertEl.textContent = text; }, 50);
  }

  function describeError(err) {
    if (err && typeof err === 'object' && err.message) return String(err.message);
    if (err) return String(err);
    return 'Unknown error';
  }

  function scrollToEnd() {
    conv.scrollTop = conv.scrollHeight;
  }

  function setBusy(busy) {
    conv.setAttribute('aria-busy', busy ? 'true' : 'false');
  }

  // Use aria-disabled instead of the disabled attribute so focused buttons
  // do not drop focus when the state changes.
  function setDisabled(btn, disabled) {
    btn.setAttribute('aria-disabled', disabled ? 'true' : 'false');
  }

  function updateEmptyHint() {
    emptyHint.hidden = history.length > 0;
  }

  function appendEntry(entry) {
    entryCounter += 1;
    const labelId = 'msg-label-' + entryCounter;

    const wrap = document.createElement('article');
    wrap.className = 'msg ' + entry.role;
    wrap.setAttribute('aria-labelledby', labelId);

    const label = document.createElement('div');
    label.className = 'label';
    label.id = labelId;
    label.textContent = entry.role === 'user' ? 'You' : 'Assistant';

    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = entry.content;

    wrap.append(label, body);
    entry.wrap = wrap;
    entry.body = body;
    entry.noteEl = null;

    conv.appendChild(wrap);

    if (entry.note) setNote(entry, entry.note, entry.noteKind);
  }

  function setNote(entry, text, kind) {
    entry.note = text;
    entry.noteKind = kind;
    if (!entry.noteEl) {
      entry.noteEl = document.createElement('p');
      entry.noteEl.className = 'note';
      entry.wrap.appendChild(entry.noteEl);
    }
    entry.noteEl.className = 'note ' + kind;
    entry.noteEl.textContent = text;
  }

  function renderAll() {
    conv.textContent = '';
    conv.appendChild(emptyHint);
    for (const entry of history) appendEntry(entry);
    updateEmptyHint();
    scrollToEnd();
  }

  function updateControls() {
    const streaming = run !== null;
    const hasUser = history.some((m) => m.role === 'user');
    setDisabled(sendBtn, streaming);
    setDisabled(stopBtn, !streaming);
    setDisabled(regenBtn, streaming || !hasUser);
  }

  // Build the payload sent to the SDK: only role/content, skipping empty assistant
  // placeholders so the server never receives an empty assistant turn.
  function buildPayload(entries) {
    return entries
      .filter((m) => !(m.role === 'assistant' && m.content === ''))
      .map((m) => ({ role: m.role, content: m.content }));
  }

  // ---------- Streaming ----------

  function startStream() {
    if (run) return;

    if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
      const entry = { role: 'assistant', content: '' };
      history.push(entry);
      appendEntry(entry);
      const msg = 'The chat service is not available.';
      setNote(entry, msg, 'error');
      setStatus('error', 'Error: chat service unavailable');
      announceError('Error: chat service unavailable. ' + msg);
      updateControls();
      updateEmptyHint();
      scrollToEnd();
      return;
    }

    const entry = { role: 'assistant', content: '' };
    history.push(entry);

    const current = { entry: entry, handle: null, done: false };
    run = current;

    appendEntry(entry);
    entry.wrap.classList.add('pending');
    updateEmptyHint();
    setBusy(true);
    setStatus('generating', 'Generating…');
    updateControls();
    scrollToEnd();

    // Everything except the new (empty) assistant entry is the request context.
    const messages = buildPayload(history.slice(0, -1));

    const callbacks = {
      onToken(text) {
        if (run !== current || current.done) return; // ignore late chunks after stop/finish
        entry.content += String(text);
        entry.wrap.classList.remove('pending');
        entry.body.textContent = entry.content;
        scrollToEnd();
      },
      onDone() {
        if (run !== current || current.done) return;
        finish(current, 'finished');
      },
      onError(err) {
        if (run !== current || current.done) return;
        finish(current, 'error', err);
      }
    };

    try {
      current.handle = window.ChatSDK.streamChat(messages, callbacks);
    } catch (err) {
      if (run === current && !current.done) finish(current, 'error', err);
    }
  }

  function finish(current, state, err) {
    if (current.done) return;
    current.done = true;
    if (run === current) run = null;

    const entry = current.entry;
    entry.wrap.classList.remove('pending');
    entry.body.textContent = entry.content;
    setBusy(false);

    if (state === 'finished') {
      setNote(entry, 'Finished', 'finished');
      setStatus('finished', 'Finished');
    } else {
      const msg = describeError(err);
      setNote(entry, 'Error: ' + msg, 'error');
      setStatus('error', 'Error: ' + msg);
      announceError('Error: ' + msg);
    }

    updateControls();
    scrollToEnd();
  }

  function stop() {
    if (!run) return;
    const current = run;
    // Mark done first so late onToken/onDone/onError calls are ignored.
    current.done = true;
    run = null;
    try {
      if (current.handle && typeof current.handle.abort === 'function') {
        current.handle.abort();
      }
    } catch (e) {
      // Abort failures should not block the UI; the partial answer is kept.
    }
    const entry = current.entry;
    entry.wrap.classList.remove('pending');
    entry.body.textContent = entry.content;
    setBusy(false);
    setNote(entry, 'Stopped', 'stopped');
    setStatus('stopped', 'Stopped');
    updateControls();
    scrollToEnd();
  }

  // ---------- Actions ----------

  function send() {
    if (run) return;
    const text = promptEl.value.trim();
    if (!text) return;

    history.push({ role: 'user', content: text });
    promptEl.value = '';

    const userEntry = history[history.length - 1];
    appendEntry(userEntry);
    updateEmptyHint();
    startStream();
  }

  function regenerate() {
    if (run) return;

    let lastUser = -1;
    for (let i = history.length - 1; i >= 0; i--) {
      if (history[i].role === 'user') { lastUser = i; break; }
    }
    if (lastUser < 0) return;

    // Drop everything after the last user message (the previous answer, if any).
    history.length = lastUser + 1;
    renderAll();
    startStream();
  }

  // ---------- Wiring ----------

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    send();
  });

  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  // Escape stops a streaming answer from anywhere on the page.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && run) {
      e.preventDefault();
      stop();
    }
  });

  stopBtn.addEventListener('click', stop);
  regenBtn.addEventListener('click', regenerate);

  updateControls();
  updateEmptyHint();
})();
</script>
</body>
</html>
