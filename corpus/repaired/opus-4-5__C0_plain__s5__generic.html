<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            padding: 16px 20px;
            background-color: #1e40af;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-role {
            font-size: 12px;
            color: #4b5563;
            margin-bottom: 4px;
            text-transform: capitalize;
            font-weight: 500;
        }

        .message.user .message-role {
            text-align: right;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background-color: #1e40af;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .status-indicator {
            padding: 8px 16px;
            text-align: center;
            font-size: 14px;
            color: #4b5563;
            display: none;
        }

        .status-indicator.visible {
            display: block;
        }

        .status-indicator.generating {
            color: #1e40af;
        }

        .status-indicator.stopped {
            color: #b45309;
        }

        .status-indicator.finished {
            color: #047857;
        }

        .status-indicator.error {
            color: #b91c1c;
        }

        .input-container {
            padding: 16px 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        #prompt {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #6b7280;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            font-family: inherit;
            min-height: 48px;
            max-height: 120px;
        }

        #prompt:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.3);
        }

        .button-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:focus {
            outline: 3px solid #1e40af;
            outline-offset: 2px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #send {
            background-color: #1e40af;
            color: white;
        }

        #send:hover:not(:disabled) {
            background-color: #1e3a8a;
        }

        #stop {
            background-color: #b45309;
            color: white;
        }

        #stop:hover:not(:disabled) {
            background-color: #92400e;
        }

        #regenerate {
            background-color: #4b5563;
            color: white;
        }

        #regenerate:hover:not(:disabled) {
            background-color: #374151;
        }

        .typing-indicator {
            display: inline-block;
        }

        .typing-indicator::after {
            content: '▋';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .typing-indicator::after {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1 style="font-size: inherit; font-weight: inherit; margin: 0;">Chat Assistant</h1>
        </header>
        
        <main class="messages-container" id="messages" role="log" aria-live="polite" aria-label="Conversation history"></main>
        
        <div class="status-indicator" id="status" role="status" aria-live="polite" aria-atomic="true"></div>
        
        <form class="input-container" id="chat-form" aria-label="Send a message">
            <div class="input-row">
                <label for="prompt" class="visually-hidden">Your message</label>
                <textarea id="prompt" placeholder="Type your message..." rows="1" aria-describedby="prompt-hint"></textarea>
                <span id="prompt-hint" class="visually-hidden">Press Enter to send, Shift+Enter for new line</span>
            </div>
            <div class="button-row">
                <button type="button" id="regenerate" disabled aria-disabled="true">Regenerate</button>
                <button type="button" id="stop" disabled aria-disabled="true">Stop</button>
                <button type="submit" id="send">Send</button>
            </div>
        </form>
    </div>

    <script>
        (function() {
            const messagesContainer = document.getElementById('messages');
            const promptInput = document.getElementById('prompt');
            const sendButton = document.getElementById('send');
            const stopButton = document.getElementById('stop');
            const regenerateButton = document.getElementById('regenerate');
            const statusIndicator = document.getElementById('status');
            const chatForm = document.getElementById('chat-form');

            let conversationHistory = [];
            let currentHandle = null;
            let isStreaming = false;
            let currentAssistantMessageEl = null;
            let currentAssistantContent = '';

            function setStatus(text, type) {
                statusIndicator.textContent = text;
                statusIndicator.className = 'status-indicator';
                if (text) {
                    statusIndicator.classList.add('visible', type);
                }
            }

            function clearStatus() {
                statusIndicator.className = 'status-indicator';
                statusIndicator.textContent = '';
            }

            function updateButtonStates() {
                const sendDisabled = isStreaming || !promptInput.value.trim();
                const stopDisabled = !isStreaming;
                const regenerateDisabled = isStreaming || conversationHistory.length === 0 || conversationHistory[conversationHistory.length - 1].role !== 'assistant';

                sendButton.disabled = sendDisabled;
                sendButton.setAttribute('aria-disabled', sendDisabled);
                
                stopButton.disabled = stopDisabled;
                stopButton.setAttribute('aria-disabled', stopDisabled);
                
                regenerateButton.disabled = regenerateDisabled;
                regenerateButton.setAttribute('aria-disabled', regenerateDisabled);
            }

            function createMessageElement(role, content) {
                const messageDiv = document.createElement('article');
                messageDiv.className = `message ${role}`;
                messageDiv.setAttribute('aria-label', `${role === 'user' ? 'You' : 'Assistant'} said`);

                const roleLabel = document.createElement('div');
                roleLabel.className = 'message-role';
                roleLabel.setAttribute('aria-hidden', 'true');
                roleLabel.textContent = role === 'user' ? 'You' : 'Assistant';

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;

                messageDiv.appendChild(roleLabel);
                messageDiv.appendChild(contentDiv);

                return messageDiv;
            }

            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function addUserMessage(content) {
                const messageEl = createMessageElement('user', content);
                messagesContainer.appendChild(messageEl);
                conversationHistory.push({ role: 'user', content });
                scrollToBottom();
            }

            function startAssistantMessage() {
                currentAssistantContent = '';
                currentAssistantMessageEl = createMessageElement('assistant', '');
                const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                contentEl.innerHTML = '<span class="typing-indicator" aria-hidden="true"></span>';
                messagesContainer.appendChild(currentAssistantMessageEl);
                scrollToBottom();
            }

            function updateAssistantMessage(text) {
                currentAssistantContent += text;
                if (currentAssistantMessageEl) {
                    const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                    contentEl.innerHTML = escapeHtml(currentAssistantContent) + '<span class="typing-indicator" aria-hidden="true"></span>';
                    scrollToBottom();
                }
            }

            function finalizeAssistantMessage() {
                if (currentAssistantMessageEl) {
                    const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                    contentEl.textContent = currentAssistantContent || '(empty response)';
                }
                if (currentAssistantContent) {
                    conversationHistory.push({ role: 'assistant', content: currentAssistantContent });
                }
                currentAssistantMessageEl = null;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function streamChat(messages) {
                isStreaming = true;
                updateButtonStates();
                setStatus('Generating...', 'generating');
                startAssistantMessage();

                currentHandle = window.ChatSDK.streamChat(messages, {
                    onToken: function(text) {
                        updateAssistantMessage(text);
                    },
                    onDone: function() {
                        isStreaming = false;
                        currentHandle = null;
                        finalizeAssistantMessage();
                        setStatus('Finished', 'finished');
                        updateButtonStates();
                        promptInput.focus();
                        setTimeout(clearStatus, 2000);
                    },
                    onError: function(error) {
                        isStreaming = false;
                        currentHandle = null;
                        finalizeAssistantMessage();
                        setStatus('Error: ' + (error.message || error), 'error');
                        updateButtonStates();
                        promptInput.focus();
                    }
                });
            }

            function sendMessage() {
                const content = promptInput.value.trim();
                if (!content || isStreaming) return;

                promptInput.value = '';
                addUserMessage(content);
                updateButtonStates();

                streamChat([...conversationHistory]);
            }

            function stopGeneration() {
                if (currentHandle && isStreaming) {
                    currentHandle.abort();
                    isStreaming = false;
                    currentHandle = null;
                    finalizeAssistantMessage();
                    setStatus('Stopped', 'stopped');
                    updateButtonStates();
                    promptInput.focus();
                    setTimeout(clearStatus, 2000);
                }
            }

            function regenerate() {
                if (isStreaming || conversationHistory.length === 0) return;

                // Remove the last assistant message from history and DOM
                if (conversationHistory[conversationHistory.length - 1].role === 'assistant') {
                    conversationHistory.pop();
                    const lastMessageEl = messagesContainer.querySelector('.message.assistant:last-child');
                    if (lastMessageEl) {
                        lastMessageEl.remove();
                    }
                }

                // If there's still a user message, regenerate from it
                if (conversationHistory.length > 0 && conversationHistory[conversationHistory.length - 1].role === 'user') {
                    streamChat([...conversationHistory]);
                }
            }

            // Event listeners
            chatForm.addEventListener('submit', function(e) {
                e.preventDefault();
                sendMessage();
            });

            stopButton.addEventListener('click', stopGeneration);
            regenerateButton.addEventListener('click', regenerate);

            promptInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            promptInput.addEventListener('input', function() {
                updateButtonStates();
                // Auto-resize textarea
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            // Initial state
            updateButtonStates();
        })();
    </script>
</body>
</html>
