<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            padding: 16px 20px;
            background-color: #2563eb;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .message.assistant.streaming {
            position: relative;
        }

        .message.assistant.streaming::after {
            content: '▊';
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .status-indicator {
            padding: 8px 16px;
            text-align: center;
            font-size: 14px;
            color: #4b5563;
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .status-indicator.generating {
            color: #1d4ed8;
        }

        .status-indicator.stopped {
            color: #b45309;
        }

        .status-indicator.finished {
            color: #047857;
        }

        .status-indicator.error {
            color: #dc2626;
        }

        .status-indicator:empty {
            display: none;
        }

        .chat-input-area {
            padding: 16px 20px;
            background-color: #fff;
            border-top: 1px solid #e9ecef;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        #prompt {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #9ca3af;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #prompt:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
        }

        .button-row {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.5);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #send {
            background-color: #2563eb;
            color: white;
            flex: 1;
        }

        #send:hover:not(:disabled) {
            background-color: #1d4ed8;
        }

        #stop {
            background-color: #d97706;
            color: white;
        }

        #stop:hover:not(:disabled) {
            background-color: #b45309;
        }

        #regenerate {
            background-color: #4b5563;
            color: white;
        }

        #regenerate:hover:not(:disabled) {
            background-color: #374151;
        }

        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 16px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .message-prefix {
            font-weight: 600;
            display: inline;
        }

        .message-prefix.visually-hidden-prefix {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1 style="font-size: inherit; font-weight: inherit; margin: 0;">Chat Assistant</h1>
        </header>
        <main class="chat-messages" id="messages" role="log" aria-live="polite" aria-label="Conversation history">
            <p class="empty-state" id="emptyState">Start a conversation by typing a message below</p>
        </main>
        <div class="status-indicator" id="status" role="status" aria-live="polite" aria-atomic="true"></div>
        <form class="chat-input-area" id="chatForm" aria-label="Message input">
            <div class="input-row">
                <label for="prompt" class="visually-hidden">Type your message</label>
                <textarea id="prompt" rows="2" placeholder="Type your message..." aria-describedby="promptHint"></textarea>
                <span id="promptHint" class="visually-hidden">Press Enter to send, Shift+Enter for new line</span>
            </div>
            <div class="button-row">
                <button type="submit" id="send">Send</button>
                <button type="button" id="stop" disabled aria-disabled="true">Stop</button>
                <button type="button" id="regenerate" disabled aria-disabled="true">Regenerate</button>
            </div>
        </form>
    </div>

    <script>
        (function() {
            const messagesContainer = document.getElementById('messages');
            const emptyState = document.getElementById('emptyState');
            const statusIndicator = document.getElementById('status');
            const promptInput = document.getElementById('prompt');
            const sendButton = document.getElementById('send');
            const stopButton = document.getElementById('stop');
            const regenerateButton = document.getElementById('regenerate');
            const chatForm = document.getElementById('chatForm');

            let conversationHistory = [];
            let currentHandle = null;
            let isStreaming = false;
            let currentAssistantMessage = null;

            function setStatus(text, type) {
                statusIndicator.textContent = text;
                statusIndicator.className = 'status-indicator';
                if (type) {
                    statusIndicator.classList.add(type);
                }
            }

            function clearStatus() {
                statusIndicator.textContent = '';
                statusIndicator.className = 'status-indicator';
            }

            function updateButtonStates() {
                const hasHistory = conversationHistory.length > 0;
                const lastIsUser = hasHistory && conversationHistory[conversationHistory.length - 1].role === 'user';
                
                sendButton.disabled = isStreaming;
                sendButton.setAttribute('aria-disabled', isStreaming);
                
                stopButton.disabled = !isStreaming;
                stopButton.setAttribute('aria-disabled', !isStreaming);
                
                const regenerateDisabled = isStreaming || !hasHistory || lastIsUser;
                regenerateButton.disabled = regenerateDisabled;
                regenerateButton.setAttribute('aria-disabled', regenerateDisabled);
            }

            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function addMessageElement(role, content) {
                if (emptyState.parentNode) {
                    emptyState.remove();
                }

                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}`;
                messageDiv.setAttribute('role', 'article');
                
                const roleLabel = role === 'user' ? 'You' : 'Assistant';
                messageDiv.setAttribute('aria-label', `${roleLabel} says`);

                const prefix = document.createElement('span');
                prefix.className = 'message-prefix visually-hidden-prefix';
                prefix.textContent = `${roleLabel}: `;
                messageDiv.appendChild(prefix);

                const contentSpan = document.createElement('span');
                contentSpan.className = 'message-content';
                contentSpan.textContent = content;
                messageDiv.appendChild(contentSpan);

                messagesContainer.appendChild(messageDiv);
                scrollToBottom();
                return messageDiv;
            }

            function startStream(messages) {
                isStreaming = true;
                updateButtonStates();
                setStatus('Generating...', 'generating');

                currentAssistantMessage = addMessageElement('assistant', '');
                currentAssistantMessage.classList.add('streaming');

                let accumulatedContent = '';
                const contentSpan = currentAssistantMessage.querySelector('.message-content');

                currentHandle = window.ChatSDK.streamChat(messages, {
                    onToken: function(text) {
                        accumulatedContent += text;
                        contentSpan.textContent = accumulatedContent;
                        scrollToBottom();
                    },
                    onDone: function() {
                        isStreaming = false;
                        currentHandle = null;
                        currentAssistantMessage.classList.remove('streaming');
                        
                        conversationHistory.push({
                            role: 'assistant',
                            content: accumulatedContent
                        });

                        setStatus('Finished', 'finished');
                        setTimeout(clearStatus, 2000);
                        updateButtonStates();
                        currentAssistantMessage = null;
                    },
                    onError: function(error) {
                        isStreaming = false;
                        currentHandle = null;
                        currentAssistantMessage.classList.remove('streaming');

                        if (accumulatedContent) {
                            conversationHistory.push({
                                role: 'assistant',
                                content: accumulatedContent
                            });
                        } else {
                            currentAssistantMessage.remove();
                        }

                        setStatus('Error: ' + (error.message || 'Something went wrong'), 'error');
                        updateButtonStates();
                        currentAssistantMessage = null;
                    }
                });
            }

            function sendMessage() {
                const content = promptInput.value.trim();
                if (!content || isStreaming) return;

                promptInput.value = '';
                
                conversationHistory.push({
                    role: 'user',
                    content: content
                });

                addMessageElement('user', content);
                startStream([...conversationHistory]);
            }

            function stopGeneration() {
                if (currentHandle && isStreaming) {
                    currentHandle.abort();
                    isStreaming = false;
                    currentHandle = null;

                    if (currentAssistantMessage) {
                        currentAssistantMessage.classList.remove('streaming');
                        const contentSpan = currentAssistantMessage.querySelector('.message-content');
                        const partialContent = contentSpan ? contentSpan.textContent : '';
                        
                        if (partialContent) {
                            conversationHistory.push({
                                role: 'assistant',
                                content: partialContent
                            });
                        } else {
                            currentAssistantMessage.remove();
                        }
                        currentAssistantMessage = null;
                    }

                    setStatus('Stopped', 'stopped');
                    setTimeout(clearStatus, 2000);
                    updateButtonStates();
                }
            }

            function regenerate() {
                if (isStreaming || conversationHistory.length === 0) return;

                // Remove the last assistant message if it exists
                if (conversationHistory[conversationHistory.length - 1].role === 'assistant') {
                    conversationHistory.pop();
                    
                    // Remove from DOM
                    const messages = messagesContainer.querySelectorAll('.message.assistant');
                    if (messages.length > 0) {
                        messages[messages.length - 1].remove();
                    }
                }

                // Now regenerate based on the conversation up to and including the last user message
                if (conversationHistory.length > 0 && conversationHistory[conversationHistory.length - 1].role === 'user') {
                    startStream([...conversationHistory]);
                }
            }

            chatForm.addEventListener('submit', function(e) {
                e.preventDefault();
                sendMessage();
            });

            stopButton.addEventListener('click', stopGeneration);
            regenerateButton.addEventListener('click', regenerate);

            promptInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            updateButtonStates();
        })();
    </script>
</body>
</html>
