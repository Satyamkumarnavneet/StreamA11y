<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            padding: 16px 20px;
            background-color: #2563eb;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-role {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            text-transform: capitalize;
        }

        .message.user .message-role {
            text-align: right;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background-color: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .status-indicator {
            padding: 8px 16px;
            text-align: center;
            font-size: 14px;
            color: #666;
            display: none;
        }

        .status-indicator.visible {
            display: block;
        }

        .status-indicator.generating {
            color: #2563eb;
        }

        .status-indicator.stopped {
            color: #f59e0b;
        }

        .status-indicator.finished {
            color: #10b981;
        }

        .status-indicator.error {
            color: #ef4444;
        }

        .input-container {
            padding: 16px 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        #prompt {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            font-family: inherit;
            min-height: 48px;
            max-height: 120px;
        }

        #prompt:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .button-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #send {
            background-color: #2563eb;
            color: white;
        }

        #send:hover:not(:disabled) {
            background-color: #1d4ed8;
        }

        #stop {
            background-color: #f59e0b;
            color: white;
        }

        #stop:hover:not(:disabled) {
            background-color: #d97706;
        }

        #regenerate {
            background-color: #6b7280;
            color: white;
        }

        #regenerate:hover:not(:disabled) {
            background-color: #4b5563;
        }

        .typing-indicator {
            display: inline-block;
        }

        .typing-indicator::after {
            content: '▋';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Chat Assistant</div>
        
        <div class="messages-container" id="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
        
        <div class="status-indicator" id="status" aria-live="assertive" aria-atomic="true"></div>
        <div id="sr-announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
        
        <div class="input-container">
            <div class="input-row">
                <textarea id="prompt" placeholder="Type your message..." rows="1" aria-label="Message input"></textarea>
            </div>
            <div class="button-row">
                <button id="regenerate" disabled aria-describedby="regenerate-desc">Regenerate</button>
                <span id="regenerate-desc" class="sr-only">Generate a new response to the last message</span>
                <button id="stop" disabled aria-describedby="stop-desc">Stop</button>
                <span id="stop-desc" class="sr-only">Stop the current response generation</span>
                <button id="send" aria-describedby="send-desc">Send</button>
                <span id="send-desc" class="sr-only">Send your message</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const messagesContainer = document.getElementById('messages');
            const promptInput = document.getElementById('prompt');
            const sendButton = document.getElementById('send');
            const stopButton = document.getElementById('stop');
            const regenerateButton = document.getElementById('regenerate');
            const statusIndicator = document.getElementById('status');
            const srAnnouncer = document.getElementById('sr-announcer');

            let conversationHistory = [];
            let currentHandle = null;
            let isStreaming = false;
            let isAborted = false;
            let currentAssistantMessageEl = null;
            let currentAssistantContent = '';

            function announce(message) {
                // Clear and re-set to ensure screen readers pick up repeated announcements
                srAnnouncer.textContent = '';
                // Use setTimeout to ensure the DOM change is registered
                setTimeout(function() {
                    srAnnouncer.textContent = message;
                }, 50);
            }

            function setStatus(text, type) {
                statusIndicator.textContent = text;
                statusIndicator.className = 'status-indicator';
                if (text) {
                    statusIndicator.classList.add('visible', type);
                }
            }

            function clearStatus() {
                statusIndicator.className = 'status-indicator';
                statusIndicator.textContent = '';
            }

            function manageFocus() {
                // Move focus to prompt input when buttons become disabled
                // This prevents focus from being lost to the body
                promptInput.focus();
            }

            function updateButtonStates() {
                const hadFocusOnSend = document.activeElement === sendButton;
                const hadFocusOnStop = document.activeElement === stopButton;
                const hadFocusOnRegenerate = document.activeElement === regenerateButton;

                const sendWasEnabled = !sendButton.disabled;
                const stopWasEnabled = !stopButton.disabled;
                const regenerateWasEnabled = !regenerateButton.disabled;

                sendButton.disabled = isStreaming || !promptInput.value.trim();
                stopButton.disabled = !isStreaming;
                regenerateButton.disabled = isStreaming || conversationHistory.length === 0 || conversationHistory[conversationHistory.length - 1].role !== 'assistant';

                // If a button that had focus is now disabled, move focus to prompt
                if ((hadFocusOnSend && sendButton.disabled && sendWasEnabled) ||
                    (hadFocusOnStop && stopButton.disabled && stopWasEnabled) ||
                    (hadFocusOnRegenerate && regenerateButton.disabled && regenerateWasEnabled)) {
                    manageFocus();
                }
            }

            function createMessageElement(role, content) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}`;

                const roleLabel = document.createElement('div');
                roleLabel.className = 'message-role';
                roleLabel.textContent = role === 'user' ? 'You' : 'Assistant';

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;

                messageDiv.appendChild(roleLabel);
                messageDiv.appendChild(contentDiv);

                return messageDiv;
            }

            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function addUserMessage(content) {
                const messageEl = createMessageElement('user', content);
                messagesContainer.appendChild(messageEl);
                conversationHistory.push({ role: 'user', content });
                scrollToBottom();
            }

            function startAssistantMessage() {
                currentAssistantContent = '';
                currentAssistantMessageEl = createMessageElement('assistant', '');
                const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                contentEl.innerHTML = '<span class="typing-indicator"></span>';
                messagesContainer.appendChild(currentAssistantMessageEl);
                scrollToBottom();
            }

            function updateAssistantMessage(text) {
                currentAssistantContent += text;
                if (currentAssistantMessageEl) {
                    const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                    contentEl.innerHTML = escapeHtml(currentAssistantContent) + '<span class="typing-indicator"></span>';
                    scrollToBottom();
                }
            }

            function finalizeAssistantMessage() {
                if (currentAssistantMessageEl) {
                    const contentEl = currentAssistantMessageEl.querySelector('.message-content');
                    contentEl.textContent = currentAssistantContent || '(empty response)';
                }
                if (currentAssistantContent) {
                    conversationHistory.push({ role: 'assistant', content: currentAssistantContent });
                }
                currentAssistantMessageEl = null;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function streamChat(messages) {
                isStreaming = true;
                isAborted = false;
                updateButtonStates();
                setStatus('Generating...', 'generating');
                announce('Generating response');
                startAssistantMessage();

                currentHandle = window.ChatSDK.streamChat(messages, {
                    onToken: function(text) {
                        // Ignore tokens that arrive after abort
                        if (isAborted) {
                            return;
                        }
                        updateAssistantMessage(text);
                    },
                    onDone: function() {
                        // Ignore if already aborted
                        if (isAborted) {
                            return;
                        }
                        isStreaming = false;
                        currentHandle = null;
                        finalizeAssistantMessage();
                        setStatus('Finished', 'finished');
                        announce('Response finished');
                        updateButtonStates();
                        setTimeout(clearStatus, 2000);
                    },
                    onError: function(error) {
                        // Ignore if already aborted
                        if (isAborted) {
                            return;
                        }
                        isStreaming = false;
                        currentHandle = null;
                        finalizeAssistantMessage();
                        const errorMessage = 'Error: ' + (error.message || error);
                        setStatus(errorMessage, 'error');
                        announce('Response failed: ' + (error.message || error));
                        updateButtonStates();
                    }
                });
            }

            function sendMessage() {
                const content = promptInput.value.trim();
                if (!content || isStreaming) return;

                promptInput.value = '';
                addUserMessage(content);
                updateButtonStates();

                streamChat([...conversationHistory]);
            }

            function stopGeneration() {
                if (currentHandle && isStreaming) {
                    isAborted = true;
                    currentHandle.abort();
                    isStreaming = false;
                    currentHandle = null;
                    finalizeAssistantMessage();
                    setStatus('Stopped', 'stopped');
                    announce('Response stopped');
                    updateButtonStates();
                    setTimeout(clearStatus, 2000);
                }
            }

            function regenerate() {
                if (isStreaming || conversationHistory.length === 0) return;

                // Remove the last assistant message from history and DOM
                if (conversationHistory[conversationHistory.length - 1].role === 'assistant') {
                    conversationHistory.pop();
                    const lastMessageEl = messagesContainer.querySelector('.message.assistant:last-child');
                    if (lastMessageEl) {
                        lastMessageEl.remove();
                    }
                }

                // If there's still a user message, regenerate from it
                if (conversationHistory.length > 0 && conversationHistory[conversationHistory.length - 1].role === 'user') {
                    streamChat([...conversationHistory]);
                }
            }

            // Event listeners
            sendButton.addEventListener('click', sendMessage);
            stopButton.addEventListener('click', stopGeneration);
            regenerateButton.addEventListener('click', regenerate);

            promptInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            promptInput.addEventListener('input', function() {
                updateButtonStates();
                // Auto-resize textarea
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            // Initial state
            updateButtonStates();
        })();
    </script>
</body>
</html>
