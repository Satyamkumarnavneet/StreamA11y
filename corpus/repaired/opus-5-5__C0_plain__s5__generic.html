<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Assistant</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #d9dce1;          /* decorative separators only */
    --control-border: #6b7280;  /* >= 3:1 against white for UI boundaries */
    --text: #1d2129;
    --muted: #4b5563;           /* >= 4.5:1 on white and on assistant bubbles */
    --user: #1d4ed8;
    --user-text: #ffffff;
    --assistant: #eef0f3;
    --danger: #b91c1c;
    --ok: #15803d;
    --warn: #9a4a06;
    --focus: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 12px;
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  #status {
    font-size: 0.875rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    flex: none;
  }
  #status[data-state="generating"] { color: var(--user); }
  #status[data-state="generating"] .dot { background: var(--user); }
  #status[data-state="finished"] { color: var(--ok); }
  #status[data-state="finished"] .dot { background: var(--ok); }
  #status[data-state="stopped"] { color: var(--warn); }
  #status[data-state="stopped"] .dot { background: var(--warn); }
  #status[data-state="error"] { color: var(--danger); }
  #status[data-state="error"] .dot { background: var(--danger); }
  /* Brief pulse only (under 5 seconds, WCAG 2.2.2), and only if motion is OK. */
  @media (prefers-reduced-motion: no-preference) {
    #status[data-state="generating"] .dot { animation: pulse 1s 4 ease-in-out; }
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  #conversation:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .empty {
    margin: auto;
    color: var(--muted);
    text-align: center;
    font-size: 0.95rem;
  }
  #messages {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .role {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0;
  }
  .bubble {
    padding: 10px 13px;
    border-radius: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.5;
  }
  .msg.user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant); border-bottom-left-radius: 4px; }
  .cursor { margin-left: 1px; }
  .bubble.placeholder .text { color: var(--muted); font-style: italic; }
  .note { font-size: 0.8rem; margin: 0; }
  .note.stopped { color: var(--warn); }
  .note.error { color: var(--danger); }
  .note.finished { color: var(--muted); }

  form {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #prompt {
    width: 100%;
    min-height: 60px;
    max-height: 200px;
    resize: vertical;
    padding: 10px;
    font: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--control-border);
    border-radius: 8px;
  }
  #prompt::placeholder { color: var(--muted); opacity: 1; }
  #prompt:focus-visible, #prompt:focus { outline: 3px solid var(--focus); outline-offset: 1px; }
  .controls { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
  .hint { margin-right: auto; font-size: 0.8rem; color: var(--muted); }
  button {
    font: inherit;
    min-height: 36px;
    min-width: 44px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--control-border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
  #send { background: var(--user); color: #fff; border-color: var(--user); }
  #stop { color: var(--danger); border-color: var(--danger); }

  /* Allow page scrolling on short / heavily zoomed viewports (WCAG 1.4.10). */
  @media (max-height: 480px) {
    html, body { height: auto; }
    .app { height: auto; min-height: 100vh; }
    #conversation { flex: none; min-height: 200px; overflow-y: visible; }
  }
  @media (forced-colors: active) {
    button[aria-disabled="true"] { border-style: dashed; }
    #status .dot { forced-color-adjust: none; border: 1px solid CanvasText; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat Assistant</h1>
    <div id="status" data-state="idle">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text" role="status" aria-live="polite" aria-atomic="true">Ready</span>
    </div>
  </header>

  <main id="conversation" aria-labelledby="conversation-heading" tabindex="-1">
    <h2 id="conversation-heading" class="sr-only">Conversation</h2>
    <p class="empty" id="empty">No messages yet. Ask something to get started.</p>
    <ol id="messages"></ol>
  </main>

  <!-- Announces the completed assistant answer to screen readers (the
       conversation itself is not live, to avoid announcing every token). -->
  <div id="sr-answer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <form id="composer" autocomplete="off" aria-label="Send a message">
    <label for="prompt" class="sr-only">Message</label>
    <textarea id="prompt" placeholder="Type a message…" aria-describedby="prompt-hint"></textarea>
    <div class="controls">
      <span class="hint" id="prompt-hint">Enter to send · Shift+Enter for new line · Escape to stop</span>
      <button type="button" id="regenerate">Regenerate</button>
      <button type="button" id="stop">Stop</button>
      <button type="submit" id="send">Send</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';

  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var regenBtn = document.getElementById('regenerate');
  var form = document.getElementById('composer');
  var convEl = document.getElementById('conversation');
  var listEl = document.getElementById('messages');
  var emptyEl = document.getElementById('empty');
  var statusEl = document.getElementById('status');
  var statusTextEl = document.getElementById('status-text');
  var srAnswerEl = document.getElementById('sr-answer');

  // Each message: { role, content, state?: 'streaming'|'finished'|'stopped'|'error', error? }
  var messages = [];
  // DOM elements kept in sync with messages (updated in place, not rebuilt,
  // so screen reader reading position is not disrupted).
  var msgEls = [];

  // Active stream or null. Callbacks from inactive streams are ignored
  // (handles a late onToken after abort()).
  var current = null;
  var runCounter = 0;

  // ---- Live region helper: clears then sets so repeated text is re-announced.
  var announceTimers = new WeakMap();
  function announce(el, text) {
    var t = announceTimers.get(el);
    if (t) clearTimeout(t);
    el.textContent = '';
    announceTimers.set(el, setTimeout(function () {
      el.textContent = text;
    }, 60));
  }

  function setStatus(state, text) {
    statusEl.setAttribute('data-state', state);
    announce(statusTextEl, text);
  }

  function isNearBottom() {
    return convEl.scrollHeight - convEl.scrollTop - convEl.clientHeight < 80;
  }
  function scrollToBottom() {
    convEl.scrollTop = convEl.scrollHeight;
  }

  function hasUserMessage() {
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') return true;
    }
    return false;
  }

  // aria-disabled keeps buttons focusable, so focus is never lost to <body>
  // when a button becomes unavailable (e.g. Stop after stopping).
  function setDisabled(btn, disabled) {
    btn.setAttribute('aria-disabled', disabled ? 'true' : 'false');
  }
  function isDisabled(btn) {
    return btn.getAttribute('aria-disabled') === 'true';
  }

  function updateControls() {
    var streaming = current !== null;
    setDisabled(sendBtn, streaming || promptEl.value.trim() === '');
    setDisabled(stopBtn, !streaming);
    setDisabled(regenBtn, !hasUserMessage());
  }

  function errorMessageOf(err) {
    if (!err) return 'Unknown error';
    if (typeof err === 'string') return err;
    if (err.message) return String(err.message);
    try { return String(err); } catch (e) { return 'Unknown error'; }
  }

  function createMessageEl() {
    var li = document.createElement('li');
    var role = document.createElement('p');
    role.className = 'role';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var text = document.createElement('span');
    text.className = 'text';
    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.setAttribute('aria-hidden', 'true');
    cursor.textContent = '▍';
    bubble.appendChild(text);
    bubble.appendChild(cursor);
    var note = document.createElement('p');
    note.className = 'note';
    li.appendChild(role);
    li.appendChild(bubble);
    li.appendChild(note);
    return { li: li, role: role, bubble: bubble, text: text, cursor: cursor, note: note };
  }

  function fillBubble(parts, msg) {
    if (msg.role === 'assistant' && msg.content === '') {
      parts.bubble.classList.add('placeholder');
      if (msg.state === 'streaming') parts.text.textContent = 'Thinking…';
      else if (msg.state === 'stopped') parts.text.textContent = '(stopped before any text was generated)';
      else if (msg.state === 'error') parts.text.textContent = '(no answer)';
      else parts.text.textContent = '(empty answer)';
    } else {
      parts.bubble.classList.remove('placeholder');
      parts.text.textContent = msg.content;
    }
    parts.cursor.hidden = !(msg.role === 'assistant' && msg.state === 'streaming');
  }

  function updateMessageParts(parts, msg) {
    parts.li.className = 'msg ' + msg.role;
    parts.role.textContent = msg.role === 'user' ? 'You' : 'Assistant';
    fillBubble(parts, msg);
    var noteText = '';
    var noteClass = '';
    if (msg.role === 'assistant' && msg.state && msg.state !== 'streaming') {
      noteClass = msg.state;
      if (msg.state === 'stopped') noteText = 'Stopped — partial answer kept.';
      else if (msg.state === 'error') noteText = 'Error: ' + (msg.error || 'Unknown error');
      else if (msg.state === 'finished') noteText = 'Finished';
    }
    parts.note.className = 'note' + (noteClass ? ' ' + noteClass : '');
    parts.note.textContent = noteText;
    parts.note.hidden = noteText === '';
  }

  function render() {
    var stick = isNearBottom();
    emptyEl.hidden = messages.length !== 0;
    for (var i = 0; i < messages.length; i++) {
      if (!msgEls[i]) {
        msgEls[i] = createMessageEl();
        listEl.appendChild(msgEls[i].li);
      }
      updateMessageParts(msgEls[i], messages[i]);
    }
    while (msgEls.length > messages.length) {
      var gone = msgEls.pop();
      if (gone.li.parentNode) gone.li.parentNode.removeChild(gone.li);
    }
    if (stick) scrollToBottom();
    updateControls();
  }

  function updateMessageEl(index) {
    var parts = msgEls[index];
    if (!parts) { render(); return; }
    var stick = isNearBottom();
    fillBubble(parts, messages[index]);
    if (stick) scrollToBottom();
  }

  function historyFor(uptoExclusive) {
    var out = [];
    for (var i = 0; i < uptoExclusive; i++) {
      var m = messages[i];
      if (m.role === 'assistant' && m.content === '') continue;
      out.push({ role: m.role, content: m.content });
    }
    return out;
  }

  function finishRun(id, state, err) {
    if (!current || current.id !== id) return;
    var idx = current.msgIndex;
    current = null;
    var msg = messages[idx];
    if (msg) {
      msg.state = state;
      if (err !== undefined) msg.error = errorMessageOf(err);
    }
    render();
    if (state === 'finished') {
      setStatus('finished', 'Finished');
      if (msg) {
        announce(srAnswerEl, 'Assistant answer: ' + (msg.content === '' ? '(empty answer)' : msg.content));
      }
    } else if (state === 'error') {
      setStatus('error', 'Error: ' + errorMessageOf(err));
    }
  }

  function startStream() {
    var history = historyFor(messages.length);
    messages.push({ role: 'assistant', content: '', state: 'streaming' });
    var msgIndex = messages.length - 1;
    var id = ++runCounter;
    current = { id: id, msgIndex: msgIndex, handle: null };
    render();
    scrollToBottom();
    setStatus('generating', 'Assistant is generating an answer…');

    var handlers = {
      onToken: function (text) {
        if (!current || current.id !== id) return;
        if (text == null) return;
        messages[msgIndex].content += String(text);
        updateMessageEl(msgIndex);
      },
      onDone: function () { finishRun(id, 'finished'); },
      onError: function (error) { finishRun(id, 'error', error); }
    };

    var handle;
    try {
      if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
        throw new Error('Chat service is unavailable.');
      }
      handle = window.ChatSDK.streamChat(history, handlers);
    } catch (e) {
      finishRun(id, 'error', e);
      return;
    }
    if (current && current.id === id) current.handle = handle;
  }

  function stop(silent) {
    if (!current) return;
    var c = current;
    current = null;
    try {
      if (c.handle && typeof c.handle.abort === 'function') c.handle.abort();
    } catch (e) { /* run already detached */ }
    var msg = messages[c.msgIndex];
    if (msg) msg.state = 'stopped';
    render();
    if (!silent) setStatus('stopped', 'Stopped — partial answer kept');
  }

  function send() {
    if (current) return;
    var text = promptEl.value;
    if (text.trim() === '') return;
    messages.push({ role: 'user', content: text });
    promptEl.value = '';
    startStream();
    promptEl.focus();
  }

  function regenerate() {
    var lastUser = -1;
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') { lastUser = i; break; }
    }
    if (lastUser === -1) return;
    if (current) stop(true);
    messages.splice(lastUser + 1);
    startStream();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (isDisabled(sendBtn)) return;
    send();
  });
  stopBtn.addEventListener('click', function () {
    if (isDisabled(stopBtn)) return;
    stop(false);
  });
  regenBtn.addEventListener('click', function () {
    if (isDisabled(regenBtn)) return;
    regenerate();
  });
  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && current && !e.isComposing) {
      e.preventDefault();
      stop(false);
    }
  });
  promptEl.addEventListener('input', updateControls);

  render();
  promptEl.focus();
})();
</script>
</body>
</html>
