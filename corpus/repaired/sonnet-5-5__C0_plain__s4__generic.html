<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1c1f26;
    --muted: #4f5766;
    --border: #d9dde3;
    --control-border: #6b7280;
    --user-bg: #2563eb;
    --user-text: #ffffff;
    --bot-bg: #eef0f4;
    --accent: #1d4ed8;
    --accent-text: #ffffff;
    --ok: #15803d;
    --warn: #9a4308;
    --err: #b91c1c;
    --err-bg: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #181b21;
      --text: #e8eaee;
      --muted: #a8aeba;
      --border: #2c313a;
      --control-border: #8b92a0;
      --user-bg: #2f5fd0;
      --bot-bg: #242932;
      --accent: #7aa5ff;
      --accent-text: #0b0d12;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
      --err-bg: #2a1717;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
  }
  header h1 { font-size: 1.125rem; margin: 0; font-weight: 600; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9375rem;
    color: var(--muted);
    min-height: 24px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  .status[data-state="generating"] { color: var(--accent); }
  .status[data-state="generating"] .dot { background: var(--accent); }
  .status[data-state="finished"] { color: var(--ok); }
  .status[data-state="finished"] .dot { background: var(--ok); }
  .status[data-state="stopped"] { color: var(--warn); }
  .status[data-state="stopped"] .dot { background: var(--warn); }
  .status[data-state="error"] { color: var(--err); }
  .status[data-state="error"] .dot { background: var(--err); }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .empty {
    margin: auto;
    color: var(--muted);
    text-align: center;
  }
  .messages {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .who { font-size: 0.8125rem; font-weight: 600; color: var(--muted); margin: 0 4px 3px; }
  .bubble {
    padding: 9px 13px;
    border-radius: 14px;
    border: 1px solid transparent;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--bot-bg); border-bottom-left-radius: 4px; }
  .assistant.error .bubble { background: var(--err-bg); border-color: var(--err); }
  .bubble .placeholder { color: var(--muted); font-style: italic; }
  .user .bubble .placeholder { color: inherit; }
  .assistant.streaming .bubble { border-color: var(--control-border); border-style: dashed; }
  .tag { font-size: 0.875rem; margin: 4px 4px 0; color: var(--muted); }
  .tag.stopped { color: var(--warn); }
  .tag.error { color: var(--err); }

  .composer {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .composer label { font-weight: 600; font-size: 0.9375rem; }
  textarea {
    width: 100%;
    resize: none;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--control-border);
    border-radius: 10px;
    padding: 9px 12px;
    max-height: 160px;
    min-height: 44px;
  }
  button {
    font: inherit;
    font-weight: 500;
    min-height: 44px;
    min-width: 44px;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--control-border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  textarea:focus-visible, button:focus-visible, #log:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  #send { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .hint { font-size: 0.875rem; color: var(--muted); margin-left: auto; }
  @media (max-width: 520px) { .hint { display: none; } .msg { max-width: 94%; } }
  @media (forced-colors: active) {
    .bubble { border-color: CanvasText; }
    .dot { background: CanvasText !important; forced-color-adjust: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat Assistant</h1>
    <div class="status" id="status" data-state="idle" role="status" aria-live="polite" aria-atomic="true">
      <span class="dot" aria-hidden="true"></span><span id="statusText">Ready</span>
    </div>
  </header>

  <main>
    <div id="log" role="region" aria-label="Conversation history" tabindex="0">
      <p class="empty" id="empty">Send a message to start the conversation.</p>
      <ol class="messages" id="messages" role="list"></ol>
    </div>

    <div class="composer">
      <label for="prompt">Message</label>
      <textarea id="prompt" rows="1" placeholder="Type a message…" autocomplete="off" aria-describedby="hint"></textarea>
      <div class="actions">
        <button id="send" type="button">Send</button>
        <button id="stop" type="button" disabled>Stop</button>
        <button id="regenerate" type="button" disabled>Regenerate</button>
        <span class="hint" id="hint">Enter to send. Shift+Enter for a new line.</span>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var listEl = document.getElementById('messages');
  var emptyEl = document.getElementById('empty');
  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var regenBtn = document.getElementById('regenerate');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');

  // history items: { role, content, status?, error?, el, bodyEl, tagEl }
  var history = [];
  var current = null;

  function setStatus(state, text) {
    statusEl.setAttribute('data-state', state);
    statusText.textContent = text;
  }

  function updateControls() {
    var streaming = current !== null;
    var hasUser = history.some(function (m) { return m.role === 'user'; });
    var active = document.activeElement;

    sendBtn.disabled = streaming;
    stopBtn.disabled = !streaming;
    regenBtn.disabled = streaming || !hasUser;
    logEl.setAttribute('aria-busy', streaming ? 'true' : 'false');

    // Do not strand keyboard / screen reader focus on a control that just became disabled.
    if (active && active.disabled) promptEl.focus();
  }

  function nearBottom() {
    return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
  }
  function scrollToBottom() { logEl.scrollTop = logEl.scrollHeight; }

  function updateBubble(msg) {
    if (!msg.bodyEl) return;
    if (msg.content) {
      msg.bodyEl.textContent = msg.content;
      return;
    }
    var text = '';
    if (msg.role === 'assistant') {
      if (msg.status === 'streaming') text = 'Waiting for the answer…';
      else if (msg.status === 'stopped') text = 'No text was received before stopping.';
      else if (msg.status === 'error') text = 'No text was received.';
      else text = 'The answer was empty.';
    }
    msg.bodyEl.textContent = '';
    var span = document.createElement('span');
    span.className = 'placeholder';
    span.textContent = text;
    msg.bodyEl.appendChild(span);
  }

  function applyTag(msg) {
    if (!msg.tagEl) return;
    var cls = '', text = '';
    if (msg.status === 'stopped') { cls = 'stopped'; text = 'Stopped. The partial answer was kept.'; }
    else if (msg.status === 'error') { cls = 'error'; text = 'Error: ' + (msg.error || 'The response failed.'); }
    if (text) {
      msg.tagEl.className = 'tag ' + cls;
      msg.tagEl.textContent = text;
      msg.tagEl.hidden = false;
    } else {
      msg.tagEl.hidden = true;
      msg.tagEl.textContent = '';
    }
  }

  function applyMsgClasses(msg) {
    if (!msg.el) return;
    msg.el.className = 'msg ' + msg.role +
      (msg.status === 'streaming' ? ' streaming' : '') +
      (msg.status === 'error' ? ' error' : '');
  }

  function addMessageEl(msg) {
    var li = document.createElement('li');
    var who = document.createElement('div');
    who.className = 'who';
    who.textContent = msg.role === 'user' ? 'You' : 'Assistant';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var tag = document.createElement('div');
    tag.hidden = true;
    li.appendChild(who);
    li.appendChild(bubble);
    li.appendChild(tag);
    listEl.appendChild(li);
    msg.el = li;
    msg.bodyEl = bubble;
    msg.tagEl = tag;
    updateBubble(msg);
    applyMsgClasses(msg);
    applyTag(msg);
    emptyEl.hidden = true;
    scrollToBottom();
  }

  function truncateHistory(length) {
    while (history.length > length) {
      var m = history.pop();
      if (m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el);
    }
    emptyEl.hidden = history.length > 0;
  }

  function buildPayload() {
    return history
      .filter(function (m) { return m.content && m.content.length > 0; })
      .map(function (m) { return { role: m.role, content: m.content }; });
  }

  function finishSession(session, status, statusState, statusMsg, errText) {
    if (!session.active) return;
    session.active = false;
    if (current === session) current = null;
    session.msg.status = status;
    if (errText) session.msg.error = errText;
    updateBubble(session.msg);
    applyMsgClasses(session.msg);
    applyTag(session.msg);
    setStatus(statusState, statusMsg);
    updateControls();
    if (nearBottom()) scrollToBottom();
  }

  function startStream() {
    var payload = buildPayload();
    var msg = { role: 'assistant', content: '', status: 'streaming' };
    history.push(msg);
    addMessageEl(msg);
    var session = { msg: msg, active: true, handle: null };
    current = session;
    setStatus('generating', 'Assistant is generating an answer…');
    updateControls();

    function onToken(text) {
      if (!session.active || current !== session) return;
      var chunk = text == null ? '' : String(text);
      if (!chunk) return;
      var stick = nearBottom();
      msg.content += chunk;
      msg.bodyEl.textContent = msg.content;
      if (stick) scrollToBottom();
    }
    function onDone() {
      finishSession(session, 'done', 'finished', 'Finished. The answer is complete.');
    }
    function onError(err) {
      var text = (err && err.message) ? err.message : (err ? String(err) : 'Unknown error');
      finishSession(session, 'error', 'error', 'Error: ' + text, text);
    }

    try {
      if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
        throw new Error('Chat service is not available.');
      }
      session.handle = window.ChatSDK.streamChat(payload, {
        onToken: onToken,
        onDone: onDone,
        onError: onError
      });
    } catch (e) {
      onError(e);
    }
  }

  function send() {
    if (current) return;
    var text = promptEl.value.trim();
    if (!text) {
      setStatus('idle', 'Please type a message before sending.');
      promptEl.focus();
      return;
    }
    var userMsg = { role: 'user', content: text };
    history.push(userMsg);
    addMessageEl(userMsg);
    promptEl.value = '';
    autosize();
    startStream();
  }

  function stop() {
    var session = current;
    if (!session) return;
    session.active = false; // ignore any in-flight chunk
    current = null;
    try {
      if (session.handle && typeof session.handle.abort === 'function') session.handle.abort();
    } catch (e) { /* ignore */ }
    session.msg.status = 'stopped';
    updateBubble(session.msg);
    applyMsgClasses(session.msg);
    applyTag(session.msg);
    setStatus('stopped', 'Stopped. The partial answer was kept.');
    updateControls();
  }

  function regenerate() {
    if (current) return;
    var idx = -1;
    for (var i = history.length - 1; i >= 0; i--) {
      if (history[i].role === 'user') { idx = i; break; }
    }
    if (idx < 0) return;
    truncateHistory(idx + 1);
    startStream();
  }

  function autosize() {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
  }

  sendBtn.addEventListener('click', send);
  stopBtn.addEventListener('click', stop);
  regenBtn.addEventListener('click', regenerate);
  promptEl.addEventListener('input', autosize);
  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  updateControls();
  promptEl.focus();
})();
</script>
</body>
</html>
