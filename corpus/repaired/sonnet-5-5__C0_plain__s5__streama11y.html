<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Assistant</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #dcdfe5;
    --text: #1d2129;
    --muted: #6b7280;
    --user: #2563eb;
    --user-text: #ffffff;
    --assistant: #eef0f4;
    --ok: #15803d;
    --warn: #b45309;
    --err: #b91c1c;
    --busy: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 820px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  #status {
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--assistant);
    color: var(--muted);
    white-space: nowrap;
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #status::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    flex: none;
  }
  #status[data-state="generating"] { color: var(--busy); background: #e5eeff; }
  #status[data-state="generating"]::before { animation: pulse 1s ease-in-out infinite; }
  #status[data-state="finished"] { color: var(--ok); background: #e3f6e9; }
  #status[data-state="stopped"] { color: var(--warn); background: #fdf0dc; }
  #status[data-state="error"] { color: var(--err); background: #fde6e6; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty { margin: auto; color: var(--muted); font-size: 14px; text-align: center; }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .role { font-size: 11px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
  .bubble {
    padding: 9px 13px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.45;
    font-size: 15px;
    min-height: 1.45em;
  }
  .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--assistant); border-bottom-left-radius: 4px; }
  .assistant.streaming .bubble::after {
    content: "";
    display: inline-block;
    width: 7px; height: 1em;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: var(--muted);
    animation: blink 1s steps(2, start) infinite;
  }
  .assistant.error .bubble { border: 1px solid #f1b4b4; }
  .assistant.stopped .bubble { border: 1px dashed #e0b979; }
  .meta { font-size: 12px; margin-top: 4px; }
  .meta.stopped { color: var(--warn); }
  .meta.error { color: var(--err); }
  .meta.thinking { color: var(--busy); }

  footer { border-top: 1px solid var(--border); padding: 12px 16px; background: var(--panel); }
  #composer { display: flex; gap: 8px; align-items: flex-end; }
  #prompt {
    flex: 1;
    resize: none;
    font: inherit;
    font-size: 15px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 160px;
    min-height: 42px;
    line-height: 1.4;
  }
  #prompt:focus { outline: 2px solid #93b4f8; border-color: transparent; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f0f2f6; }
  button:focus-visible { outline: 2px solid #93b4f8; outline-offset: 1px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #send { background: var(--user); color: #fff; border-color: var(--user); }
  #send:hover:not(:disabled) { background: #1d4ed8; }
  #stop { color: var(--err); border-color: #f1b4b4; }
  .hint { font-size: 12px; color: var(--muted); margin-left: auto; align-self: center; }

  @keyframes blink { to { visibility: hidden; } }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) {
    #status::before, .assistant.streaming .bubble::after { animation: none !important; }
  }
  @media (max-width: 520px) { .hint { display: none; } .msg { max-width: 94%; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Chat Assistant</h1>
    <div id="status" role="status" aria-live="polite" data-state="idle">Ready</div>
  </header>

  <main id="log" aria-label="Conversation" aria-live="off"></main>

  <footer>
    <div id="composer">
      <textarea id="prompt" rows="1" placeholder="Type a message…" aria-label="Message"></textarea>
      <button id="send" type="button">Send</button>
    </div>
    <div class="actions">
      <button id="stop" type="button" disabled>Stop</button>
      <button id="regenerate" type="button" disabled>Regenerate</button>
      <span class="hint">Enter to send · Shift+Enter for a new line</span>
    </div>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var promptEl = document.getElementById('prompt');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var regenBtn = document.getElementById('regenerate');
  var statusEl = document.getElementById('status');

  var messages = [];
  var current = null;
  var els = new WeakMap();

  function setStatus(state, text) {
    statusEl.setAttribute('data-state', state);
    statusEl.textContent = text;
    statusEl.title = text;
  }

  function lastUserIndex() {
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'user') return i;
    }
    return -1;
  }

  // Sets disabled state on a button; if it currently has focus and is about to
  // be disabled, move focus to the message box first so focus is never lost.
  function setDisabled(btn, disabled) {
    if (disabled && document.activeElement === btn) {
      promptEl.focus();
    }
    btn.disabled = disabled;
  }

  function updateControls() {
    var busy = !!current;
    setDisabled(sendBtn, busy);
    setDisabled(stopBtn, !busy);
    setDisabled(regenBtn, lastUserIndex() === -1);
  }

  function nearBottom() {
    return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
  }
  function scrollToBottom() { logEl.scrollTop = logEl.scrollHeight; }

  function metaFor(m) {
    if (m.role !== 'assistant') return { cls: '', text: '' };
    if (m.state === 'streaming') {
      return m.content ? { cls: '', text: '' } : { cls: 'thinking', text: 'Generating…' };
    }
    if (m.state === 'stopped') return { cls: 'stopped', text: m.content ? 'Stopped — partial answer kept' : 'Stopped before any text arrived' };
    if (m.state === 'error') return { cls: 'error', text: 'Error: ' + (m.errorText || 'the response failed') + (m.content ? ' (partial answer kept)' : '') };
    return { cls: '', text: '' };
  }

  function refreshMessage(m) {
    var e = els.get(m);
    if (!e) return;
    e.root.className = 'msg ' + m.role + (m.role === 'assistant' ? ' ' + m.state : '');
    if (e.body.textContent !== m.content) e.body.textContent = m.content;
    var meta = metaFor(m);
    e.meta.className = 'meta ' + meta.cls;
    e.meta.textContent = meta.text;
    e.meta.hidden = !meta.text;
  }

  function render() {
    logEl.textContent = '';
    if (!messages.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No messages yet. Say something to get started.';
      logEl.appendChild(empty);
      updateControls();
      return;
    }
    messages.forEach(function (m) {
      var root = document.createElement('div');
      var role = document.createElement('div');
      role.className = 'role';
      role.textContent = m.role === 'user' ? 'You' : 'Assistant';
      var body = document.createElement('div');
      body.className = 'bubble';
      var meta = document.createElement('div');
      root.appendChild(role);
      root.appendChild(body);
      root.appendChild(meta);
      logEl.appendChild(root);
      els.set(m, { root: root, body: body, meta: meta });
      refreshMessage(m);
    });
    scrollToBottom();
    updateControls();
  }

  function buildPayload(upTo) {
    var out = [];
    for (var i = 0; i < upTo; i++) {
      var m = messages[i];
      if (typeof m.content === 'string' && m.content.trim() !== '') {
        out.push({ role: m.role, content: m.content });
      }
    }
    return out;
  }

  function errorMessage(err) {
    if (!err) return 'unknown error';
    if (typeof err === 'string') return err;
    return err.message || String(err);
  }

  function startStream() {
    var assistant = { role: 'assistant', content: '', state: 'streaming' };
    var payload = buildPayload(messages.length);
    messages.push(assistant);

    var s = { aborted: false, ended: false, handle: null, assistant: assistant };
    current = s;
    render();
    setStatus('generating', 'Generating…');

    function live() { return current === s && !s.aborted && !s.ended; }

    function finish(state, errText) {
      s.ended = true;
      current = null;
      assistant.state = state;
      if (errText) assistant.errorText = errText;
      refreshMessage(assistant);
      updateControls();
    }

    var callbacks = {
      onToken: function (text) {
        if (!live()) return;
        var chunk = text == null ? '' : String(text);
        if (!chunk) return;
        var stick = nearBottom();
        var firstChunk = assistant.content === '';
        assistant.content += chunk;
        var e = els.get(assistant);
        if (e) {
          e.body.textContent = assistant.content;
          if (firstChunk) refreshMessage(assistant);
        }
        if (stick) scrollToBottom();
      },
      onDone: function () {
        if (!live()) return;
        finish('done');
        setStatus('finished', 'Finished');
      },
      onError: function (err) {
        if (!live()) return;
        var msg = errorMessage(err);
        finish('error', msg);
        setStatus('error', 'Error: ' + msg);
      }
    };

    try {
      s.handle = window.ChatSDK.streamChat(payload, callbacks);
    } catch (err) {
      if (live()) {
        var msg = errorMessage(err);
        finish('error', msg);
        setStatus('error', 'Error: ' + msg);
      }
    }
    if (s.aborted && s.handle && typeof s.handle.abort === 'function') {
      try { s.handle.abort(); } catch (e) { /* ignore */ }
    }
  }

  function abortCurrent() {
    var s = current;
    if (!s) return null;
    s.aborted = true;
    current = null;
    try {
      if (s.handle && typeof s.handle.abort === 'function') s.handle.abort();
    } catch (e) { /* ignore */ }
    return s.assistant;
  }

  function send() {
    if (current) return;
    var text = promptEl.value.trim();
    if (!text) return;
    messages.push({ role: 'user', content: text });
    promptEl.value = '';
    autosize();
    startStream();
    promptEl.focus();
  }

  function stop() {
    var a = abortCurrent();
    if (!a) return;
    a.state = 'stopped';
    refreshMessage(a);
    updateControls(); // moves focus to the message box since Stop becomes disabled
    setStatus('stopped', 'Stopped');
  }

  function regenerate() {
    var idx = lastUserIndex();
    if (idx === -1) return;
    abortCurrent();
    messages.length = idx + 1;
    startStream();
  }

  function autosize() {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
  }

  sendBtn.addEventListener('click', send);
  stopBtn.addEventListener('click', stop);
  regenBtn.addEventListener('click', regenerate);
  promptEl.addEventListener('input', autosize);
  promptEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  if (!window.ChatSDK || typeof window.ChatSDK.streamChat !== 'function') {
    setStatus('error', 'Error: chat service unavailable');
  } else {
    setStatus('idle', 'Ready');
  }
  render();
  promptEl.focus();
})();
</script>
</body>
</html>
